name: Finalize 3.4.4.2.2 source block

on:
  push:
    branches:
      - "fix/3.4.4.2.2-rule-context-rendering"

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[source-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.4.4.2.2-rule-context-rendering
          fetch-depth: 0

      - name: Normalize Mind source and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kanger/src/org/kanger/Mind.java')
          text = path.read_text(encoding='utf-8')
          start_marker = '    public boolean isUnitDeleted(IUnit unit) {'
          end_marker = '    @Override\n    public IMind getTop() {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              '    public boolean isUnitDeleted(IUnit unit) {',
              '        UnitType unitType = unit.getUnitType();',
              '        long unitId = unit.getId();',
              '        for (IMind level = this; level != null; level = level.getNext()) {',
              '            Mind current = (Mind) level;',
              '            synchronized (current.locker) {',
              '                Set<Long> restoredIds = current.restored.get(unitType);',
              '                if (restoredIds != null && restoredIds.contains(unitId)) {',
              '                    return false;',
              '                }',
              '                Set<Long> deletedIds = current.deleted.get(unitType);',
              '                if (deletedIds != null && deletedIds.contains(unitId)) {',
              '                    return true;',
              '                }',
              '            }',
              '        }',
              '        return false;',
              '    }',
              '',
              '    public void setUnitDeleted(IUnit unit, boolean on) {',
              '        synchronized (locker) {',
              '            UnitType unitType = unit.getUnitType();',
              '            long unitId = unit.getId();',
              '            if (on) {',
              '                if (!isUnitDeleted(unit)) {',
              '                    Set<Long> restoredIds = restored.get(unitType);',
              '                    if (restoredIds != null) {',
              '                        restoredIds.remove(unitId);',
              '                    }',
              '                    if (!isUnitDeleted(unit)) {',
              '                        Set<Long> deletedIds = deleted.get(unitType);',
              '                        if (deletedIds == null) {',
              '                            deletedIds = new HashSet<>();',
              '                            deleted.put(unitType, deletedIds);',
              '                        }',
              '                        deletedIds.add(unitId);',
              '                    }',
              '                }',
              '            } else if (isUnitDeleted(unit)) {',
              '                Set<Long> deletedIds = deleted.get(unitType);',
              '                if (deletedIds != null) {',
              '                    deletedIds.remove(unitId);',
              '                }',
              '                if (unit.getMindId() != id || isUnitDeleted(unit)) {',
              '                    Set<Long> restoredIds = restored.get(unitType);',
              '                    if (restoredIds == null) {',
              '                        restoredIds = new HashSet<>();',
              '                        restored.put(unitType, restoredIds);',
              '                    }',
              '                    restoredIds.add(unitId);',
              '                }',
              '            }',
              '        }',
              '    }',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          git rm .github/workflows/finalize-3.4.4.2.2-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Mind.java
          git commit -m "[source-finalized] Normalize unit-state synchronization"
          git push origin HEAD:fix/3.4.4.2.2-rule-context-rendering
