name: Apply Rule candidate lock fix

on:
  push:
    branches:
      - arch/3.5.0-core-consolidation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rule-candidate-lock-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'arch/3.5.0-core-consolidation' || github.ref == 'refs/heads/arch/3.5.0-core-consolidation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: arch/3.5.0-core-consolidation
          fetch-depth: 0

      - name: Apply exact lock-boundary patch
        run: python tools/apply_rule_candidate_lock_fix.py

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/factory/RuleFactory.java \
                  kanger/src/org/kanger/factory/RuleCandidateIndex.java
          git commit -m "Fix Rule candidate lock inversion"
          git push origin HEAD:arch/3.5.0-core-consolidation
