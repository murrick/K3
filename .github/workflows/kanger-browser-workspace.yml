name: KANGER browser workspace state

on:
  push:
    branches:
      - "server/**"
      - "ui/**"
      - "fix/**"
    paths:
      - "html/workspace.js"
      - "html/editor-state.js"
      - "html/presentation.js"
      - "html/javascript-mode.js"
      - "html/editor-local-file.js"
      - "html/bottom-layout.js"
      - "html/console.html"
      - "kanger-server/scripts/qualify-workspace-state.js"
      - "kanger-server/scripts/qualify-editor-state.js"
      - "kanger-server/scripts/qualify-browser-presentation.js"
      - ".github/workflows/kanger-browser-workspace.yml"
  pull_request:
    paths:
      - "html/workspace.js"
      - "html/editor-state.js"
      - "html/presentation.js"
      - "html/javascript-mode.js"
      - "html/editor-local-file.js"
      - "html/bottom-layout.js"
      - "html/console.html"
      - "kanger-server/scripts/qualify-workspace-state.js"
      - "kanger-server/scripts/qualify-editor-state.js"
      - "kanger-server/scripts/qualify-browser-presentation.js"
      - ".github/workflows/kanger-browser-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Runtime workspace, Editor staging, and presentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate workspace, Editor, and presentation authorities
        shell: bash
        run: |
          node --check html/workspace.js
          node --check html/editor-state.js
          node --check html/presentation.js
          node --check kanger-server/scripts/qualify-workspace-state.js
          node --check kanger-server/scripts/qualify-editor-state.js
          node --check kanger-server/scripts/qualify-browser-presentation.js
          grep -Fq '<script src="workspace.js"></script>' html/console.html
          grep -q 'KANGER_WORKSPACE_STATE' html/workspace.js
          grep -q 'canonicalSourceName' html/workspace.js
          grep -q 'canonicalStorageName' html/workspace.js
          grep -Fq '<script src="editor-state.js"></script>' html/console.html
          grep -q 'KANGER_EDITOR_STATE' html/editor-state.js
          grep -q "'CONTEXT'" html/editor-state.js
          grep -q "'EDITED'" html/editor-state.js
          grep -q "'RECOVERY'" html/editor-state.js
          grep -q 'source_recovery' kanger-server/scripts/qualify-workspace-state.js
          grep -q 'storage_switch_failed' kanger-server/scripts/qualify-workspace-state.js
          grep -q 'KANGER_WORKSPACE_STATE.version === 2' html/presentation.js
          ! grep -q 'workspace\.source' html/workspace.js
          ! grep -q 'repository_state' html/workspace.js
          ! grep -q 'workspace\.source' html/presentation.js
          ! grep -q 'tech-source' html/presentation.js
          ! grep -q 'source-name' html/presentation.js
          ! grep -q 'innerHTML' html/workspace.js
          ! grep -Fq 'document.write(' html/workspace.js
          ! grep -q 'document.cookie' html/workspace.js
          ! grep -q 'eval(' html/workspace.js
          ! grep -q 'document.cookie' html/editor-state.js
          ! grep -q 'eval(' html/editor-state.js

      - name: Run runtime workspace qualification
        shell: bash
        run: |
          node kanger-server/scripts/qualify-workspace-state.js

      - name: Run Editor staging qualification
        shell: bash
        run: |
          node kanger-server/scripts/qualify-editor-state.js

      - name: Run Browser presentation qualification
        shell: bash
        run: |
          node kanger-server/scripts/qualify-browser-presentation.js
