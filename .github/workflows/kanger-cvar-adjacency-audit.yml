name: KANGER C-variable adjacency audit

on:
  push:
    branches:
      - 'audit/3.5.0-cvar-adjacency'
    paths:
      - '.github/workflows/kanger-cvar-adjacency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-diagnostic:
    name: Materialize no-virtual-child variant
    runs-on: ubuntu-latest

    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: audit/3.5.0-cvar-adjacency
          fetch-depth: 0

      - name: Replace virtual child substitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kanger/src/org/kanger/Linker.java')
          text = path.read_text(encoding='utf-8')

          blocks = [
          '''                                                    TValue s = null;
                                                    if (tm.isCVariable() && tm.getParentId(mind) == -1 && slave.getRuleId() == tm.getRuleId() && !tm.isDomini() /*&& tm.getRight().isSubstitutable()*/ /*&& tm.getSlaves().contains(t.getId())*/) {
                                                        Term tn = (Term) tm.getChild(mind);
                                                        if (tn == null) {
                                                            tn = (Term) mind.getTerms().createCVar(master.getRule(), tm.getName(mind), tm);
                                                        }
                                                        tm = tn;
                                                    } else {
                                                        s = mind.getTValues().find(t, tm);
                                                    }
''',
          '''                                                    TValue s = null;
                                                    if (tm.isCVariable() && tm.getParentId(mind) == -1 && master.getRuleId() == tm.getRuleId() && !tm.isDomini() /*&& tm.getRight().isSubstitutable()*/ /*&& tm.getSlaves().contains(t.getId())*/) {
                                                        Term tn = (Term) tm.getChild(mind);
                                                        if (tn == null) {
                                                            tn = (Term) mind.getTerms().createCVar(slave.getRule(), tm.getName(mind), tm);
                                                        }
                                                        tm = tn;
                                                    } else {
                                                        s = mind.getTValues().find(t, tm);
                                                    }
'''
          ]

          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('Virtual-child block identity changed')
              text = text.replace(
                  block,
                  '                                                    TValue s = mind.getTValues().find(t, tm);\n')

          path.write_text(text, encoding='utf-8')
          PY

          ! grep -qE 'getChild\(mind\)|getParentId\(mind\)|createCVar\([^;]*, tm\)' \
            kanger/src/org/kanger/Linker.java
          git diff --check

      - name: Publish diagnostic commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kanger/src/org/kanger/Linker.java
          git commit -m 'Remove virtual C-variable child in diagnostic branch'
          git push origin HEAD:audit/3.5.0-cvar-adjacency
