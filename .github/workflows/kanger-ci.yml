name: KANGER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanger-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Maven regression and invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Apply candidate lock-order correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/arch/3.5.0-core-consolidation'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate_path = Path('kanger/src/org/kanger/factory/RuleCandidateIndex.java')
          text = candidate_path.read_text()

          field_anchor = '''    private final Map<Mind, Map<BatchKey, BatchSummary>> batchSummaries = new WeakHashMap<>();
          '''
          if '    private long version = 0L;\n' not in text:
              text = text.replace(field_anchor, field_anchor + '    private long version = 0L;\n', 1)

          text = text.replace(
              '''            positions.clear();
                      batchSummaries.clear();
          ''',
              '''            positions.clear();
                      batchSummaries.clear();
                      ++version;
          ''', 1)

          text = text.replace(
              '''            signatures.release();
                      fallbackSignatures.release();
                      positions.release();
          ''',
              '''            signatures.release();
                      fallbackSignatures.release();
                      positions.release();
                      batchSummaries.clear();
                      ++version;
          ''', 1)

          text = text.replace(
              '''            positions.mergeFrom(childSnapshot.positions);
                      batchSummaries.clear();
          ''',
              '''            positions.mergeFrom(childSnapshot.positions);
                      batchSummaries.clear();
                      ++version;
          ''', 1)

          text = text.replace(
              '''        try {
                      batchSummaries.clear();
                      boolean positional = positionalEligible(rule);
          ''',
              '''        try {
                      batchSummaries.clear();
                      ++version;
                      boolean positional = positionalEligible(rule);
          ''', 1)

          text = text.replace(
              '''        try {
                      batchSummaries.clear();
                      for (List<Domain> branch : rule.getTree()) {
          ''',
              '''        try {
                      batchSummaries.clear();
                      ++version;
                      for (List<Domain> branch : rule.getTree()) {
          ''', 1)

          start = text.index('    private BatchSummary batchSummary(')
          end = text.index('    private Long resolvedTermId(', start)
          replacement = '''    private BatchSummary computeBatchSummary(Domain source,
                                                       boolean candidateAntc,
                                                       Mind activeMind,
                                                       LinkedHashSet<Long> selected) throws Exception {
                  LinkedHashSet<Long> batchedIds = new LinkedHashSet<>();
                  for (long id : selected) {
                      Rule candidate = (Rule) activeMind.getRules().get(id);
                      if (candidate != null
                              && batchGeneratedNonSubstitutablePair(
                              source, candidate, candidateAntc, activeMind)) {
                          batchedIds.add(id);
                      }
                  }
                  return new BatchSummary(batchedIds);
              }

              private void markCachedBatchUsed(Domain source,
                                               Rule sourceRule,
                                               Mind activeMind,
                                               BatchSummary summary) throws Exception {
                  if (!summary.batchedIds.isEmpty()) {
                      source.setUsed(activeMind);
                      sourceRule.setUsed(activeMind);
                  }
              }

              void collectResolvedLocal(Domain source, boolean candidateAntc, Mind mind,
                                        LinkedHashSet<Long> result) throws Exception {
                  SignatureKey signature = signature(source, candidateAntc);
                  Long[] resolvedTermIds = new Long[source.getRange()];
                  for (int position = 0; position < source.getRange(); ++position) {
                      resolvedTermIds[position] = resolvedTermId(source.get(position), mind);
                  }

                  boolean batchEligible = !source.isSubstitutable();
                  Rule sourceRule = batchEligible ? (Rule) source.getRule() : null;
                  Mind activeMind = batchEligible
                          ? (sourceRule.getMind() == null ? mind : sourceRule.getMind())
                          : null;
                  BatchKey batchKey = batchEligible
                          ? new BatchKey(signature, sourceRule.isGenerated())
                          : null;

                  LinkedHashSet<Long> selected;
                  BatchSummary summary = null;
                  long observedVersion;

                  writeLock.lock();
                  try {
                      selected = signatures.get(signature);
                      if (selected.isEmpty()) return;
                      LinkedHashSet<Long> fallback = fallbackSignatures.get(signature);
                      for (int position = 0; position < resolvedTermIds.length; ++position) {
                          Long termId = resolvedTermIds[position];
                          if (termId == null) continue;
                          LinkedHashSet<Long> compatible = positions.get(
                                  new PositionKey(signature, position, termId));
                          compatible.addAll(positions.get(
                                  new PositionKey(signature, position, WILDCARD_TERM_ID)));
                          compatible.addAll(fallback);
                          selected.retainAll(compatible);
                          if (selected.isEmpty()) return;
                      }
                      observedVersion = version;
                      if (batchEligible) {
                          Map<BatchKey, BatchSummary> byKey = batchSummaries.get(activeMind);
                          summary = byKey == null ? null : byKey.get(batchKey);
                      }
                  } finally {
                      writeLock.unlock();
                  }

                  if (batchEligible) {
                      boolean cached = summary != null;
                      if (summary == null) {
                          summary = computeBatchSummary(
                                  source, candidateAntc, activeMind, selected);

                          writeLock.lock();
                          try {
                              if (version == observedVersion) {
                                  Map<BatchKey, BatchSummary> byKey = batchSummaries.get(activeMind);
                                  if (byKey == null) {
                                      byKey = new HashMap<>();
                                      batchSummaries.put(activeMind, byKey);
                                  }
                                  BatchSummary existing = byKey.get(batchKey);
                                  if (existing == null) {
                                      byKey.put(batchKey, summary);
                                  } else {
                                      summary = existing;
                                      cached = true;
                                  }
                              }
                          } finally {
                              writeLock.unlock();
                          }
                      }
                      if (cached) {
                          markCachedBatchUsed(source, sourceRule, activeMind, summary);
                      }
                      selected.removeAll(summary.batchedIds);
                  }
                  result.addAll(selected);
              }

          '''
          text = text[:start] + replacement + text[end:]
          candidate_path.write_text(text)

          factory_path = Path('kanger/src/org/kanger/factory/RuleFactory.java')
          text = factory_path.read_text()
          old = '''        ensureDomainIndex();
                  synchronized (metadataLock) {
                      candidateIndex.collectResolvedLocal(source, candidateAntc, mind, result);
                  }
          '''
          new = '''        ensureDomainIndex();
                  candidateIndex.collectResolvedLocal(source, candidateAntc, mind, result);
          '''
          if old not in text:
              raise SystemExit('RuleFactory resolved candidate lock boundary not found')
          factory_path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/factory/RuleFactory.java \
                  kanger/src/org/kanger/factory/RuleCandidateIndex.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix Rule candidate lock inversion"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Compile and run regression corpus
        run: mvn --batch-mode --no-transfer-progress test

      - name: Index empty-boundary invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.storage.IndexEmptyBoundarySafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Index comparable invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.storage.IndexOneComparableSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind transaction reservation invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.MindTransactionReservationSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: TValue canonical resurrection invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerTValueResurrectionSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: TValue comparable invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerTValueComparableSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Linker rule ordering invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerLinkerRuleOrderingSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Escalera empty-root mark invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerEscaleraMarkSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Factory action rollback invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerFactoryActionRollbackSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Factory concurrency diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          mvn --batch-mode --no-transfer-progress \
            -Dexec.mainClass=org.kanger.KangerFactoryConcurrencyDiagnosticRunner \
            -Dexec.classpathScope=test \
            exec:java 2>&1 | tee target/factory-concurrency-diagnostic.log

      - name: Upload factory concurrency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-concurrency-diagnostic
          path: target/factory-concurrency-diagnostic.log
          if-no-files-found: error
          retention-days: 7

      - name: Escalera frame ownership invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerEscaleraFrameOwnershipSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind commit exception atomicity invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindCommitExceptionAtomicitySafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind rollback failure isolation invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindRollbackFailureIsolationSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind partial mark acquisition invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindPartialMarkAcquisitionSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind partial commit completion invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindPartialCommitCompletionSafetyRunner
          -Dexec.classpathScope=test
          exec:java
