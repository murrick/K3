name: KANGER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanger-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Maven regression and invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile and run regression corpus
        run: mvn --batch-mode --no-transfer-progress test

      - name: Hypothesis formation forensic trace
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerHypothesisFormationForensicRunner -Dexec.classpathScope=test exec:java | tee hypothesis-formation-forensic.log

      - name: Upload hypothesis formation forensic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-formation-forensic
          path: hypothesis-formation-forensic.log
          if-no-files-found: warn
          retention-days: 1

      - name: Residual hypothesis EXACT audit
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerHypothesisResidualExactRunner -Dexec.classpathScope=test exec:java | tee hypothesis-residual-exact.log

      - name: Upload residual hypothesis EXACT audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-residual-exact
          path: hypothesis-residual-exact.log
          if-no-files-found: warn
          retention-days: 1

      - name: Index empty-boundary invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.storage.IndexEmptyBoundarySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Index comparable invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.storage.IndexOneComparableSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind transaction reservation invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.MindTransactionReservationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: TValue canonical resurrection invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerTValueResurrectionSafetyRunner -Dexec.classpathScope=test exec:java

      - name: TValue comparable invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerTValueComparableSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Linker rule ordering invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerLinkerRuleOrderingSafetyRunner -Dexec.classpathScope=test exec:java

      - name: C-variable Rule-scope invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerCVarRuleScopeSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Linker checkpoint balance invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerLinkerCheckpointBalanceSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Storage acquisition atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerStorageAcquisitionAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: DUMB close failure isolation invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.storage.DBCloseFailureIsolationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: DUMB reindex swap atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.storage.DBReindexSwapAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Escalera empty-root mark invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerEscaleraMarkSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Factory action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerFactoryActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: FValue action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerFValueActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Rule action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerRuleActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Domain waiter rollback invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerDomainWaiterRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Factory concurrency lock-order invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerFactorySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Escalera frame ownership invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerEscaleraFrameOwnershipSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind commit exception atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerMindCommitExceptionAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind rollback failure isolation invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerMindRollbackFailureIsolationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind partial mark acquisition invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerMindPartialMarkAcquisitionSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind partial commit completion invariant
        run: mvn --batch-mode --no-transfer-progress -Dexec.mainClass=org.kanger.KangerMindPartialCommitCompletionSafetyRunner -Dexec.classpathScope=test exec:java
