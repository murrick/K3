name: KANGER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanger-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Maven regression and invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile and run regression corpus
        run: mvn --batch-mode --no-transfer-progress -pl kanger-console -am install

      - name: Maven module artifact boundaries
        shell: bash
        run: |
          set -euo pipefail

          command_jar="$(find kanger-command/target -maxdepth 1 -type f -name 'kanger-command-*.jar' | head -n 1)"
          core_jar="$(find kanger-core/target -maxdepth 1 -type f -name 'kanger-core-*.jar' | head -n 1)"
          udf_jar="$(find kanger-udf/target -maxdepth 1 -type f -name 'kanger-udf-*.jar' | head -n 1)"
          dumb_jar="$(find kanger-data-dumb/target -maxdepth 1 -type f -name 'kanger-data-dumb-*.jar' | head -n 1)"

          for artifact in "$command_jar" "$core_jar" "$udf_jar" "$dumb_jar"; do
            test -n "$artifact"
            test -f "$artifact"
          done

          jar tf "$command_jar" > "$RUNNER_TEMP/kanger-command.entries"
          jar tf "$core_jar" > "$RUNNER_TEMP/kanger-core.entries"
          jar tf "$udf_jar" > "$RUNNER_TEMP/kanger-udf.entries"
          jar tf "$dumb_jar" > "$RUNNER_TEMP/kanger-data-dumb.entries"

          require_entry() {
            local entries="$1"
            local entry="$2"
            if ! grep -Fxq "$entry" "$entries"; then
              echo "::error::Missing expected module entry: $entry"
              exit 1
            fi
          }

          forbid_entry() {
            local entries="$1"
            local entry="$2"
            if grep -Fxq "$entry" "$entries"; then
              echo "::error::Forbidden module entry present: $entry"
              exit 1
            fi
          }

          require_entry "$RUNNER_TEMP/kanger-command.entries" 'org/kanger/command/CommandParser.class'
          forbid_entry "$RUNNER_TEMP/kanger-command.entries" 'org/kanger/CanonicalCommandProcessor.class'

          require_entry "$RUNNER_TEMP/kanger-core.entries" 'org/kanger/CanonicalCommandProcessor.class'
          require_entry "$RUNNER_TEMP/kanger-core.entries" 'org/kanger/interfaces/IData.class'
          forbid_entry "$RUNNER_TEMP/kanger-core.entries" 'org/kanger/udf/UDF.class'
          forbid_entry "$RUNNER_TEMP/kanger-core.entries" 'org/kanger/storage/DB.class'

          require_entry "$RUNNER_TEMP/kanger-udf.entries" 'org/kanger/udf/UDF.class'
          require_entry "$RUNNER_TEMP/kanger-udf.entries" 'org/mozilla/javascript/resources/Messages.properties'

          require_entry "$RUNNER_TEMP/kanger-data-dumb.entries" 'org/kanger/storage/DB.class'

      - name: Canonical Console logical-input boundary
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerCanonicalConsoleInputContractRunner -Dexec.classpathScope=test exec:java

      - name: Index empty-boundary invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.storage.IndexEmptyBoundarySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Index comparable invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.storage.IndexOneComparableSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind transaction reservation invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.MindTransactionReservationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: TValue canonical resurrection invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerTValueResurrectionSafetyRunner -Dexec.classpathScope=test exec:java

      - name: TValue comparable invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerTValueComparableSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Linker rule ordering invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerLinkerRuleOrderingSafetyRunner -Dexec.classpathScope=test exec:java

      - name: C-variable Rule-scope invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerCVarRuleScopeSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Linker checkpoint balance invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerLinkerCheckpointBalanceSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Storage acquisition atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerStorageAcquisitionAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: DUMB close failure isolation invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.storage.DBCloseFailureIsolationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: DUMB reindex swap atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.storage.DBReindexSwapAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Escalera empty-root mark invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerEscaleraMarkSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Factory action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerFactoryActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: FValue action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerFValueActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Rule action rollback invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerRuleActionRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Domain waiter rollback invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerDomainWaiterRollbackSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Factory concurrency lock-order invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerFactorySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Escalera frame ownership invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerEscaleraFrameOwnershipSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind commit exception atomicity invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerMindCommitExceptionAtomicitySafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind rollback failure isolation invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerMindRollbackFailureIsolationSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind partial mark acquisition invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerMindPartialMarkAcquisitionSafetyRunner -Dexec.classpathScope=test exec:java

      - name: Mind partial commit completion invariant
        run: mvn --batch-mode --no-transfer-progress -f kanger-console/pom.xml -Dexec.mainClass=org.kanger.KangerMindPartialCommitCompletionSafetyRunner -Dexec.classpathScope=test exec:java
