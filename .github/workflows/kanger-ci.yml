name: KANGER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanger-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-mind-guard:
    if: github.event_name == 'pull_request' && github.head_ref == 'arch/3.5.0-core-consolidation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: arch/3.5.0-core-consolidation
          fetch-depth: 0

      - name: Apply exception-safe Mind commit guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('kanger/src/org/kanger/Mind.java')
          text = path.read_text(encoding='utf-8')
          if 'private void markCompositeCheckpoints(boolean[] active)' in text:
              raise SystemExit(0)

          start_marker = '    @Override\n    public boolean commit(IMind m) throws Exception {'
          end_marker = '    private void update() throws Exception {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''    @Override
    public boolean commit(IMind m) throws Exception {
        synchronized (locker) {
            Mind child = (Mind) m;
            boolean sequencedBy = rules.isSequencedBy((RuleFactory) child.getRules());
            boolean[] activeCheckpoints = new boolean[8];
            boolean reservationFinished = false;
            boolean factoriesCompleted = sequencedBy;
            Map<UnitType, Set<Long>> saveDeleted = copyUnitState(deleted);
            Map<UnitType, Set<Long>> saveRestored = copyUnitState(restored);

            try {
                if (!sequencedBy) {
                    markCompositeCheckpoints(activeCheckpoints);
                }

                functions.commit(child.getFunctions());
                fValues.commit(child.getFValues());
                tVars.commit(child.getTVars());
                tValues.commit(child.getTValues());
                domains.commit(child.getDomains());
                Set<Long> list = rules.commit((RuleFactory) child.getRules());
                comments.commit(child.getComments());
                library.commit((LibraryFactory) child.getLibrary());

                mergeUnitState(child);

                if (!sequencedBy) {
                    Boolean rejected = analyzer.checkDatabase(list, false);
                    if (rejected != null && rejected) {
                        Throwable rollbackFailure = releaseCompositeCheckpoints(activeCheckpoints, null);
                        restoreUnitState(saveDeleted, saveRestored);
                        if (rollbackFailure != null) {
                            rethrow(rollbackFailure);
                        }
                        finishTransactionLocked();
                        reservationFinished = true;
                        copyCommitResult(child);
                        return false;
                    }
                    completeCompositeCheckpoints(activeCheckpoints);
                    factoriesCompleted = true;
                }

                finishTransactionLocked();
                reservationFinished = true;
                copyCommitResult(child);
                return true;
            } catch (Throwable failure) {
                Throwable propagated = failure;
                if (!factoriesCompleted) {
                    propagated = releaseCompositeCheckpoints(activeCheckpoints, propagated);
                    restoreUnitState(saveDeleted, saveRestored);
                }
                if (!reservationFinished) {
                    try {
                        finishFailedTransactionLocked();
                    } catch (Throwable finishFailure) {
                        propagated.addSuppressed(finishFailure);
                    }
                }
                rethrow(propagated);
                throw new AssertionError("unreachable");
            }
        }
    }

    private void markCompositeCheckpoints(boolean[] active) throws Exception {
        functions.mark(); active[0] = true;
        fValues.mark(); active[1] = true;
        tVars.mark(); active[2] = true;
        tValues.mark(); active[3] = true;
        domains.mark(); active[4] = true;
        rules.mark(); active[5] = true;
        comments.mark(); active[6] = true;
        library.mark(); active[7] = true;
    }

    private void completeCompositeCheckpoints(boolean[] active) throws Exception {
        functions.commit(); active[0] = false;
        fValues.commit(); active[1] = false;
        tVars.commit(); active[2] = false;
        tValues.commit(); active[3] = false;
        domains.commit(); active[4] = false;
        rules.commit(); active[5] = false;
        comments.commit(); active[6] = false;
        library.commit(); active[7] = false;
    }

    private Throwable releaseCompositeCheckpoints(boolean[] active, Throwable primary) {
        Throwable failure = primary;
        for (int i = active.length - 1; i >= 0; --i) {
            if (!active[i]) continue;
            try {
                releaseCompositeCheckpoint(i);
            } catch (Throwable rollbackFailure) {
                if (failure == null) failure = rollbackFailure;
                else if (failure != rollbackFailure) failure.addSuppressed(rollbackFailure);
            } finally {
                active[i] = false;
            }
        }
        return failure;
    }

    private void releaseCompositeCheckpoint(int index) throws Exception {
        switch (index) {
            case 0: functions.release(); break;
            case 1: fValues.release(); break;
            case 2: tVars.release(); break;
            case 3: tValues.release(); break;
            case 4: domains.release(); break;
            case 5: rules.release(); break;
            case 6: comments.release(); break;
            case 7: library.release(); break;
            default: throw new IllegalArgumentException("Unknown composite checkpoint " + index);
        }
    }

    private Map<UnitType, Set<Long>> copyUnitState(Map<UnitType, Set<Long>> source) {
        Map<UnitType, Set<Long>> copy = new HashMap<>();
        for (Map.Entry<UnitType, Set<Long>> entry : source.entrySet()) {
            copy.put(entry.getKey(), new HashSet<>(entry.getValue()));
        }
        return copy;
    }

    private void mergeUnitState(Mind child) {
        for (Map.Entry<UnitType, Set<Long>> entry : child.getDeleted().entrySet()) {
            deleted.computeIfAbsent(entry.getKey(), key -> new HashSet<>()).addAll(entry.getValue());
        }
        for (Map.Entry<UnitType, Set<Long>> entry : child.getRestored().entrySet()) {
            restored.computeIfAbsent(entry.getKey(), key -> new HashSet<>()).addAll(entry.getValue());
            Set<Long> deletedIds = deleted.get(entry.getKey());
            if (deletedIds != null) deletedIds.removeAll(entry.getValue());
        }
    }

    private void restoreUnitState(Map<UnitType, Set<Long>> saveDeleted,
                                  Map<UnitType, Set<Long>> saveRestored) {
        deleted.clear(); restored.clear();
        deleted.putAll(copyUnitState(saveDeleted));
        restored.putAll(copyUnitState(saveRestored));
    }

    private void copyCommitResult(Mind child) throws Exception {
        log.commit(child.getLog());
        queryResult = child.getQueryResult();
        compliedLine = child.getCompliedString();
        lastLinkerStatistics = child.linker.snapshotStatistics();
    }

    private void finishFailedTransactionLocked() {
        if (transactionCounter <= 0) {
            throw new IllegalStateException("Transaction counter underflow for Mind " + id);
        }
        --transactionCounter;
    }

    private static void rethrow(Throwable failure) throws Exception {
        if (failure instanceof Exception) throw (Exception) failure;
        if (failure instanceof Error) throw (Error) failure;
        throw new RuntimeException(failure);
    }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit production patch
        run: |
          if git diff --quiet -- kanger/src/org/kanger/Mind.java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Mind.java
          git commit -m "Make Mind composite commit exception-safe"
          git push origin HEAD:arch/3.5.0-core-consolidation

  regression:
    name: Maven regression and invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile and run regression corpus
        run: mvn --batch-mode --no-transfer-progress test

      - name: Index empty-boundary invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.storage.IndexEmptyBoundarySafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Index comparable invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.storage.IndexOneComparableSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind transaction reservation invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.MindTransactionReservationSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: TValue canonical resurrection invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerTValueResurrectionSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: TValue comparable invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerTValueComparableSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Escalera empty-root mark invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerEscaleraMarkSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Factory action rollback invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerFactoryActionRollbackSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Escalera frame ownership invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerEscaleraFrameOwnershipSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind commit exception atomicity invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindCommitExceptionAtomicitySafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind rollback failure isolation invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindRollbackFailureIsolationSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind partial mark acquisition invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindPartialMarkAcquisitionSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Mind partial commit completion invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerMindPartialCommitCompletionSafetyRunner
          -Dexec.classpathScope=test
          exec:java
