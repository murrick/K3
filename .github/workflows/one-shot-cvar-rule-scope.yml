name: One-shot C-variable Rule scope

on:
  push:
    branches:
      - 'fix/3.5.0.5-cvar-rule-scope'
    paths:
      - 'tools/one_shot_cvar_rule_scope.py'
      - '.github/workflows/one-shot-cvar-rule-scope.yml'
  pull_request:
    branches:
      - 'develop/3.5.0.4'
    paths:
      - 'tools/one_shot_cvar_rule_scope.py'
      - '.github/workflows/one-shot-cvar-rule-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: fix/3.5.0.5-cvar-rule-scope

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Apply rule-scoped C-variable patch
        run: python3 tools/one_shot_cvar_rule_scope.py

      - name: Verify focused source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$'.github/workflows/kanger-ci.yml\nkanger-console/src/org/kanger/KangerCVarRuleScopeSafetyRunner.java\nkanger/src/org/kanger/Linker.java\nkanger/src/org/kanger/Mind.java\nkanger/src/org/kanger/factory/DictionaryFactory.java\nkanger/src/org/kanger/units/Term.java'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

          unexpected="$(grep -R --line-number --fixed-strings 'getChild(mind)' kanger/src kanger-console/src | grep -v 'kanger/src/org/kanger/units/Term.java' || true)"
          test -z "$unexpected"

      - name: Run full regression corpus
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run C-variable Rule-scope invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerCVarRuleScopeSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Commit verified experiment
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-cvar-rule-scope.yml
          rm tools/one_shot_cvar_rule_scope.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope C-variable children by target Rule'
          git push origin HEAD:fix/3.5.0.5-cvar-rule-scope
