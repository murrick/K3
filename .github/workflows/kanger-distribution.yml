name: KANGER distribution bundle

on:
  push:
    paths:
      - "distribution/**"
      - "html/**"
      - "kanger/**"
      - "kanger-command/**"
      - "kanger-console/**"
      - "kanger-data-*/**"
      - "kanger-qualification/**"
      - "kanger-server/**"
      - "kanger-udf/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-distribution.yml"
  pull_request:
    paths:
      - "distribution/**"
      - "html/**"
      - "kanger/**"
      - "kanger-command/**"
      - "kanger-console/**"
      - "kanger-data-*/**"
      - "kanger-qualification/**"
      - "kanger-server/**"
      - "kanger-udf/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify product bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate distribution scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n distribution/build-distribution.sh
          bash -n distribution/payload/install.sh
          bash -n distribution/payload/update.sh
          bash -n distribution/payload/bin/kanger-admin
          bash -n distribution/payload/lib/common.sh

      - name: Build qualified distribution
        shell: bash
        run: |
          set -euo pipefail
          bash distribution/build-distribution.sh

      - name: Verify distribution archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distribution/VERSION)"
          archive="target/distributions/kanger-${version}.tar.gz"
          root="kanger-${version}"

          test -f "${archive}"
          listing="$(tar -tzf "${archive}")"
          for member in \
            "${root}/RELEASE" \
            "${root}/SHA256SUMS" \
            "${root}/server/kanger-server.jar" \
            "${root}/ui/index.html" \
            "${root}/install.sh" \
            "${root}/update.sh" \
            "${root}/bin/kanger-admin"
          do
            grep -Fqx -- "${member}" <<<"${listing}"
          done

          release="$(tar -xOzf "${archive}" "${root}/RELEASE")"
          printf '%s\n' "${release}"
          grep -Fqx -- 'product=KANGER' <<<"${release}"
          grep -Fqx -- "version=${version}" <<<"${release}"
          grep -Fqx -- 'server.version=server-0.18' <<<"${release}"

          sha256sum "${archive}"

      - name: Upload qualified distribution
        uses: actions/upload-artifact@v4
        with:
          name: kanger-distribution-${{ github.sha }}
          path: target/distributions/*.tar.gz
          if-no-files-found: error
          retention-days: 14
