name: KANGER distribution bundle

on:
  push:
    paths:
      - "distribution/**"
      - "html/**"
      - "kanger/**"
      - "kanger-command/**"
      - "kanger-console/**"
      - "kanger-data-*/**"
      - "kanger-qualification/**"
      - "kanger-server/**"
      - "kanger-udf/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-distribution.yml"
  pull_request:
    paths:
      - "distribution/**"
      - "html/**"
      - "kanger/**"
      - "kanger-command/**"
      - "kanger-console/**"
      - "kanger-data-*/**"
      - "kanger-qualification/**"
      - "kanger-server/**"
      - "kanger-udf/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify product bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate distribution scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n distribution/build-distribution.sh
          bash -n distribution/payload/install.sh
          bash -n distribution/payload/update.sh
          bash -n distribution/payload/bin/kanger-admin
          bash -n distribution/payload/lib/common.sh

          install_help="$(bash distribution/payload/install.sh --help)"
          grep -Fq 'Usage: sudo ./install.sh DOMAIN [options]' <<<"${install_help}"
          grep -Fq 'Required prerequisite software is customer-managed: Java, nginx and systemd.' <<<"${install_help}"

          update_help="$(bash distribution/payload/update.sh --help)"
          grep -Fq 'Usage: sudo ./update.sh [--force]' <<<"${update_help}"
          grep -Fq -- '--force                  Allow an explicit same-version update' <<<"${update_help}"
          grep -Fq '<version>.force.N' <<<"${update_help}"
          if grep -Fq '3.7.0.force' <<<"${update_help}"; then
            echo 'update.sh help contains a release-specific force snapshot example' >&2
            exit 1
          fi

          if bash distribution/payload/update.sh --definitely-unknown >update-unknown.out 2>&1; then
            echo 'update.sh accepted an unknown option' >&2
            exit 1
          fi
          grep -Fq 'ERROR: Unknown option: --definitely-unknown' update-unknown.out
          rm -f update-unknown.out

          grep -Fq 'CANONICAL_RELEASE="${KANGER_RELEASES_DIR}/${VERSION}"' distribution/payload/update.sh
          grep -Fq 'ARCHIVE_RELEASE="${KANGER_RELEASES_DIR}/${VERSION}.force.${force_index}"' distribution/payload/update.sh
          grep -Fq 'cp -a "${CANONICAL_RELEASE}" "${ARCHIVE_RELEASE}"' distribution/payload/update.sh
          grep -Fq 'atomic_current_link "${ARCHIVE_RELEASE}"' distribution/payload/update.sh
          grep -Fq 'mv "${CANDIDATE_RELEASE}" "${CANONICAL_RELEASE}"' distribution/payload/update.sh
          grep -Fq 'atomic_current_link "${NEW_RELEASE}"' distribution/payload/update.sh

          snapshot_line="$(grep -nF 'cp -a "${CANONICAL_RELEASE}" "${ARCHIVE_RELEASE}"' distribution/payload/update.sh | tail -1 | cut -d: -f1)"
          bridge_line="$(grep -nF 'atomic_current_link "${ARCHIVE_RELEASE}"' distribution/payload/update.sh | tail -1 | cut -d: -f1)"
          remove_line="$(grep -nF 'rm -rf -- "${CANONICAL_RELEASE}"' distribution/payload/update.sh | tail -1 | cut -d: -f1)"
          promote_line="$(grep -nF 'mv "${CANDIDATE_RELEASE}" "${CANONICAL_RELEASE}"' distribution/payload/update.sh | tail -1 | cut -d: -f1)"
          (( snapshot_line < bridge_line && bridge_line < remove_line && remove_line < promote_line )) \
            || { echo 'force rotation does not preserve the snapshot/current/canonical ordering invariant' >&2; exit 1; }

      - name: Build qualified distribution
        shell: bash
        run: |
          set -euo pipefail
          bash distribution/build-distribution.sh

      - name: Verify distribution archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distribution/VERSION)"
          archive="target/distributions/kanger-${version}.tar.gz"
          root="kanger-${version}"

          test -f "${archive}"
          listing="$(tar -tzf "${archive}")"
          for member in \
            "${root}/RELEASE" \
            "${root}/SHA256SUMS" \
            "${root}/server/kanger-server.jar" \
            "${root}/server/kanger-server-thin.jar" \
            "${root}/ui/index.html" \
            "${root}/install.sh" \
            "${root}/update.sh" \
            "${root}/bin/kanger-admin"
          do
            grep -Fqx -- "${member}" <<<"${listing}"
          done

          udf_modules="$(grep -Ec "^${root}/server/modules/kanger-udf-[^/]+[.]jar$" <<<"${listing}" || true)"
          storage_modules="$(grep -Ec "^${root}/server/modules/kanger-data-dumb-[^/]+[.]jar$" <<<"${listing}" || true)"
          test "${udf_modules}" -eq 1
          test "${storage_modules}" -eq 1
          grep -Eq "^${root}/server/lib/kanger-core-[^/]+[.]jar$" <<<"${listing}"
          grep -Eq "^${root}/server/lib/kanger-bootstrap-[^/]+[.]jar$" <<<"${listing}"
          if grep -Eq "^${root}/server/lib/kanger-(udf|data-dumb)-[^/]+[.]jar$" <<<"${listing}"; then
            echo 'runtime provider leaked into server/lib' >&2
            exit 1
          fi

          release="$(tar -xOzf "${archive}" "${root}/RELEASE")"
          printf '%s\n' "${release}"
          grep -Fqx -- 'product=KANGER' <<<"${release}"
          grep -Fqx -- "version=${version}" <<<"${release}"
          grep -Fqx -- 'server.version=server-0.18' <<<"${release}"

          packaged_update="$(mktemp)"
          trap 'rm -f -- "${packaged_update}"' EXIT
          tar -xOzf "${archive}" "${root}/update.sh" >"${packaged_update}"
          bash -n "${packaged_update}"
          grep -Fq 'Usage: sudo ./update.sh [--force]' "${packaged_update}"
          grep -Fq '<version>.force.N' "${packaged_update}"
          grep -Fq 'forcing same-version update' "${packaged_update}"
          grep -Fq 'CANONICAL_RELEASE="${KANGER_RELEASES_DIR}/${VERSION}"' "${packaged_update}"
          grep -Fq 'cp -a "${CANONICAL_RELEASE}" "${ARCHIVE_RELEASE}"' "${packaged_update}"
          grep -Fq 'atomic_current_link "${ARCHIVE_RELEASE}"' "${packaged_update}"
          grep -Fq 'mv "${CANDIDATE_RELEASE}" "${CANONICAL_RELEASE}"' "${packaged_update}"

          sha256sum "${archive}"

      - name: Qualify packaged fresh install
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distribution/VERSION)"
          archive="${GITHUB_WORKSPACE}/target/distributions/kanger-${version}.tar.gz"
          root="kanger-${version}"
          server_version="$(tar -xOzf "${archive}" "${root}/RELEASE" | awk -F= '$1 == "server.version" {print $2; exit}')"

          sandbox="$(mktemp -d)"
          trap 'sudo rm -rf -- "${sandbox}"' EXIT
          mkdir -p "${sandbox}/bundle" "${sandbox}/runtime/etc" \
            "${sandbox}/runtime/state" "${sandbox}/fakebin"
          tar -xzf "${archive}" -C "${sandbox}/bundle"
          bundle="${sandbox}/bundle/${root}"
          runtime="${sandbox}/runtime"
          canonical="${runtime}/releases/${version}"
          current="${runtime}/current"
          unit_file="${runtime}/etc/kanger.service"
          nginx_file="${runtime}/etc/kanger-nginx.conf"
          instance_file="${runtime}/etc/instance.conf"
          server_config="${runtime}/etc/kanger.conf"
          cert_file="${runtime}/etc/cert.pem"
          key_file="${runtime}/etc/key.pem"
          systemctl_log="${sandbox}/systemctl.log"

          : >"${cert_file}"
          : >"${key_file}"
          : >"${systemctl_log}"

          cat >"${sandbox}/fakebin/systemctl" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >>"${KANGER_TEST_SYSTEMCTL_LOG}"
          exit 0
          EOF
          cat >"${sandbox}/fakebin/nginx" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat >"${sandbox}/fakebin/curl" <<'EOF'
          #!/usr/bin/env bash
          case "${*: -1}" in
            */health) printf '{"server_version":"%s"}\n' "${KANGER_TEST_SERVER_VERSION}" ;;
            *) printf '{"ready":true}\n' ;;
          esac
          EOF
          chmod 0755 "${sandbox}/fakebin/systemctl" "${sandbox}/fakebin/nginx" "${sandbox}/fakebin/curl"

          sudo env \
            "PATH=${sandbox}/fakebin:${PATH}" \
            "KANGER_TEST_SERVER_VERSION=${server_version}" \
            "KANGER_TEST_SYSTEMCTL_LOG=${systemctl_log}" \
            "KANGER_ROOT=${runtime}" \
            "KANGER_RELEASES_DIR=${runtime}/releases" \
            "KANGER_CURRENT_LINK=${current}" \
            "KANGER_CONFIG_DIR=${runtime}/etc" \
            "KANGER_STATE_DIR=${runtime}/state" \
            "KANGER_UNIT_FILE=${unit_file}" \
            "KANGER_NGINX_FILE=${nginx_file}" \
            "KANGER_INSTANCE_FILE=${instance_file}" \
            "KANGER_SERVER_CONFIG=${server_config}" \
            bash "${bundle}/install.sh" ui.example.test \
              --api-domain api.example.test \
              --ui-cert "${cert_file}" --ui-key "${key_file}" \
              --api-cert "${cert_file}" --api-key "${key_file}" \
              --nginx-config "${nginx_file}"

          [[ "$(sudo readlink -f "${current}")" == "${canonical}" ]]
          sudo test -f "${canonical}/RELEASE"
          sudo test -f "${canonical}/server/kanger-server.jar"
          sudo test -f "${canonical}/server/kanger-server-thin.jar"
          sudo test -x "${canonical}/bin/kanger-admin"
          sudo test -f "${canonical}/ui/config.js"

          [[ "$(sudo find "${canonical}/server/modules" -maxdepth 1 -type f -name 'kanger-udf-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
          [[ "$(sudo find "${canonical}/server/modules" -maxdepth 1 -type f -name 'kanger-data-dumb-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
          [[ "$(sudo find "${canonical}/server/lib" -maxdepth 1 -type f -name 'kanger-core-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
          [[ "$(sudo find "${canonical}/server/lib" -maxdepth 1 -type f -name 'kanger-bootstrap-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
          [[ "$(sudo find "${canonical}/server/lib" -maxdepth 1 -type f \( -name 'kanger-udf-*.jar' -o -name 'kanger-data-dumb-*.jar' \) -printf '.\n' | wc -l)" -eq 0 ]]

          java_bin="$(readlink -f "$(command -v java)")"
          sudo grep -Fqx 'WorkingDirectory=/opt/kanger/current' "${unit_file}"
          sudo grep -Fqx 'ExecStartPre=/usr/bin/test -r /opt/kanger/current/server/kanger-server-thin.jar' "${unit_file}"
          sudo grep -Fqx "ExecStart=${java_bin} -Duser.home=/var/lib/kanger -cp /opt/kanger/current/server/kanger-server-thin.jar:/opt/kanger/current/server/lib/*:/opt/kanger/current/server/modules/* org.kanger.Kanger" "${unit_file}"
          if sudo grep -Fq ' -jar ' "${unit_file}"; then
            echo 'installed systemd unit fell back to fat -jar runtime' >&2
            exit 1
          fi

          sudo grep -Fqx 'SERVER_THIN_JAR="${SERVER_ROOT}/kanger-server-thin.jar"' "${canonical}/bin/kanger-admin"
          sudo grep -Fqx 'SERVER_LIB="${SERVER_ROOT}/lib"' "${canonical}/bin/kanger-admin"
          sudo grep -Fqx 'SERVER_MODULES="${SERVER_ROOT}/modules"' "${canonical}/bin/kanger-admin"
          sudo grep -Fqx 'SERVER_CLASSPATH="${SERVER_THIN_JAR}:${SERVER_LIB}/*:${SERVER_MODULES}/*"' "${canonical}/bin/kanger-admin"
          sudo grep -Fqx 'KANGER_UI_DOMAIN=ui.example.test' "${instance_file}"
          sudo grep -Fqx 'KANGER_API_DOMAIN=api.example.test' "${instance_file}"
          sudo grep -Fq "window.KANGER_API_HOST = 'https://api.example.test';" "${canonical}/ui/config.js"
          sudo grep -Fqx 'server.cors.allowed.origin.1=https://ui.example.test' "${server_config}"
          sudo grep -Fqx 'server.url=https://api.example.test' "${server_config}"
          sudo grep -Fqx 'server.confirmation.redirect.url=https://ui.example.test/' "${server_config}"
          grep -Fqx 'enable kanger.service' "${systemctl_log}"
          grep -Fqx 'restart kanger.service' "${systemctl_log}"

      - name: Qualify packaged same-version force rotation
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distribution/VERSION)"
          archive="${GITHUB_WORKSPACE}/target/distributions/kanger-${version}.tar.gz"
          root="kanger-${version}"
          server_version="$(tar -xOzf "${archive}" "${root}/RELEASE" | awk -F= '$1 == "server.version" {print $2; exit}')"

          sandbox="$(mktemp -d)"
          trap 'sudo rm -rf -- "${sandbox}"' EXIT
          mkdir -p "${sandbox}/bundle" "${sandbox}/runtime/releases/${version}" \
            "${sandbox}/runtime/etc" "${sandbox}/runtime/state" "${sandbox}/fakebin"
          tar -xzf "${archive}" -C "${sandbox}/bundle"
          bundle="${sandbox}/bundle/${root}"
          runtime="${sandbox}/runtime"
          canonical="${runtime}/releases/${version}"
          current="${runtime}/current"
          unit_file="${runtime}/etc/kanger.service"
          nginx_file="${runtime}/etc/kanger-nginx.conf"
          instance_file="${runtime}/etc/instance.conf"
          cert_file="${runtime}/etc/cert.pem"
          key_file="${runtime}/etc/key.pem"

          assert_thin_release() {
            local release_dir="$1"
            sudo test -f "${release_dir}/server/kanger-server.jar"
            sudo test -f "${release_dir}/server/kanger-server-thin.jar"
            sudo test -x "${release_dir}/bin/kanger-admin"
            [[ "$(sudo find "${release_dir}/server/modules" -maxdepth 1 -type f -name 'kanger-udf-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
            [[ "$(sudo find "${release_dir}/server/modules" -maxdepth 1 -type f -name 'kanger-data-dumb-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
            [[ "$(sudo find "${release_dir}/server/lib" -maxdepth 1 -type f -name 'kanger-core-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
            [[ "$(sudo find "${release_dir}/server/lib" -maxdepth 1 -type f -name 'kanger-bootstrap-*.jar' -printf '.\n' | wc -l)" -eq 1 ]]
            [[ "$(sudo find "${release_dir}/server/lib" -maxdepth 1 -type f \( -name 'kanger-udf-*.jar' -o -name 'kanger-data-dumb-*.jar' \) -printf '.\n' | wc -l)" -eq 0 ]]
          }

          assert_thin_unit() {
            local java_bin
            java_bin="$(readlink -f "$(command -v java)")"
            sudo grep -Fqx 'WorkingDirectory=/opt/kanger/current' "${unit_file}"
            sudo grep -Fqx "ExecStart=${java_bin} -Duser.home=/var/lib/kanger -cp /opt/kanger/current/server/kanger-server-thin.jar:/opt/kanger/current/server/lib/*:/opt/kanger/current/server/modules/* org.kanger.Kanger" "${unit_file}"
            ! sudo grep -Fq ' -jar ' "${unit_file}"
          }

          cat >"${canonical}/RELEASE" <<EOF
          product=KANGER
          version=${version}
          server.version=${server_version}
          server.build.date=qualification-old
          packaged.at=qualification-old
          EOF
          printf 'old-canonical\n' >"${canonical}/OLD_MARKER"
          ln -s "${canonical}" "${current}"
          : >"${unit_file}"
          : >"${nginx_file}"
          : >"${cert_file}"
          : >"${key_file}"
          cat >"${instance_file}" <<EOF
          KANGER_UI_DOMAIN=ui.example.test
          KANGER_API_DOMAIN=api.example.test
          KANGER_UI_CERT=${cert_file}
          KANGER_UI_KEY=${key_file}
          KANGER_API_CERT=${cert_file}
          KANGER_API_KEY=${key_file}
          KANGER_NGINX_FILE=${nginx_file}
          EOF

          cat >"${sandbox}/fakebin/systemctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat >"${sandbox}/fakebin/nginx" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat >"${sandbox}/fakebin/curl" <<'EOF'
          #!/usr/bin/env bash
          case "${*: -1}" in
            */health) printf '{"server_version":"%s"}\n' "${KANGER_TEST_SERVER_VERSION}" ;;
            *) printf '{"ready":true}\n' ;;
          esac
          EOF
          chmod 0755 "${sandbox}/fakebin/systemctl" "${sandbox}/fakebin/nginx" "${sandbox}/fakebin/curl"

          getent group kanger >/dev/null || sudo groupadd --system kanger

          run_update() {
            sudo env \
              "PATH=${sandbox}/fakebin:${PATH}" \
              "KANGER_TEST_SERVER_VERSION=${server_version}" \
              "KANGER_ROOT=${runtime}" \
              "KANGER_RELEASES_DIR=${runtime}/releases" \
              "KANGER_CURRENT_LINK=${current}" \
              "KANGER_CONFIG_DIR=${runtime}/etc" \
              "KANGER_STATE_DIR=${runtime}/state" \
              "KANGER_UNIT_FILE=${unit_file}" \
              "KANGER_NGINX_FILE=${nginx_file}" \
              "KANGER_INSTANCE_FILE=${instance_file}" \
              "KANGER_SERVER_CONFIG=${runtime}/etc/kanger.conf" \
              bash "${bundle}/update.sh" "$@"
          }

          before_current="$(readlink -f "${current}")"
          before_releases="$(find "${runtime}/releases" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if run_update >"${sandbox}/no-force.out" 2>&1; then
            echo 'same-version update succeeded without --force' >&2
            exit 1
          fi
          grep -Fq "KANGER ${version} is already active; use --force" "${sandbox}/no-force.out"
          [[ "$(readlink -f "${current}")" == "${before_current}" ]]
          [[ "$(find "${runtime}/releases" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" == "${before_releases}" ]]

          run_update --force
          [[ "$(sudo readlink -f "${current}")" == "${canonical}" ]]
          sudo test -f "${runtime}/releases/${version}.force.1/OLD_MARKER"
          sudo test ! -e "${canonical}/OLD_MARKER"
          assert_thin_release "${canonical}"
          assert_thin_unit

          sudo touch "${canonical}/FIRST_FORCE_MARKER"
          run_update --force
          [[ "$(sudo readlink -f "${current}")" == "${canonical}" ]]
          sudo test -f "${runtime}/releases/${version}.force.1/OLD_MARKER"
          sudo test -f "${runtime}/releases/${version}.force.2/FIRST_FORCE_MARKER"
          sudo test ! -e "${canonical}/FIRST_FORCE_MARKER"
          assert_thin_release "${canonical}"
          assert_thin_unit

          printf 'Qualified release layout:\n'
          sudo find "${runtime}/releases" -mindepth 1 -maxdepth 1 -printf '  %f\n' | sort
          printf 'Current: %s\n' "$(sudo readlink -f "${current}")"

      - name: Upload qualified distribution
        uses: actions/upload-artifact@v4
        with:
          name: kanger-distribution-${{ github.sha }}
          path: target/distributions/*.tar.gz
          if-no-files-found: error
          retention-days: 14
