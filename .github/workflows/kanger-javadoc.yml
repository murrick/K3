name: KANGER architectural Javadoc

on:
  pull_request:
    paths:
      - 'kanger/src/**/*.java'
      - 'kanger-udf/src/**/*.java'
      - 'kanger-data-dumb/src/**/*.java'
      - 'kanger-console/src/**/*.java'
      - 'docs/architecture/3.5.0.4-*.md'
      - 'pom.xml'
      - '.github/workflows/kanger-javadoc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javadoc:
    name: Java ${{ matrix.java }} Javadoc
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Generate implementation Javadoc
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/javadoc
          mkdir -p build/javadoc

          find \
            kanger/src \
            kanger-udf/src \
            kanger-data-dumb/src \
            kanger-console/src \
            -name '*.java' -print \
            | LC_ALL=C sort \
            > build/javadoc-sources.txt

          test -s build/javadoc-sources.txt

          javadoc \
            -quiet \
            -encoding UTF-8 \
            -docencoding UTF-8 \
            -charset UTF-8 \
            -Xdoclint:none \
            -d build/javadoc \
            @build/javadoc-sources.txt

      - name: Verify rendered architecture checkpoints
        shell: bash
        run: |
          set -euo pipefail

          user_doc=build/javadoc/org/kanger/User.html
          mind_doc=build/javadoc/org/kanger/Mind.html
          dictionary_doc=build/javadoc/org/kanger/factory/DictionaryFactory.html
          predicate_doc=build/javadoc/org/kanger/factory/PredicateFactory.html
          domain_doc=build/javadoc/org/kanger/factory/DomainFactory.html
          comment_doc=build/javadoc/org/kanger/factory/CommentFactory.html
          tvariable_doc=build/javadoc/org/kanger/factory/TVariableFactory.html
          tvalue_doc=build/javadoc/org/kanger/factory/TValueFactory.html
          function_doc=build/javadoc/org/kanger/factory/FunctionFactory.html
          fvalue_doc=build/javadoc/org/kanger/factory/FValueFactory.html
          library_doc=build/javadoc/org/kanger/factory/LibraryFactory.html

          test -s "$user_doc"
          test -s "$mind_doc"
          test -s "$dictionary_doc"
          test -s "$predicate_doc"
          test -s "$domain_doc"
          test -s "$comment_doc"
          test -s "$tvariable_doc"
          test -s "$tvalue_doc"
          test -s "$function_doc"
          test -s "$fvalue_doc"
          test -s "$library_doc"

          grep -Fq 'Пользовательский контекст верхнего уровня' "$user_doc"
          grep -Fq 'Активный логический контекст KANGER' "$mind_doc"
          grep -Fq 'Канонический словарь' "$dictionary_doc"
          grep -Fq 'Канонический реестр предикатов' "$predicate_doc"
          grep -Fq 'Канонический реестр и транзакционный overlay' "$domain_doc"
          grep -Fq 'Транзакционный реестр source/provenance' "$comment_doc"
          grep -Fq 'Реестр и транзакционный overlay логических' "$tvariable_doc"
          grep -Fq 'Канонический реестр, транзакционный overlay' "$tvalue_doc"
          grep -Fq 'Реестр и транзакционный overlay скомпилированных' "$function_doc"
          grep -Fq 'Канонический реестр и транзакционный overlay материализованных' "$fvalue_doc"
          grep -Fq 'Copy-on-write реестр и транзакционный overlay операций' "$library_doc"

          for rendered_doc in \
            "$user_doc" \
            "$mind_doc" \
            "$dictionary_doc" \
            "$predicate_doc" \
            "$domain_doc" \
            "$comment_doc" \
            "$tvariable_doc" \
            "$tvalue_doc" \
            "$function_doc" \
            "$fvalue_doc" \
            "$library_doc"
          do
            ! grep -Fq '{@link' "$rendered_doc"
          done

      - name: Upload rendered Javadoc
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: kanger-javadoc-java21
          path: build/javadoc
          if-no-files-found: error
          retention-days: 14
