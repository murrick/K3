name: KANGER Server

on:
  push:
    branches:
      - "server/**"
    paths:
      - "kanger-server/**"
      - ".github/workflows/kanger-server.yml"
  pull_request:
    paths:
      - "kanger-server/**"
      - ".github/workflows/kanger-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - "8"
          - "21"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build standalone server JAR
        shell: bash
        run: |
          mvn -B -ntp \
            -f kanger-server/pom.xml \
            -Dkanger.build.branch.override="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            clean verify

      - name: Verify distribution shape
        shell: bash
        run: |
          test -f kanger-server/target/kanger-server.jar
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/Kanger.class$'
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/HttpServer.class$'
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/Mind.class$'
          unzip -p kanger-server/target/kanger-server.jar META-INF/MANIFEST.MF \
            | grep -q '^Main-Class: org.kanger.Kanger'

      - name: Verify VPS deployment assets
        shell: bash
        run: |
          test -f kanger-server/deploy/install.sh
          test -f kanger-server/deploy/verify-installed.sh
          test -f kanger-server/deploy/systemd/kanger-server.service
          test -f kanger-server/deploy/nginx/kanger-server.conf.template
          test -f kanger-server/deploy/kanger.conf.example
          test -f kanger-server/DEPLOYMENT.md

          bash -n kanger-server/deploy/install.sh
          bash -n kanger-server/deploy/verify-installed.sh
          bash -n kanger-server/scripts/smoke-local.sh

          grep -q '^server.bind.address=127.0.0.1$' \
            kanger-server/deploy/kanger.conf.example
          grep -q '^server.port=1964$' \
            kanger-server/deploy/kanger.conf.example
          grep -q 'ExecStart=/usr/bin/java -Duser.home=/var/lib/kanger-server' \
            kanger-server/deploy/systemd/kanger-server.service
          grep -q 'KillSignal=SIGTERM' \
            kanger-server/deploy/systemd/kanger-server.service
          grep -q 'proxy_pass http://kanger_server_backend' \
            kanger-server/deploy/nginx/kanger-server.conf.template
          grep -q 'proxy_set_header X-Request-ID \$request_id' \
            kanger-server/deploy/nginx/kanger-server.conf.template
          grep -q 'location = /ready' \
            kanger-server/deploy/nginx/kanger-server.conf.template

      - name: Run authenticated loopback and shutdown smoke
        if: matrix.java == '21'
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/kanger-server-smoke"
          mkdir -p "${runtime}/home"
          cat > "${runtime}/home/kanger.conf" <<'EOF'
          server.bind.address=127.0.0.1
          server.port=1964
          server.backlog=16
          server.maxthreads=4
          server.queue.capacity=16
          server.request.max.body.bytes=1048576
          server.watchdog.period=1000
          EOF

          java \
            -Duser.home="${runtime}/home" \
            -jar kanger-server/target/kanger-server.jar \
            >"${runtime}/server.log" 2>&1 &
          server_pid=$!

          cleanup() {
            if [[ -n "${server_pid:-}" ]] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            echo "--- KANGER Server smoke log ---"
            cat "${runtime}/server.log"
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:1964/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true
          test -f "${runtime}/home/KANGER/kanger.active"

          ready_response="$(curl --fail --silent --show-error \
            --dump-header "${runtime}/ready.headers" \
            --header 'X-Request-ID: ci-ready-check' \
            http://127.0.0.1:1964/ready)"
          echo "${ready_response}" | grep -q '"status":"READY"'
          echo "${ready_response}" | grep -q '"queue_capacity":16'
          grep -qi '^X-Request-ID: ci-ready-check' "${runtime}/ready.headers"

          KANGER_BASE_URL=http://127.0.0.1:1964 \
            bash kanger-server/scripts/smoke-local.sh
          KANGER_BASE_URL=http://127.0.0.1:1964 \
            bash kanger-server/scripts/smoke-auth-local.sh

          ! grep -q 'CredentialStore.authenticate' "${runtime}/server.log"
          ! grep -q '^Authentication error$' "${runtime}/server.log"
          grep -q 'http request_id=ci-ready-check method=GET path=/ready status=200' \
            "${runtime}/server.log"
          ! grep -q 'Kanger-Smoke-' "${runtime}/server.log"
          ! grep -q 'Mail-Disabled-' "${runtime}/server.log"

          kill -TERM "${server_pid}"
          set +e
          wait "${server_pid}"
          shutdown_status=$?
          set -e
          server_pid=""

          test "${shutdown_status}" -eq 0 -o "${shutdown_status}" -eq 143
          test ! -e "${runtime}/home/KANGER/kanger.active"
          ! curl --silent --max-time 1 \
            http://127.0.0.1:1964/health >/dev/null 2>&1
          grep -q 'FORCE REBOOT Server' "${runtime}/server.log"

      - name: Upload Java 21 distribution
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: kanger-server-java21
          path: kanger-server/target/kanger-server.jar
          if-no-files-found: error
