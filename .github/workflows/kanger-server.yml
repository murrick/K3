name: KANGER Server

on:
  push:
    branches:
      - "server/**"
    paths:
      - "kanger-server/**"
      - "kanger/**"
      - "html/**"
      - ".github/workflows/kanger-server.yml"
  pull_request:
    paths:
      - "kanger-server/**"
      - "kanger/**"
      - "html/**"
      - ".github/workflows/kanger-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - "8"
          - "21"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build standalone server JAR
        shell: bash
        run: |
          mvn -B -ntp \
            -f kanger-server/pom.xml \
            -Dkanger.build.branch.override="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            clean verify

      - name: Verify browser gateway artifact
        if: matrix.java == '21'
        shell: bash
        run: |
          set -euo pipefail
          expected_files="$(cat <<'EOF_FILES'
          codemirror.css
          codemirror.js
          config.js
          console.html
          containment.js
          error.js
          favicon.ico
          gateway.js
          index.html
          javascript-mode-vendor.js
          javascript-mode.js
          javascript.js
          jquery-3.6.0.min.js
          operation.js
          workspace.js
          EOF_FILES
          )"
          actual_files="$(
            find html -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort
          )"
          test "${actual_files}" = "${expected_files}"

          node --check html/config.js
          node --check html/containment.js
          node --check html/error.js
          node --check html/gateway.js
          node --check html/javascript-mode-vendor.js
          node --check html/javascript-mode.js
          node --check html/javascript.js
          node --check html/operation.js
          node --check html/workspace.js
          node --check kanger-server/scripts/qualify-error-containment.js

          test "$(git hash-object html/javascript-mode-vendor.js)" = \
            "047395622eb2501dea6fbb9e6be2389e02bf2c77"

          grep -q '<script src="config.js"></script>' html/index.html
          grep -q '<script src="containment.js"></script>' html/index.html
          grep -q '<script src="gateway.js"></script>' html/index.html
          grep -q 'id="console-frame"' html/index.html
          grep -q 'sandbox="allow-scripts"' html/index.html
          grep -q 'referrerpolicy="no-referrer"' html/index.html
          ! grep -q 'allow-same-origin' html/index.html
          ! grep -q 'document.cookie' html/index.html
          ! grep -q 'tokenMonitor' html/index.html

          grep -q 'KANGER_CONTAINMENT_BOUNDARY' html/containment.js
          grep -q 'kanger.containment.v1' html/containment.js
          grep -q '__KANGER_PARENT_SESSION__' html/containment.js
          grep -q "event.origin !== 'null'" html/containment.js
          grep -q "connect-src 'none'" html/containment.js
          grep -q 'containment_context_denied' html/containment.js
          grep -q "copy.parameters.token = session.token" html/containment.js
          ! grep -q 'allow-same-origin' html/containment.js
          ! grep -q 'document.cookie' html/containment.js
          ! grep -q 'innerHTML' html/containment.js
          ! grep -q 'eval(' html/containment.js
          ! grep -q 'new Function' html/containment.js

          grep -q "kanger.applicationSession.v1" html/gateway.js
          grep -q "KANGER_SESSION_BOOTSTRAP" html/gateway.js
          grep -q "var PROBE_VALID = 'valid';" html/gateway.js
          grep -q "var PROBE_INVALID = 'invalid';" html/gateway.js
          grep -q "var PROBE_UNAVAILABLE = 'unavailable';" html/gateway.js
          grep -q "event.source !== consoleFrame.contentWindow" html/gateway.js
          grep -q "session.logout" html/gateway.js
          grep -q "session.credentials.change" html/gateway.js
          ! grep -Fq "setCookie('token'" html/gateway.js
          ! grep -Fq 'setCookie("token"' html/gateway.js

          grep -q 'javascript-mode.js' html/javascript.js
          grep -q 'KANGER_TRUSTED_RENDERING' html/javascript.js
          grep -q "HISTORY_PREFIX = '@K2@'" html/javascript.js
          grep -q 'tokenizeLegacyMarkup' html/javascript.js
          grep -q 'document.createTextNode' html/javascript.js
          ! grep -q 'insertAdjacentHTML' html/javascript.js
          ! grep -q 'outerHTML' html/javascript.js
          ! grep -q 'onclick=' html/javascript.js

          grep -q 'javascript-mode-vendor.js' html/javascript-mode.js
          grep -q 'operation.js' html/javascript-mode.js
          grep -q 'workspace.js' html/javascript-mode.js
          grep -q 'error.js' html/javascript-mode.js
          grep -q 'KANGER_OPERATION_PROTOCOL' html/operation.js
          grep -q 'operation_busy' html/operation.js
          grep -q 'operation_timeout' html/operation.js
          grep -q 'client_snapshot_id' html/operation.js
          ! grep -q 'innerHTML' html/operation.js
          ! grep -q 'document.cookie' html/operation.js

          grep -q 'KANGER_WORKSPACE_STATE' html/workspace.js
          grep -q 'canonicalSourceName' html/workspace.js
          grep -q 'canonicalStorageName' html/workspace.js
          grep -q 'repository_state' html/workspace.js
          ! grep -q 'innerHTML' html/workspace.js
          ! grep -q 'document.cookie' html/workspace.js

          grep -q 'KANGER_ERROR_BOUNDARY' html/error.js
          grep -q 'session_action' html/error.js
          grep -q 'operation_outcome' html/error.js
          grep -q 'transport_unavailable' html/error.js
          ! grep -q 'innerHTML' html/error.js
          ! grep -q 'document.cookie' html/error.js

          node kanger-server/scripts/qualify-error-containment.js \
            "${GITHUB_WORKSPACE}"

      - name: Verify distribution shape
        shell: bash
        run: |
          test -f kanger-server/target/kanger-server.jar
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/Kanger.class$'
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/HttpServer.class$'
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/Mind.class$'
          jar tf kanger-server/target/kanger-server.jar | grep -q '^org/kanger/WorkspaceStateReactor.class$'
          unzip -p kanger-server/target/kanger-server.jar META-INF/MANIFEST.MF \
            | grep -q '^Main-Class: org.kanger.Kanger'
          unzip -p kanger-server/target/kanger-server.jar org/kanger/build.properties \
            | grep -q '^server.version=server-0.18$'

      - name: Verify VPS deployment assets
        shell: bash
        run: |
          test -f kanger-server/deploy/install.sh
          test -f kanger-server/deploy/verify-installed.sh
          test -f kanger-server/deploy/kanger-admin
          test -f kanger-server/deploy/systemd/kanger-server.service
          test -f kanger-server/deploy/nginx/kanger-server.conf.template
          test -f kanger-server/deploy/kanger.conf.example
          test -f kanger-server/DEPLOYMENT.md
          test -f kanger-server/VERSION-CONTRACT.md

          bash -n kanger-server/deploy/install.sh
          bash -n kanger-server/deploy/verify-installed.sh
          bash -n kanger-server/deploy/kanger-admin
          bash -n kanger-server/scripts/smoke-local.sh

          grep -q '^server.bind.address=127.0.0.1$' \
            kanger-server/deploy/kanger.conf.example
          grep -q '^server.port=1964$' \
            kanger-server/deploy/kanger.conf.example
          grep -q '^server.admin.enabled=true$' \
            kanger-server/deploy/kanger.conf.example
          grep -q '^server.admin.bind.address=127.0.0.1$' \
            kanger-server/deploy/kanger.conf.example
          grep -q '^server.admin.port=1965$' \
            kanger-server/deploy/kanger.conf.example
          grep -q 'ExecStart=/usr/bin/java -Duser.home=/var/lib/kanger-server' \
            kanger-server/deploy/systemd/kanger-server.service
          grep -q 'KillSignal=SIGTERM' \
            kanger-server/deploy/systemd/kanger-server.service
          grep -q 'proxy_pass http://kanger_server_backend' \
            kanger-server/deploy/nginx/kanger-server.conf.template
          grep -q 'proxy_set_header X-Request-ID \$request_id' \
            kanger-server/deploy/nginx/kanger-server.conf.template
          grep -q 'location = /ready' \
            kanger-server/deploy/nginx/kanger-server.conf.template
          grep -q 'assert_loopback_listener 1964 "application"' \
            kanger-server/deploy/verify-installed.sh
          grep -q 'assert_loopback_listener 1965 "operator"' \
            kanger-server/deploy/verify-installed.sh
          grep -q 'Publish the qualified 15-file browser artifact' \
            kanger-server/DEPLOYMENT.md
          grep -q 'sandbox="allow-scripts"' \
            kanger-server/DEPLOYMENT.md
          ! grep -q 'allow-same-origin is permitted' \
            kanger-server/DEPLOYMENT.md

      - name: Run authenticated loopback and shutdown smoke
        if: matrix.java == '21'
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/kanger-server-smoke"
          mkdir -p "${runtime}/home"
          cat > "${runtime}/home/kanger.conf" <<'EOF_CONFIG'
          server.bind.address=127.0.0.1
          server.port=1964
          server.backlog=16
          server.maxthreads=4
          server.queue.capacity=16
          server.request.max.body.bytes=1048576
          server.watchdog.period=1000
          EOF_CONFIG

          java \
            -Duser.home="${runtime}/home" \
            -jar kanger-server/target/kanger-server.jar \
            >"${runtime}/server.log" 2>&1 &
          server_pid=$!

          cleanup() {
            if [[ -n "${server_pid:-}" ]] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            echo "--- KANGER Server smoke log ---"
            cat "${runtime}/server.log"
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:1964/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true
          test -f "${runtime}/home/KANGER/kanger.active"

          health_response="$(curl --fail --silent --show-error \
            http://127.0.0.1:1964/health)"
          echo "${health_response}" | grep -q '"version":"3.3"'
          echo "${health_response}" | grep -q '"core_version":"3.3"'
          echo "${health_response}" | grep -q '"api_version":"1"'
          echo "${health_response}" | grep -q '"server_version":"server-0.18"'

          ready_response="$(curl --fail --silent --show-error \
            --dump-header "${runtime}/ready.headers" \
            --header 'X-Request-ID: ci-ready-check' \
            http://127.0.0.1:1964/ready)"
          echo "${ready_response}" | grep -q '"status":"READY"'
          echo "${ready_response}" | grep -q '"version":"3.3"'
          echo "${ready_response}" | grep -q '"core_version":"3.3"'
          echo "${ready_response}" | grep -q '"api_version":"1"'
          echo "${ready_response}" | grep -q '"server_version":"server-0.18"'
          echo "${ready_response}" | grep -q '"queue_capacity":16'
          grep -qi '^X-Request-ID: ci-ready-check' "${runtime}/ready.headers"

          KANGER_BASE_URL=http://127.0.0.1:1964 \
            bash kanger-server/scripts/smoke-local.sh
          KANGER_BASE_URL=http://127.0.0.1:1964 \
            bash kanger-server/scripts/smoke-auth-local.sh

          ! grep -q 'CredentialStore.authenticate' "${runtime}/server.log"
          ! grep -q '^Authentication error$' "${runtime}/server.log"
          grep -q 'http request_id=ci-ready-check method=GET path=/ready status=200' \
            "${runtime}/server.log"
          ! grep -q 'Kanger-Smoke-' "${runtime}/server.log"
          ! grep -q 'Mail-Disabled-' "${runtime}/server.log"

          kill -TERM "${server_pid}"
          set +e
          wait "${server_pid}"
          shutdown_status=$?
          set -e
          server_pid=""

          test "${shutdown_status}" -eq 0 -o "${shutdown_status}" -eq 143
          test ! -e "${runtime}/home/KANGER/kanger.active"
          ! curl --silent --max-time 1 \
            http://127.0.0.1:1964/health >/dev/null 2>&1
          grep -q 'FORCE REBOOT Server' "${runtime}/server.log"

      - name: Upload Java 21 distribution
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: kanger-server-java21
          path: kanger-server/target/kanger-server.jar
          if-no-files-found: error
