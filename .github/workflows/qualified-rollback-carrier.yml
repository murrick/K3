name: Qualified rollback carrier

on:
  push:
    branches:
      - tmp/3.7.0.20-qualified-rollback-carrier
    paths:
      - .github/workflows/qualified-rollback-carrier.yml

permissions:
  contents: write

jobs:
  qualify-and-publish-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact RED parent
        uses: actions/checkout@v5
        with:
          ref: 66d7f14ace6f66a44352d74913136b893a0d850e
          fetch-depth: 0

      - name: Apply minimal implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rewrite(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          portable = "kanger/src/org/kanger/PortableMindLayer.java"
          rewrite(portable,
                  "import org.kanger.interfaces.IRule;\nimport org.kanger.units.Comment;",
                  "import org.kanger.interfaces.IRule;\nimport org.kanger.interfaces.ITerm;\nimport org.kanger.units.Comment;")
          rewrite(portable,
                  "import java.util.LinkedHashSet;\nimport java.util.List;",
                  "import java.util.LinkedHashSet;\nimport java.util.LinkedList;\nimport java.util.List;")
          rewrite(portable,
                  "            Boolean result = child.query(entry.getValue());",
                  "            child.compileLine(entry.getValue(), false, new LinkedList<ITerm>());")
          rewrite(portable,
                  "            if (!Boolean.TRUE.equals(result) && rule.isDeleted(child)) {\n                throw new IllegalStateException(\"Cannot replay Rule declaration: \" + origin);\n            }\n",
                  "")

          snapshot = "kanger/src/org/kanger/UserTransactionStackSnapshot.java"
          rewrite(snapshot,
                  "                rootLevel.apply(root, work);\n                if (!tx.commit()) {",
                  "                rootLevel.apply(root, work);\n                if (!Boolean.TRUE.equals(work.queryCheck(false))) {\n                    throw new IllegalStateException(\n                            \"Offline U0 conflicts with target storage baseline\");\n                }\n                if (!tx.commit()) {")
          rewrite(snapshot,
                  "                current = child;\n            }\n            return current;",
                  "                current = child;\n            }\n            if (!Boolean.TRUE.equals(current.queryCheck(false))) {\n                throw new IllegalStateException(\n                        \"Replayed current context conflicts with storage baseline\");\n            }\n            return current;")

          processor = "kanger/src/org/kanger/CanonicalCommandProcessor.java"
          rewrite(processor,
                  "        if (parent == null) {\n            return Result.rejected(mind, \"No transactions was created\");\n        }\n        parent.release(mind);",
                  "        if (parent == null) {\n            return Result.rejected(mind, \"No transactions was created\");\n        }\n        if (!Boolean.TRUE.equals(((Mind) parent).queryCheck(false))) {\n            return Result.rejected(mind,\n                    \"Transaction rollback rejected: target context conflicts with current storage baseline\");\n        }\n        parent.release(mind);")
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3

      - name: Run focused qualified rollback characterization
        run: >-
          mvn -B -ntp -f kanger-server/pom.xml
          -Dtest=QualifiedRollbackAfterStorageRebaseTest
          test

      - name: Publish ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KANGER qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            kanger/src/org/kanger/PortableMindLayer.java \
            kanger/src/org/kanger/UserTransactionStackSnapshot.java \
            kanger/src/org/kanger/CanonicalCommandProcessor.java
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "fix(transaction): qualify rollback after storage rebase"
          git push origin HEAD:refs/heads/tmp/3.7.0.20-qualified-rollback-ready
