name: Transaction squash carrier

on:
  push:
    branches:
      - tmp/3.7.0.20-transaction-squash-carrier
    paths:
      - .github/workflows/transaction-squash-carrier.yml

permissions:
  contents: write

jobs:
  qualify-and-publish-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out squash implementation
        uses: actions/checkout@v5
        with:
          ref: c87bbe38667435e23bf06e0f194ec3423b10b582
          fetch-depth: 0

      - name: Align transaction prefix conformance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kanger-command/test/org/kanger/command/CommandParserConformanceTest.java')
          text = path.read_text()
          old = '''        expect("transaction", CommandIntent.TX_STATUS);\n        expect("t s", CommandIntent.TX_START);\n        expect("t c", CommandIntent.TX_COMMIT);\n        expect("t r", CommandIntent.TX_ROLLBACK);\n'''
          new = '''        expect("transaction", CommandIntent.TX_STATUS);\n        expect("t st", CommandIntent.TX_START);\n        expect("t c", CommandIntent.TX_COMMIT);\n        expect("t r", CommandIntent.TX_ROLLBACK);\n        expect("t sq", CommandIntent.TX_SQUASH);\n        reject("t s", AMBIGUOUS_PREFIX);\n'''
          if text.count(old) != 1:
              raise SystemExit('transaction conformance anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "kanger-command/test/org/kanger/command/CommandParserConformanceTest.java"

      - name: Run complete root qualification corpus
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Publish aligned ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KANGER qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add kanger-command/test/org/kanger/command/CommandParserConformanceTest.java
          git commit -m "test(command): qualify transaction squash prefix"
          git push origin HEAD:refs/heads/tmp/3.7.0.20-transaction-squash-ready
