name: Transaction squash carrier

on:
  push:
    branches:
      - tmp/3.7.0.20-transaction-squash-carrier
    paths:
      - .github/workflows/transaction-squash-carrier.yml

jobs:
  locate-shorthand:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out squash implementation
        uses: actions/checkout@v5
        with:
          ref: c87bbe38667435e23bf06e0f194ec3423b10b582
          fetch-depth: 0
      - name: Locate TransactionShorthandRunner source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact class/string matches ==='
          grep -R -n --exclude-dir=.git -E 'TransactionShorthandRunner|Undocumented transaction-family error' . || true
          echo '=== transaction shorthand-like sources ==='
          grep -R -n --exclude-dir=.git -E 'transaction s|TX_START|AMBIGUOUS_PREFIX' kanger-qualification kanger-command 2>/dev/null | head -n 300 || true
