name: KANGER Server deployment automation

on:
  push:
    branches:
      - "server/**"
    paths:
      - "kanger-server/deploy/kanger-deploy.sh"
      - "kanger-server/deploy/kanger-update.sh"
      - "kanger-server/test/kanger-deploy-script-test.sh"
      - "kanger-server/test/kanger-update-script-test.sh"
      - "kanger-server/FIRST-DEPLOY.md"
      - "kanger-server/FIRST-DEPLOY-AUTOMATION.md"
      - "kanger-server/UPDATE.md"
      - ".github/workflows/kanger-server-update.yml"
  pull_request:
    paths:
      - "kanger-server/deploy/kanger-deploy.sh"
      - "kanger-server/deploy/kanger-update.sh"
      - "kanger-server/test/kanger-deploy-script-test.sh"
      - "kanger-server/test/kanger-update-script-test.sh"
      - "kanger-server/FIRST-DEPLOY.md"
      - "kanger-server/FIRST-DEPLOY-AUTOMATION.md"
      - "kanger-server/UPDATE.md"
      - ".github/workflows/kanger-server-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Shelf-to-production deployment contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify shell syntax and help contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n kanger-server/deploy/kanger-deploy.sh
          bash -n kanger-server/deploy/kanger-update.sh
          bash -n kanger-server/test/kanger-deploy-script-test.sh
          bash -n kanger-server/test/kanger-update-script-test.sh

          bash kanger-server/deploy/kanger-deploy.sh --help \
            | grep -q 'first KANGER Server application deployment'
          bash kanger-server/deploy/kanger-update.sh --help \
            | grep -q 'stable shelf branch develop/server/0.12'

          bash kanger-server/deploy/kanger-deploy.sh --dry-run \
            | grep -q 'no repository, build, SSH or HTTP action was performed'
          bash kanger-server/deploy/kanger-update.sh --dry-run \
            | grep -q 'no repository, build, SSH or HTTP action was performed'

      - name: Exercise first-deployment orchestration
        shell: bash
        run: |
          set -euo pipefail
          bash kanger-server/test/kanger-deploy-script-test.sh

      - name: Exercise update and no-op orchestration
        shell: bash
        run: |
          set -euo pipefail
          bash kanger-server/test/kanger-update-script-test.sh

      - name: Verify operational safety invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'DEFAULT_REF="develop/server/0.12"' \
            kanger-server/deploy/kanger-deploy.sh
          grep -q 'DEFAULT_REF="develop/server/0.12"' \
            kanger-server/deploy/kanger-update.sh

          grep -q 'use kanger-update.sh or pass --force deliberately' \
            kanger-server/deploy/kanger-deploy.sh
          grep -q 'clean verify' \
            kanger-server/deploy/kanger-deploy.sh
          grep -q 'install.sh owns rollback' \
            kanger-server/deploy/kanger-deploy.sh
          grep -q '/run/lock/kanger-server-update.lock' \
            kanger-server/deploy/kanger-deploy.sh
          grep -q 'expected 403' \
            kanger-server/deploy/kanger-deploy.sh

          grep -q 'clean verify' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'install.sh owns rollback' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'source commit is already deployed; skipping build and restart' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'expected 403' \
            kanger-server/deploy/kanger-update.sh

          grep -q 'The Java service itself may not already be installed' \
            kanger-server/FIRST-DEPLOY-AUTOMATION.md
          grep -q '/var/lib/kanger-server' \
            kanger-server/UPDATE.md
