name: KANGER Server update automation

on:
  push:
    branches:
      - "server/**"
    paths:
      - "kanger-server/deploy/kanger-update.sh"
      - "kanger-server/test/kanger-update-script-test.sh"
      - "kanger-server/UPDATE.md"
      - ".github/workflows/kanger-server-update.yml"
  pull_request:
    paths:
      - "kanger-server/deploy/kanger-update.sh"
      - "kanger-server/test/kanger-update-script-test.sh"
      - "kanger-server/UPDATE.md"
      - ".github/workflows/kanger-server-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-contract:
    name: Shelf-to-production updater contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify shell syntax and help contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n kanger-server/deploy/kanger-update.sh
          bash -n kanger-server/test/kanger-update-script-test.sh
          bash kanger-server/deploy/kanger-update.sh --help \
            | grep -q 'stable shelf branch develop/server/0.12'
          bash kanger-server/deploy/kanger-update.sh --dry-run \
            | grep -q 'no repository, build, SSH or HTTP action was performed'

      - name: Exercise deployment and no-op orchestration
        shell: bash
        run: |
          set -euo pipefail
          bash kanger-server/test/kanger-update-script-test.sh

      - name: Verify operational safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DEFAULT_REF="develop/server/0.12"' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'clean verify' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'install.sh owns rollback' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'remote already contains this exact JAR; skipping restart' \
            kanger-server/deploy/kanger-update.sh
          grep -q 'expected 403' \
            kanger-server/deploy/kanger-update.sh
          grep -q '/var/lib/kanger-server' \
            kanger-server/UPDATE.md
