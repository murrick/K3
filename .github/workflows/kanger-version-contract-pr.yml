name: KANGER Server 0.13 version contract PR bootstrap

on:
  pull_request:
    branches:
      - "server/0.12.1-update-automation"
    paths:
      - ".github/workflows/kanger-version-contract-bootstrap.yml"
      - ".github/workflows/kanger-version-contract-pr.yml"

permissions:
  contents: write

jobs:
  apply-version-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and apply version contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/kanger-version-contract-bootstrap.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          block = source[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          Path('/tmp/apply-version-contract.py').write_text(script)
          PY
          python3 /tmp/apply-version-contract.py

      - name: Qualify the implementation
        shell: bash
        run: |
          set -euo pipefail
          bash -n kanger-server/deploy/kanger-deploy.sh
          bash -n kanger-server/deploy/kanger-update.sh
          bash -n kanger-server/scripts/smoke-local.sh
          mvn -B -ntp -f kanger-server/pom.xml clean verify

      - name: Commit the qualified code artifact
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          git config user.name "KANGER Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Server 0.13: expose core, API and server versions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
