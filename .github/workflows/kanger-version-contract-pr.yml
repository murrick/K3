name: KANGER Server 0.13 shelf default qualification

on:
  pull_request:
    branches:
      - "server/0.12.1-update-automation"
    paths:
      - ".github/workflows/kanger-version-contract-pr.yml"
      - "kanger-server/test/apply-server-013-shelf-default.py"

permissions:
  contents: write

jobs:
  qualify-shelf-default:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Advance deployment default to Server 0.13 shelf
        run: python3 kanger-server/test/apply-server-013-shelf-default.py

      - name: Qualify updater and deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n kanger-server/deploy/kanger-deploy.sh
          bash -n kanger-server/deploy/kanger-update.sh
          bash kanger-server/test/kanger-deploy-script-test.sh
          bash kanger-server/test/kanger-update-script-test.sh
          bash kanger-server/test/kanger-update-interrupted-receipt-test.sh
          mvn -B -ntp -f kanger-server/pom.xml clean verify

      - name: Commit qualified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f kanger-server/test/apply-server-013-shelf-default.py
          git config user.name "KANGER Automation"
          git config user.email "actions@users.noreply.github.com"
          git add kanger-server
          git commit -m "Server 0.13: make the 0.13 shelf the deployment default"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
