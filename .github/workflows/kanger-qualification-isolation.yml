name: KANGER qualification isolation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-parser-boundary-hotfix:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/3.5.0.7-parser-hotfix-trigger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/3.5.0.8-parser-terminal-delimiter

      - name: Apply parser hotfix
        run: python3 tools/apply_parser_terminal_hotfix.py

      - name: Publish Java correction only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/kanger-qualification-isolation.yml \
                          .github/workflows/one-shot-3.5.0.8-parser-boundary.yml \
                          tools/apply_parser_terminal_hotfix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kanger/src/org/kanger/enums/Tools.java \
                  kanger/src/org/kanger/compiler/Parser.java \
                  kanger-qualification/src/org/kanger/KangerParserTerminalDelimiterSafetyRunner.java
          git commit -m '3.5.0.7: guard parser terminal delimiters'
          git push origin HEAD:fix/3.5.0.8-parser-terminal-delimiter

  isolate-qualification:
    name: Production surface excludes runners
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify production source roots are clean
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(find \
            kanger/src \
            kanger-console/src \
            kanger-data-dumb/src \
            kanger-udf/src \
            -type f -name '*Runner.java' -print)"
          if [ -n "$remaining" ]; then
            echo 'Qualification runners remain in production source roots:'
            printf '%s\n' "$remaining"
            exit 1
          fi

      - name: Package production artifact
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Verify production JAR is clean
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$jar_file"
          leaked="$(jar tf "$jar_file" | grep -E '(^|/)[^/]*Runner\.class$' || true)"
          if [ -n "$leaked" ]; then
            echo 'Qualification runners leaked into production JAR:'
            printf '%s\n' "$leaked"
            exit 1
          fi

      - name: Verify qualification source remains available
        shell: bash
        run: |
          set -euo pipefail
          test -d kanger-qualification/src
          count="$(find kanger-qualification/src -type f -name '*Runner.java' | wc -l | tr -d ' ')"
          test "$count" -eq 36
          mvn --batch-mode --no-transfer-progress -DskipTests test-compile
