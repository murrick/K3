name: KANGER customer documentation

on:
  push:
    paths:
      - "distribution/**"
      - "kanger-command/**"
      - "kanger/src/org/kanger/CanonicalStatusRenderer.java"
      - "kanger/src/org/kanger/CanonicalStatusSnapshot.java"
      - "kanger/src/org/kanger/User.java"
      - "kanger-server/deploy/kanger.conf.example"
      - "kanger-server/src/org/kanger/CanonicalCommandIngressReactor.java"
      - "kanger-server/src/org/kanger/CanonicalCommandRuntimeReactor.java"
      - "kanger-server/src/org/kanger/PublicAuthCapabilitiesReactor.java"
      - "kanger-server/src/org/kanger/Settings.java"
      - "kanger-server/src/org/kanger/UserFactory.java"
      - "kanger-server/src/org/kanger/account/RegistrationPolicy.java"
      - "html/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-documentation.yml"
  pull_request:
    paths:
      - "distribution/**"
      - "kanger-command/**"
      - "kanger/src/org/kanger/CanonicalStatusRenderer.java"
      - "kanger/src/org/kanger/CanonicalStatusSnapshot.java"
      - "kanger/src/org/kanger/User.java"
      - "kanger-server/deploy/kanger.conf.example"
      - "kanger-server/src/org/kanger/CanonicalCommandIngressReactor.java"
      - "kanger-server/src/org/kanger/CanonicalCommandRuntimeReactor.java"
      - "kanger-server/src/org/kanger/PublicAuthCapabilitiesReactor.java"
      - "kanger-server/src/org/kanger/Settings.java"
      - "kanger-server/src/org/kanger/UserFactory.java"
      - "kanger-server/src/org/kanger/account/RegistrationPolicy.java"
      - "html/**"
      - "**/pom.xml"
      - ".github/workflows/kanger-documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-documentation:
    name: Qualify manuals and packaged documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Qualify documented product surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 distribution/qualify-documentation.py

      - name: Build qualified distribution
        shell: bash
        run: |
          set -euo pipefail
          bash distribution/build-distribution.sh

      - name: Verify manuals in release archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distribution/VERSION)"
          archive="target/distributions/kanger-${version}.tar.gz"
          root="kanger-${version}"
          test -f "${archive}"
          listing="$(tar -tzf "${archive}")"
          for member in \
            "${root}/README.md" \
            "${root}/docs/COMMANDS.md" \
            "${root}/docs/UI_CONSOLE.md"
          do
            grep -Fqx -- "${member}" <<<"${listing}"
          done

          tar -xOzf "${archive}" "${root}/README.md" \
            | grep -Fq 'docs/COMMANDS.md'
          tar -xOzf "${archive}" "${root}/README.md" \
            | grep -Fq 'docs/UI_CONSOLE.md'
          tar -xOzf "${archive}" "${root}/docs/COMMANDS.md" \
            | grep -Fq 'Canonical `status`'
          tar -xOzf "${archive}" "${root}/docs/UI_CONSOLE.md" \
            | grep -Fq 'TECH panel'

      - name: Publish qualification archive
        uses: actions/upload-artifact@v5
        with:
          name: kanger-customer-docs-${{ github.sha }}
          path: target/distributions/kanger-*.tar.gz
          if-no-files-found: error
