name: KANGER 3.5.0.6 API documentation pilot v2

on:
  pull_request:
    branches:
      - arch/3.5.0-core-consolidation
    paths:
      - '.github/workflows/3.5.0.6-api-pilot-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'trigger/3.5.0.6-api-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out live artifact branch
        uses: actions/checkout@v4
        with:
          ref: arch/3.5.0-core-consolidation
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Recover and apply qualified documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin trigger/3.5.0.6-api-pilot
          git show FETCH_HEAD:.github/workflows/3.5.0.6-api-pilot.yml > /tmp/original-pilot.yml
          python3 - <<'EXTRACT'
          from pathlib import Path

          source = Path('/tmp/original-pilot.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-api-pilot.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          EXTRACT
          python3 /tmp/apply-api-pilot.py

      - name: Compile, test and render documentation
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress test
          rm -rf build/javadoc
          mkdir -p build/javadoc
          find kanger/src kanger-udf/src kanger-data-dumb/src kanger-console/src \
            -name '*.java' -print | LC_ALL=C sort > build/javadoc-sources.txt
          javadoc -quiet -encoding UTF-8 -docencoding UTF-8 -charset UTF-8 \
            -Xdoclint:none -d build/javadoc @build/javadoc-sources.txt
          python3 tools/audit_public_api_javadoc.py | tee build/public-api-javadoc.tsv
          grep -Fq 'caller-managed ссылку на текущий Mind' \
            build/javadoc/org/kanger/interfaces/IUser.html
          grep -Fq 'Публичный контракт активного логического контекста KANGER' \
            build/javadoc/org/kanger/interfaces/IMind.html
          grep -Fq 'query-local join/filter' \
            build/javadoc/org/kanger/Linker.html
          grep -Fq 'Историческое имя не обозначает физический database I/O' \
            build/javadoc/org/kanger/Linker.html

      - name: Publish clean pilot commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KANGER documentation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            kanger/src/org/kanger/interfaces/IUser.java \
            kanger/src/org/kanger/interfaces/IMind.java \
            kanger/src/org/kanger/Linker.java
          git diff --cached --check
          git commit -m 'Document caller and Linker API contracts'
          git push origin HEAD:arch/3.5.0-core-consolidation
