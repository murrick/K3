name: TEMP KANGER settlement closure

on:
  push:
    branches:
      - arch/3.7.0.10-command-transaction-model

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: make post-settlement outcome explicit'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply guarded settlement edits
        run: python3 .github/scripts/kanger-temp-settlement-closure.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat
          grep -q 'finishTransactionReservationLocked' kanger/src/org/kanger/Mind.java
          grep -q 'transaction_settlement_finalization_failed' kanger-server/src/org/kanger/MindLifecycleReactor.java

      - name: Run focused settlement and transaction gates
        run: |
          mvn -B -ntp -f kanger-server/pom.xml \
            -Dtest=TransactionSettlementFinalizationTest,MindLifecycleReactorTest,TechnicalMindTransactionTest,CommandBoundaryTransactionModelTest,StorageRebaseFailureAtomicityTest,TransactionReservationInvariantTest,ExplicitStorageLifecycleTest,WorkspaceStateReactorTest \
            test

      - name: Commit settlement closure
        run: |
          git config user.name 'KANGER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            kanger/src/org/kanger/Mind.java \
            kanger-server/src/org/kanger/MindLifecycleReactor.java \
            kanger-server/test/org/kanger/WorkspaceStateReactorTest.java
          if git diff --cached --quiet; then
            echo 'No settlement changes to commit'
            exit 0
          fi
          git commit -m 'feat: make post-settlement outcome explicit'
          git push origin HEAD:arch/3.7.0.10-command-transaction-model
