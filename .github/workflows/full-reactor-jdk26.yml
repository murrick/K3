name: KANGER full reactor JDK 26

on:
  push:
    branches:
      - fix/3.8.0-full-reactor-jdk26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-reactor:
    name: Full root reactor / Java 26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Maven environment
        run: mvn --version

      - name: Clean full reactor build
        run: mvn --batch-mode --no-transfer-progress clean install
