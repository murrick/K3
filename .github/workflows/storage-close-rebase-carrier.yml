name: Storage close rebase carrier

on:
  push:
    branches:
      - tmp/3.7.0.20-storage-close-rebase-carrier
    paths:
      - .github/workflows/storage-close-rebase-carrier.yml

permissions:
  contents: write

jobs:
  qualify-and-publish-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact close candidate
        uses: actions/checkout@v5
        with:
          ref: d1df791e9140e2c7fc88fe74a273b9affae03440
          fetch-depth: 0

      - name: Restore strict close idempotence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kanger/src/org/kanger/User.java')
          text = path.read_text()
          old = '''    private Mind closeQuiescentStorage(Mind mind) throws Exception {\n        requireTransactionQuiescence(mind, "close database");\n'''
          new = '''    private Mind closeQuiescentStorage(Mind mind) throws Exception {\n        if (isClosed()) {\n            return mind;\n        }\n        requireTransactionQuiescence(mind, "close database");\n'''
          if text.count(old) != 1:
              raise SystemExit('strict close helper anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "kanger/src/org/kanger/User.java"

      - name: Run focused close and destructive lifecycle qualification
        run: >-
          mvn -B -ntp -f kanger-server/pom.xml
          -Dtest=StorageCloseRebaseTransactionStackTest,DestructiveStopLossReactorTest,StorageRemovalTruthfulnessTest
          test

      - name: Publish ready production commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KANGER qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add kanger/src/org/kanger/User.java
          git commit -m "fix(storage): preserve strict close idempotence"
          git push --force origin HEAD:refs/heads/tmp/3.7.0.20-storage-close-rebase-ready
