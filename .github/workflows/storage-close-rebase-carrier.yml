name: Storage close rebase carrier

on:
  push:
    branches:
      - tmp/3.7.0.20-storage-close-rebase-carrier
    paths:
      - .github/workflows/storage-close-rebase-carrier.yml

permissions:
  contents: write

jobs:
  qualify-and-publish-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out strict-close candidate
        uses: actions/checkout@v5
        with:
          ref: e97c6aa698d4e399ac5772688017071c109f55b5
          fetch-depth: 0

      - name: Align close transaction contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_test(path, method_name, replacement):
              text = path.read_text()
              marker = '    @Test\n    void ' + method_name
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'method not found: {path}:{method_name}')
              next_test = text.find('    @Test\n', start + len(marker))
              if next_test < 0:
                  raise SystemExit(f'next test not found: {path}:{method_name}')
              path.write_text(text[:start] + replacement.rstrip() + '\n\n' + text[next_test:])

          canonical = Path('kanger-server/test/org/kanger/CanonicalStorageCloseConvergenceTest.java')
          replace_test(canonical,
              'browserCloseRejectsActiveTransactionWithoutLegacyEscapeOrMutation',
              '''    @Test
              void browserClosePreservesActiveTransactionWithoutLegacyEscape()
                      throws Exception {
                  Fixture fixture = fixture("browser-close-active");
                  try {
                      CanonicalCommandProcessor processor = new CanonicalCommandProcessor();
                      CommandParser parser = new CommandParser();
                      processor.execute(parser.parse("storage use close.active"), fixture.user);
                      Mind child = new Mind(fixture.user.getCurrentMind());
                      fixture.user.setCurrentMind(child);
                      assertTrue(Boolean.TRUE.equals(child.query("!close_active_transient;")));

                      AtomicInteger escaped = new AtomicInteger();
                      JSONObject closed = invoke(
                              canonicalReactor(escaped), fixture.token, "storage close");

                      assertEquals("OK", closed.optString("result"), closed.toString());
                      assertEquals("STORAGE_CLOSE", closed.optString("canonical_intent"));
                      assertEquals(0, escaped.get(),
                              "Canonical storage close escaped into legacy close protocol");
                      assertFalse(closed.getJSONObject("storage").getBoolean("used"));
                      assertEquals(1, closed.optInt("transaction", -1));
                      IMind offlineChild = fixture.user.getCurrentMind();
                      assertEquals(1, offlineChild.getTransactionLevel());
                      assertFalse(offlineChild.isStorageUsed());
                      assertTrue(Boolean.TRUE.equals(
                              offlineChild.query("?close_active_transient;")));

                      CanonicalCommandProcessor.Result rolledBack = processor.execute(
                              parser.parse("transaction rollback"), fixture.user);
                      assertTrue(rolledBack.isSuccess());
                      assertEquals(0, rolledBack.getMind().getTransactionLevel());
                      assertFalse(Boolean.TRUE.equals(
                              rolledBack.getMind().query("?close_active_transient;")));
                  } finally {
                      fixture.close();
                  }
              }''')

          replace_test(canonical,
              'sharedProcessorSurfacesSameCoreActiveCloseException',
              '''    @Test
              void sharedProcessorPreservesActiveTransactionAcrossClose() throws Exception {
                  Fixture fixture = fixture("processor-active-close");
                  try {
                      CanonicalCommandProcessor processor = new CanonicalCommandProcessor();
                      CommandParser parser = new CommandParser();
                      processor.execute(parser.parse("storage use processor.active"), fixture.user);
                      Mind child = new Mind(fixture.user.getCurrentMind());
                      fixture.user.setCurrentMind(child);
                      assertTrue(Boolean.TRUE.equals(
                              child.query("!processor_close_transient;")));

                      CanonicalCommandProcessor.Result closed = processor.execute(
                              parser.parse("storage close"), fixture.user);

                      assertTrue(closed.isSuccess());
                      assertEquals(1, closed.getMind().getTransactionLevel());
                      assertFalse(closed.getMind().isStorageUsed());
                      assertTrue(Boolean.TRUE.equals(
                              closed.getMind().query("?processor_close_transient;")));

                      CanonicalCommandProcessor.Result rolledBack = processor.execute(
                              parser.parse("transaction rollback"), fixture.user);
                      assertTrue(rolledBack.isSuccess());
                      assertEquals(0, rolledBack.getMind().getTransactionLevel());
                      assertFalse(Boolean.TRUE.equals(
                              rolledBack.getMind().query("?processor_close_transient;")));
                  } finally {
                      fixture.close();
                  }
              }''')

          explicit = Path('kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java')
          replace_test(explicit,
              'ordinaryCoreUserOwnsTheLifecycleContract',
              '''    @Test
              void ordinaryCoreUserOwnsTheLifecycleContract() throws Exception {
                  Fixture fixture = fixture("core-contract");
                  try {
                      assertEquals(User.class, fixture.user.getClass(),
                              "Server session still depends on a lifecycle subclass");

                      String storageName = "core" + Enums.FILE_SEPARATOR + "contract";
                      IMind root = fixture.user.getCurrentMind();
                      root = root.useStorage(storageName);
                      fixture.user.setCurrentMind(root);
                      root.query("!core_contract_fact;");

                      IMind checkpointed = fixture.user.checkpoint(root);
                      assertSame(root, checkpointed);
                      assertTrue(root.isStorageUsed());
                      assertEquals(0, root.getTransactionLevel());

                      StorageLifecycleException repeatedUse = assertThrows(
                              StorageLifecycleException.class,
                              () -> fixture.user.getCurrentMind().useStorage(storageName));
                      assertEquals("STORAGE_ALREADY_OPEN", repeatedUse.getCode());
                      assertEquals("EXPLICIT_CLOSE_REQUIRED",
                              repeatedUse.getRequiredAction());

                      Mind child = new Mind(root);
                      fixture.user.setCurrentMind(child);
                      assertTrue(Boolean.TRUE.equals(
                              child.query("!core_contract_transient;")));
                      IMind offlineChild = child.closeStorage();
                      fixture.user.setCurrentMind(offlineChild);
                      assertEquals(1, offlineChild.getTransactionLevel());
                      assertFalse(offlineChild.isStorageUsed());
                      assertTrue(Boolean.TRUE.equals(
                              offlineChild.query("?core_contract_transient;")));

                      JSONObject rollback = transaction(fixture, "rollback");
                      assertEquals("OK", rollback.optString("result"), rollback.toString());
                      assertEquals(0, rollback.optInt("transaction", -1));
                      assertFalse(Boolean.TRUE.equals(fixture.user.getCurrentMind()
                              .query("?core_contract_transient;")));

                      IMind reopened = fixture.user.getCurrentMind().useStorage(storageName);
                      fixture.user.setCurrentMind(reopened);
                      assertTrue(Boolean.TRUE.equals(reopened.query("?core_contract_fact;")));
                      assertFalse(Boolean.TRUE.equals(
                              reopened.query("?core_contract_transient;")));
                      fixture.user.setCurrentMind(reopened.closeStorage());
                  } finally {
                      fixture.close();
                  }
              }''')

          replace_test(explicit,
              'closeRejectsActiveLevelsAndPreservesTransientRules',
              '''    @Test
              void closePreservesActiveLevelsAndKeepsThemOutOfPersistentRoot()
                      throws Exception {
                  Fixture fixture = fixture("close-rebase");
                  try {
                      use(fixture, "close.rebase");
                      mutate(fixture, "close_persistent_root");

                      assertEquals(1, transaction(fixture, "create")
                              .optInt("transaction", -1));
                      mutate(fixture, "transient_level_one");
                      assertEquals(2, transaction(fixture, "create")
                              .optInt("transaction", -1));
                      mutate(fixture, "transient_level_two");

                      JSONObject closed = closeResponse(fixture);
                      assertEquals("OK", closed.optString("result"), closed.toString());
                      assertEquals(2, closed.optInt("transaction", -1));
                      assertFalse(fixture.user.getCurrentMind().isStorageUsed());
                      assertEquals(2, fixture.user.getCurrentMind().getTransactionLevel());
                      assertEquals("yes", ask(fixture, "transient_level_one")
                              .optString("response"));
                      assertEquals("yes", ask(fixture, "transient_level_two")
                              .optString("response"));

                      JSONObject rollbackTwo = transaction(fixture, "rollback");
                      assertEquals("OK", rollbackTwo.optString("result"),
                              rollbackTwo.toString());
                      assertEquals(1, rollbackTwo.optInt("transaction", -1));
                      assertEquals("yes", ask(fixture, "transient_level_one")
                              .optString("response"));
                      assertNotEquals("yes", ask(fixture, "transient_level_two")
                              .optString("response"));

                      JSONObject rollbackOne = transaction(fixture, "rollback");
                      assertEquals("OK", rollbackOne.optString("result"),
                              rollbackOne.toString());
                      assertEquals(0, rollbackOne.optInt("transaction", -1));
                      assertNotEquals("yes", ask(fixture, "transient_level_one")
                              .optString("response"));

                      use(fixture, "close.rebase");
                      assertEquals("yes", ask(fixture, "close_persistent_root")
                              .optString("response"));
                      assertNotEquals("yes", ask(fixture, "transient_level_one")
                              .optString("response"));
                      assertNotEquals("yes", ask(fixture, "transient_level_two")
                              .optString("response"));
                  } finally {
                      fixture.close();
                  }
              }''')
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "kanger-server/test/org/kanger/CanonicalStorageCloseConvergenceTest.java kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java "

      - name: Run focused close contract qualification
        run: >-
          mvn -B -ntp -f kanger-server/pom.xml
          -Dtest=StorageCloseRebaseTransactionStackTest,CanonicalStorageCloseConvergenceTest,ExplicitStorageLifecycleTest,DestructiveStopLossReactorTest,StorageRemovalTruthfulnessTest
          test

      - name: Publish aligned ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KANGER qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add kanger-server/test/org/kanger/CanonicalStorageCloseConvergenceTest.java \
                  kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java
          git commit -m "test(storage): align close rebase contracts"
          git push origin HEAD:refs/heads/tmp/3.7.0.20-storage-close-rebase-ready
