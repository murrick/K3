name: TEMP 3.7.0.17 server gate patcher

on:
  push:
    branches:
      - "tmp/3.7.0.17-server-gate-patcher"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch target branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp-3.7.0.17-patcher.py /tmp/patcher.py
          git fetch origin fix/3.7.0.17-server-package-gate-convergence
          git checkout -B fix/3.7.0.17-server-package-gate-convergence origin/fix/3.7.0.17-server-package-gate-convergence
          python3 /tmp/patcher.py
          git diff --check
          git status --short
          git config user.name "KANGER CI Patcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(core): close standalone server lifecycle findings"
          git push origin HEAD:fix/3.7.0.17-server-package-gate-convergence
