name: KANGER Server public confirmation bootstrap

on:
  pull_request:
    branches:
      - "server/0.12.1-update-automation"
    paths:
      - ".github/workflows/kanger-confirmation-flow-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-confirmation-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply public confirmation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          query = "kanger-server/src/org/kanger/QueryProcessor.java"
          replace_once(
              query,
              '        return result;\n'
              '    }\n\n'
              '    @Override\n'
              '    public Object run(JSONObject o) throws Exception {\n',
              '        return result;\n'
              '    }\n\n'
              '    static final String EMAIL_CONFIRMED_PROPERTY = "reg.email.confirmed";\n\n'
              '    static boolean isLegacyRootConfirmation(String context, JSONObject parameters) {\n'
              '        return context != null\n'
              '                && context.isEmpty()\n'
              '                && parameters != null\n'
              '                && parameters.has("confirm")\n'
              '                && !parameters.isNull("confirm")\n'
              '                && !parameters.optString("confirm", "").trim().isEmpty();\n'
              '    }\n\n'
              '    private static boolean isEmailConfirmed(IUser user) throws Exception {\n'
              '        String legacy = user.getProperty("reg.agreed", false + "");\n'
              '        return Boolean.parseBoolean(user.getProperty(\n'
              '                EMAIL_CONFIRMED_PROPERTY, legacy));\n'
              '    }\n\n'
              '    @Override\n'
              '    public Object run(JSONObject o) throws Exception {\n')
          replace_once(
              query,
              '                if ("login".equalsIgnoreCase(context)) {\n',
              '                if ("login".equalsIgnoreCase(context)\n'
              '                        || isLegacyRootConfirmation(context, parameters)) {\n')
          replace_count(
              query,
              'if (user.containsProperty("reg.agreed") && Boolean.parseBoolean(user.getProperty("reg.agreed", false + ""))) {',
              'if (isEmailConfirmed(user)) {',
              2)
          replace_once(
              query,
              '                        user.setProperty("reg.agreed", false + "");\n',
              '                        user.setProperty("reg.agreed", false + "");\n'
              '                        user.setProperty(EMAIL_CONFIRMED_PROPERTY, false + "");\n')
          replace_once(
              query,
              '''                String userToken = parameters.getString("confirm");
                IUser user = UserFactory.getUserByToken(userToken);
                String token = UserFactory.addUser(user);
                if (Boolean.parseBoolean(user.getProperty("reg.agreed", false + ""))) {
                    result.put("result", "OK");
                    result.put("description", "E-mail " + user.getProperty("reg.email", "") + " already confirmed");
                    result.put("token", token);
                    Watchdog.log(user, "E-mail " + user.getProperty("reg.email", "") + " already confirmed");
                } else {
                    user.setProperty("reg.agreed", true + "");
                    result.put("result", "OK");
                    result.put("description", "E-mail " + user.getProperty("reg.email", "") + " confirmed");
                    result.put("token", token);
                    Watchdog.log(user, "E-mail " + user.getProperty("reg.email", "") + " confirmed");
                }
''',
              '''                String userToken = parameters.getString("confirm");
                IUser user = UserFactory.getUserByToken(userToken);
                String email = user.getProperty("reg.email", "");
                boolean alreadyConfirmed = isEmailConfirmed(user);
                if (!alreadyConfirmed) {
                    user.setProperty("reg.agreed", true + "");
                    user.setProperty(EMAIL_CONFIRMED_PROPERTY, true + "");
                }
                result.put("result", "OK");
                result.put("description", "E-mail " + email
                        + (alreadyConfirmed ? " already confirmed" : " confirmed"));
                result.put("email_confirmed", true);
                Watchdog.log(user, "E-mail " + email
                        + (alreadyConfirmed ? " already confirmed" : " confirmed"));
''')
          replace_once(query, '                        "/?confirm=" + userToken,\n',
                              '                        "/login?confirm=" + userToken,\n')

          http = "kanger-server/src/org/kanger/HttpServer.java"
          replace_once(
              http,
              '    static boolean isOverloadDispatch() {\n'
              '        return Boolean.TRUE.equals(OVERLOAD_DISPATCH.get());\n'
              '    }\n\n',
              '    static boolean isOverloadDispatch() {\n'
              '        return Boolean.TRUE.equals(OVERLOAD_DISPATCH.get());\n'
              '    }\n\n'
              '    static boolean shouldRedirectEmailConfirmation(String method,\n'
              '                                                     String context,\n'
              '                                                     JSONObject parameters,\n'
              '                                                     JSONObject response) {\n'
              '        boolean confirmationContext = context != null\n'
              '                && (context.isEmpty() || "login".equalsIgnoreCase(context));\n'
              '        return "GET".equals(method)\n'
              '                && confirmationContext\n'
              '                && parameters != null\n'
              '                && parameters.has("confirm")\n'
              '                && !parameters.isNull("confirm")\n'
              '                && !parameters.optString("confirm", "").trim().isEmpty()\n'
              '                && response != null\n'
              '                && "OK".equalsIgnoreCase(response.optString("result", ""));\n'
              '    }\n\n')
          replace_once(
              http,
              '    private static void sendJson(HttpExchange exchange,\n',
              '    private static void sendRedirect(HttpExchange exchange,\n'
              '                                     String location,\n'
              '                                     String allowedOrigin,\n'
              '                                     String requestId) throws IOException {\n'
              '        Headers headers = exchange.getResponseHeaders();\n'
              '        headers.set("Location", location);\n'
              '        headers.set("Cache-Control", "no-store");\n'
              '        headers.set("X-Content-Type-Options", "nosniff");\n'
              '        headers.set("Referrer-Policy", "no-referrer");\n'
              '        headers.set("X-Request-ID", requestId);\n'
              '        if (allowedOrigin != null) {\n'
              '            headers.set("Access-Control-Allow-Origin", allowedOrigin);\n'
              '            headers.set("Vary", "Origin");\n'
              '        }\n'
              '        exchange.sendResponseHeaders(303, -1L);\n'
              '    }\n\n'
              '    private static void sendJson(HttpExchange exchange,\n')
          replace_once(
              http,
              '''                JSONObject response = (JSONObject) applicationResponse;
                if (response == null) {
                    status = 404;
                    sendJson(exchange, status, error("Unknown API context"),
                            allowedOrigin, requestId);
                } else {
                    status = 200;
                    sendJson(exchange, status, response, allowedOrigin, requestId);
                }
''',
              '''                JSONObject response = (JSONObject) applicationResponse;
                JSONObject queryParameters = packet.getJSONObject("query")
                        .getJSONObject("parameters");
                if (response == null) {
                    status = 404;
                    sendJson(exchange, status, error("Unknown API context"),
                            allowedOrigin, requestId);
                } else if (shouldRedirectEmailConfirmation(
                        method, context, queryParameters, response)) {
                    status = 303;
                    sendRedirect(exchange,
                            getSetting("server.confirmation.redirect.url",
                                    "https://kanger.org/"),
                            allowedOrigin, requestId);
                } else {
                    status = 200;
                    sendJson(exchange, status, response, allowedOrigin, requestId);
                }
''')

          config = "kanger-server/deploy/kanger.conf.example"
          replace_once(
              config,
              '# Public API URL used in generated confirmation links.\n'
              '# server.url=https://api.kanger.org\n',
              '# Public API URL used in generated confirmation links.\n'
              '# server.url=https://api.kanger.org\n\n'
              '# Browser destination after a successful e-mail confirmation.\n'
              '# server.confirmation.redirect.url=https://kanger.org/\n')

          http_test = "kanger-server/test/org/kanger/HttpServerTest.java"
          replace_once(
              http_test,
              '    @Test\n'
              '    void saturatedQueueRunsOnlyRejectionResponseInline() throws Exception {\n',
              '    @Test\n'
              '    void successfulEmailConfirmationRedirectsOnlyForPublicGet() {\n'
              '        JSONObject parameters = new JSONObject().put("confirm", "opaque-token");\n'
              '        JSONObject success = new JSONObject().put("result", "OK");\n'
              '        JSONObject failure = new JSONObject().put("result", "error");\n\n'
              '        assertTrue(HttpServer.shouldRedirectEmailConfirmation(\n'
              '                "GET", "", parameters, success));\n'
              '        assertTrue(HttpServer.shouldRedirectEmailConfirmation(\n'
              '                "GET", "login", parameters, success));\n'
              '        assertFalse(HttpServer.shouldRedirectEmailConfirmation(\n'
              '                "POST", "login", parameters, success));\n'
              '        assertFalse(HttpServer.shouldRedirectEmailConfirmation(\n'
              '                "GET", "command", parameters, success));\n'
              '        assertFalse(HttpServer.shouldRedirectEmailConfirmation(\n'
              '                "GET", "login", parameters, failure));\n'
              '    }\n\n'
              '    @Test\n'
              '    void saturatedQueueRunsOnlyRejectionResponseInline() throws Exception {\n')

          Path("kanger-server/test/org/kanger/QueryProcessorTest.java").write_text('''/*
 * MIT License
 *
 * Copyright (c) 2021 Dmitry G. Quznetsov
 */

package org.kanger;

import org.json.JSONObject;
import org.junit.jupiter.api.Test;

import static org.junit.jupiter.api.Assertions.assertFalse;
import static org.junit.jupiter.api.Assertions.assertTrue;

class QueryProcessorTest {

    @Test
    void legacyRootConfirmationBypassesAuthenticatedRequestGuard() {
        JSONObject confirmation = new JSONObject().put("confirm", "opaque-token");

        assertTrue(QueryProcessor.isLegacyRootConfirmation("", confirmation));
        assertFalse(QueryProcessor.isLegacyRootConfirmation("login", confirmation));
        assertFalse(QueryProcessor.isLegacyRootConfirmation("command", confirmation));
        assertFalse(QueryProcessor.isLegacyRootConfirmation(
                "", new JSONObject().put("confirm", "")));
        assertFalse(QueryProcessor.isLegacyRootConfirmation("", new JSONObject()));
    }
}
''')

          Path("kanger-server/EMAIL-CONFIRMATION.md").write_text('''# KANGER Server e-mail confirmation

Registration confirmation is a public, one-time operation. It does not require
an authenticated session token and does not create a new authenticated session.

New messages use:

```text
https://api.kanger.org/login?confirm=<opaque-one-time-token>
```

The historical root form remains accepted for already delivered messages:

```text
https://api.kanger.org/?confirm=<opaque-one-time-token>
```

A successful confirmation consumes the token, persists both the explicit
`reg.email.confirmed=true` property and the legacy `reg.agreed=true` property,
and returns HTTP 303 to `server.confirmation.redirect.url` (default
`https://kanger.org/`). The redirect response is non-cacheable and uses
`Referrer-Policy: no-referrer`, so the confirmation token is not forwarded to
the UI.

An invalid, expired or already consumed token remains a JSON error response and
is not redirected. This preserves diagnostics instead of presenting a false
successful login page.
''')
          PY

      - name: Qualify confirmation routing and persistence contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n kanger-server/scripts/smoke-local.sh
          bash -n kanger-server/scripts/smoke-auth-local.sh
          mvn -B -ntp -f kanger-server/pom.xml clean verify

      - name: Commit qualified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KANGER Automation"
          git config user.email "actions@users.noreply.github.com"
          git add kanger-server
          git commit -m "fix public e-mail confirmation routing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
