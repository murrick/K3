name: One-shot integrate C-variable Rule scope

on:
  push:
    branches:
      - integrate/3.5.0.5-cvar-rule-scope
  pull_request:
    branches:
      - integrate/3.5.0.5-cvar-rule-scope
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-cvar-rule-scope
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate/3.5.0.5-cvar-rule-scope
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Apply recovered invariant
        run: |
          git fetch origin fix/3.5.0.5-cvar-rule-scope
          python3 tools/integrate_cvar_rule_scope.py
          git show FETCH_HEAD:kanger-console/src/org/kanger/KangerCVarRuleScopeSafetyRunner.java \
            > kanger-console/src/org/kanger/KangerCVarRuleScopeSafetyRunner.java
          git diff --check

      - name: Run regression corpus
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run C-variable Rule-scope invariant
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dexec.mainClass=org.kanger.KangerCVarRuleScopeSafetyRunner
          -Dexec.classpathScope=test
          exec:java

      - name: Publish clean integration commit
        run: |
          rm tools/integrate_cvar_rule_scope.py
          rm .github/workflows/one-shot-integrate-cvar-rule-scope.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/kanger-ci.yml \
            .github/workflows/one-shot-integrate-cvar-rule-scope.yml \
            tools/integrate_cvar_rule_scope.py \
            kanger-console/src/org/kanger/KangerCVarRuleScopeSafetyRunner.java \
            kanger/src/org/kanger/Linker.java \
            kanger/src/org/kanger/Mind.java \
            kanger/src/org/kanger/factory/DictionaryFactory.java \
            kanger/src/org/kanger/units/Term.java
          git commit -m "Scope C-variable children by Rule"
          git push origin HEAD:integrate/3.5.0.5-cvar-rule-scope
