name: KANGER 3.7.0.10 VPS development soak package dev1

on:
  push:
    branches:
      - "ops/3.7.0.10-vps-soak-dev1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build matched 3.7.0.10 strategic transaction soak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact operations branch
        uses: actions/checkout@v5
        with:
          ref: ops/3.7.0.10-vps-soak-dev1
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify exact provenance
        shell: bash
        run: |
          set -euo pipefail
          canonical="f06498833b093ae7ccb04ab79b997fd1eee946be"
          ops_base="33f9e9b58b72918d98f09153b191e763104ac7e3"
          branch="ops/3.7.0.10-vps-soak-dev1"
          head="$(git rev-parse "origin/${branch}")"
          workflow=".github/workflows/kanger-3.7.0.10-vps-soak-dev1.yml"
          test "$(git rev-parse HEAD)" = "${head}"
          git merge-base --is-ancestor "${canonical}" "${head}"
          git cat-file -e "${ops_base}^{commit}"
          test "$(git diff --name-only "${canonical}..${head}")" = "${workflow}"
          for path in \
            kanger-server/deploy/snapshot-current.sh \
            kanger-server/deploy/deploy-soak.sh \
            kanger-server/deploy/rollback-soak.sh; do
            git cat-file -e "${ops_base}:${path}"
          done
          echo "DEV1_PACKAGE_PASS canonical-product ${canonical}"
          echo "DEV1_PACKAGE_PASS ops-base ${ops_base}"
          echo "DEV1_PACKAGE_PASS ops-head ${head}"

      - name: Build and test exact strategic Server
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -f kanger-server/pom.xml \
            -Dkanger.build.branch.override=arch/3.7.0.10-command-transaction-model \
            clean verify
          test -f kanger-server/target/kanger-server.jar
          unzip -p kanger-server/target/kanger-server.jar org/kanger/build.properties \
            | grep -q '^server.version=server-0.18$'
          echo "DEV1_PACKAGE_PASS server-build"

      - name: Re-run Browser qualification surface
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF_FILES'
          bottom-layout.js
          codemirror.css
          codemirror.js
          config.js
          console.html
          containment.js
          dialogue.js
          editor-local-file.js
          error.js
          favicon.ico
          file-download.js
          gateway.js
          index.html
          javascript-mode-vendor.js
          javascript-mode.js
          javascript.js
          jquery-3.6.0.min.js
          layout-persistence.js
          operation.js
          presentation.css
          presentation.js
          workspace.js
          EOF_FILES
          )"
          actual="$(find html -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          for file in \
            bottom-layout.js config.js containment.js dialogue.js \
            editor-local-file.js error.js file-download.js gateway.js \
            javascript-mode-vendor.js javascript-mode.js javascript.js \
            layout-persistence.js operation.js presentation.js workspace.js; do
            node --check "html/${file}"
          done
          test "$(git hash-object html/javascript-mode-vendor.js)" = \
            "047395622eb2501dea6fbb9e6be2389e02bf2c77"
          grep -q 'sandbox="allow-scripts"' html/index.html
          ! grep -q 'allow-same-origin' html/index.html
          node kanger-server/scripts/qualify-gateway-session.js
          node kanger-server/scripts/qualify-gateway-bootstrap.js
          node kanger-server/scripts/qualify-trusted-rendering.js
          node kanger-server/scripts/qualify-operation-snapshot.js
          node kanger-server/scripts/qualify-workspace-state.js
          node kanger-server/scripts/qualify-error-containment.js "${GITHUB_WORKSPACE}"
          node kanger-server/scripts/qualify-browser-dialogue.js "${GITHUB_WORKSPACE}"
          node kanger-server/scripts/qualify-browser-presentation.js "${GITHUB_WORKSPACE}"
          echo "DEV1_PACKAGE_PASS browser-authorities"

      - name: Assemble and independently verify immutable dev1 bundle
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="f06498833b093ae7ccb04ab79b997fd1eee946be"
          PRIOR_PRODUCT="20fcd15856f19c72860b847dfb5fa5085060c724"
          OPS_BASE="33f9e9b58b72918d98f09153b191e763104ac7e3"
          PACKAGING_BRANCH="ops/3.7.0.10-vps-soak-dev1"
          PACKAGING_HEAD="$(git rev-parse "origin/${PACKAGING_BRANCH}")"
          PRIOR_JAR="9b16d0615cefc3e63efaf90ef1577fd19d61832446d8622c7ba72005da5b6ab9"
          PRIOR_UI="/home/murray/sites/kanger-3.7.0.8-vps-soak-20260812T103642Z"
          PRIOR_RECORD="/root/kanger-deployments/3.7.0.8-vps-soak-20260812T103642Z"
          GENERATION="dev1"
          short="${CANONICAL:0:12}"
          package="kanger-3.7.0.10-vps-soak-${short}-${GENERATION}"
          ROOT="${RUNNER_TEMP}/${package}"
          dist="${GITHUB_WORKSPACE}/dist"

          test "$(git rev-parse HEAD)" = "${PACKAGING_HEAD}"
          mkdir -p "${ROOT}/html" "${ROOT}/deploy" "${ROOT}/docs" "${dist}"
          cp kanger-server/target/kanger-server.jar "${ROOT}/kanger-server.jar"
          cp -a html/. "${ROOT}/html/"
          cp -a kanger-server/deploy/. "${ROOT}/deploy/"

          git show "${OPS_BASE}:kanger-server/deploy/snapshot-current.sh" > "${ROOT}/deploy/snapshot-current.sh"
          git show "${OPS_BASE}:kanger-server/deploy/deploy-soak.sh" > "${ROOT}/deploy/deploy-soak.sh"
          git show "${OPS_BASE}:kanger-server/deploy/rollback-soak.sh" > "${ROOT}/deploy/rollback-soak.sh"

          # Specialize the already-qualified deployment primitives for this exact
          # product head and for the exact currently active dev3 rollback anchor.
          for file in snapshot-current.sh deploy-soak.sh rollback-soak.sh; do
            path="${ROOT}/deploy/${file}"
            sed -i \
              -e 's/3\.7\.0\.8-vps-soak/3.7.0.10-vps-soak/g' \
              -e 's|ops/3.7.0.10-vps-soak|ops/3.7.0.10-vps-soak-dev1|g' \
              -e 's/ff3ac0a338cfa72ce0ac3660c6fd215bb7da3b2f/f06498833b093ae7ccb04ab79b997fd1eee946be/g' \
              -e 's/99ba358d177a1e947cfd8de1fef86da57609e86aa95e3a84d2d128e69ec49f93/9b16d0615cefc3e63efaf90ef1577fd19d61832446d8622c7ba72005da5b6ab9/g' \
              -e 's|/home/murray/sites/kanger-3.7.0.7-vps-soak-20260811T051011Z|/home/murray/sites/kanger-3.7.0.8-vps-soak-20260812T103642Z|g' \
              -e 's/3\.7\.0\.7/3.7.0.8-dev3/g' \
              -e 's/NAME="kanger-vps-before-3\.7\.0\.8-/NAME="kanger-vps-before-3.7.0.10-/g' \
              -e 's/purpose=pre-3\.7\.0\.8-development-soak/purpose=pre-3.7.0.10-development-soak/g' \
              -e 's/The full pre-3\.7\.0\.8 state\/config snapshot/The full pre-3.7.0.10 state\/config snapshot/g' \
              "${path}"
          done

          cat > "${ROOT}/SOURCE.txt" <<EOF_SOURCE
          schema=5
          artifact=3.7.0.10-vps-soak
          canonical_source_branch=arch/3.7.0.10-command-transaction-model
          canonical_source_head=${CANONICAL}
          ci_qualified_code_head=${CANONICAL}
          packaging_branch=${PACKAGING_BRANCH}
          packaging_generation=${GENERATION}
          packaging_head=${PACKAGING_HEAD}
          ops_base_head=${OPS_BASE}
          server_version=server-0.18
          core_version=3.3
          api_version=1
          browser_files=22
          public_ui_link=/var/www/html/kanger
          prior_development_soak=3.7.0.8-dev3
          prior_development_soak_product_head=${PRIOR_PRODUCT}
          prior_development_soak_ui_target=${PRIOR_UI}
          prior_development_soak_jar_sha256=${PRIOR_JAR}
          prior_development_soak_record=${PRIOR_RECORD}
          accepted_production_release=release/3.5.2
          accepted_production_release_head=9c8b7dd2c9ef347cea6af6a6faef9cfa48030306
          accepted_production_ui_target=/home/murray/sites/kanger-server-0.18-soak-r3-20260807T100726Z
          accepted_production_jar_sha256=9a8fb1a0f1505d74fb15343ed0519782abb33b53097d6c0e46fbad7bad962718
          ui_publication_mode=versioned-directory-atomic-symlink
          deployment_class=development-soak
          release_acceptance=NOT_PERFORMED
          production_release_cutover=NOT_PERFORMED
          EOF_SOURCE

          cat > "${ROOT}/docs/VPS-DEPLOY-3.7.0.10-DEV1.md" <<EOF_DOC
          # KANGER 3.7.0.10 — strategic GC / transaction VPS development soak

          Date: 2026-08-12

          Canonical product: arch/3.7.0.10-command-transaction-model @ ${CANONICAL}
          Packaging: ${PACKAGING_BRANCH} @ ${PACKAGING_HEAD}, generation dev1.
          Immediate prior development soak: 3.7.0.8 dev3 @ ${PRIOR_PRODUCT}.
          Prior JAR SHA256: ${PRIOR_JAR}
          Prior public UI: ${PRIOR_UI}
          Prior deployment record: ${PRIOR_RECORD}

          Live qualification focus:
          - operation-local technical transactions always settle at command boundary;
          - failed operations do not retain hidden child reservations;
          - get is atomic inside the current user transaction;
          - use A->B semantically rebases the complete U-stack without raw-ID transport;
          - failed rebase compensating-restores the original base and user stack;
          - exact 0/1 reservation ownership invariant is enforced;
          - semantic settlement is distinguished from subsequent finalization failure.

          This is DEVELOPMENT_SOAK only. Release acceptance, merge/tag/publication and
          production cutover are NOT performed by this package.
          EOF_DOC

          chmod 0755 \
            "${ROOT}/deploy/install.sh" \
            "${ROOT}/deploy/verify-installed.sh" \
            "${ROOT}/deploy/kanger-admin" \
            "${ROOT}/deploy/snapshot-current.sh" \
            "${ROOT}/deploy/deploy-soak.sh" \
            "${ROOT}/deploy/rollback-soak.sh"

          grep -q '^schema=5$' "${ROOT}/SOURCE.txt"
          grep -q '^artifact=3.7.0.10-vps-soak$' "${ROOT}/SOURCE.txt"
          grep -q "^canonical_source_head=${CANONICAL}$" "${ROOT}/SOURCE.txt"
          grep -q '^canonical_source_branch=arch/3.7.0.10-command-transaction-model$' "${ROOT}/SOURCE.txt"
          grep -q "^packaging_branch=${PACKAGING_BRANCH}$" "${ROOT}/SOURCE.txt"
          grep -q '^packaging_generation=dev1$' "${ROOT}/SOURCE.txt"
          grep -q '^prior_development_soak=3.7.0.8-dev3$' "${ROOT}/SOURCE.txt"
          grep -q "^prior_development_soak_jar_sha256=${PRIOR_JAR}$" "${ROOT}/SOURCE.txt"
          grep -q "^prior_development_soak_ui_target=${PRIOR_UI}$" "${ROOT}/SOURCE.txt"
          grep -q '^release_acceptance=NOT_PERFORMED$' "${ROOT}/SOURCE.txt"
          grep -q '^production_release_cutover=NOT_PERFORMED$' "${ROOT}/SOURCE.txt"

          grep -Fq 'artifact=3.7.0.10-vps-soak' "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq "EXPECTED_SOURCE_HEAD=\"${CANONICAL}\"" "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq "EXPECTED_PACKAGING_BRANCH=\"${PACKAGING_BRANCH}\"" "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq "KANGER_EXPECTED_CURRENT_JAR_SHA256:-${PRIOR_JAR}" "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq "KANGER_EXPECTED_CURRENT_UI_TARGET:-${PRIOR_UI}" "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq 'packaging_generation=dev1' "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq 'prior_development_soak=3.7.0.8-dev3' "${ROOT}/deploy/deploy-soak.sh"
          grep -Fq "KANGER_EXPECTED_CURRENT_JAR_SHA256:-${PRIOR_JAR}" "${ROOT}/deploy/snapshot-current.sh"
          grep -Fq "KANGER_EXPECTED_PUBLIC_UI_TARGET:-${PRIOR_UI}" "${ROOT}/deploy/snapshot-current.sh"
          grep -Fq 'prior_development_soak=3.7.0.8-dev3' "${ROOT}/deploy/snapshot-current.sh"
          grep -Fq 'NAME="kanger-vps-before-3.7.0.10-${STAMP}"' "${ROOT}/deploy/snapshot-current.sh"
          grep -Fq 'purpose=pre-3.7.0.10-development-soak rollback and disaster recovery' "${ROOT}/deploy/snapshot-current.sh"
          ! grep -Fq 'NAME="kanger-vps-before-3.7.0.8-' "${ROOT}/deploy/snapshot-current.sh"
          grep -Fq 'restored_state=prior-development-soak-3.7.0.8-dev3' "${ROOT}/deploy/rollback-soak.sh"
          grep -Fq 'The full pre-3.7.0.10 state/config snapshot remains available' "${ROOT}/deploy/rollback-soak.sh"

          expected="$(cat <<'EOF_FILES'
          bottom-layout.js
          codemirror.css
          codemirror.js
          config.js
          console.html
          containment.js
          dialogue.js
          editor-local-file.js
          error.js
          favicon.ico
          file-download.js
          gateway.js
          index.html
          javascript-mode-vendor.js
          javascript-mode.js
          javascript.js
          jquery-3.6.0.min.js
          layout-persistence.js
          operation.js
          presentation.css
          presentation.js
          workspace.js
          EOF_FILES
          )"
          actual="$(find "${ROOT}/html" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"

          (
            cd "${ROOT}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar -C "$(dirname "${ROOT}")" -czf "${dist}/${package}.tar.gz" "${package}"
          (
            cd "${dist}"
            sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
          )
          grep -q "  ${package}.tar.gz$" "${dist}/${package}.tar.gz.sha256"
          ! grep -q '/home/runner/' "${dist}/${package}.tar.gz.sha256"
          echo "DEV1_PACKAGE_PASS immutable-bundle"
          echo "package=${package}"
          echo "canonical=${CANONICAL}"
          echo "packaging_head=${PACKAGING_HEAD}"
          cat "${dist}/${package}.tar.gz.sha256"
          sha256sum "${ROOT}/kanger-server.jar"

      - name: Upload development soak dev1 package
        uses: actions/upload-artifact@v7
        with:
          name: kanger-3.7.0.10-vps-soak-dev1
          path: dist/*
          if-no-files-found: error
          retention-days: 90
