name: KANGER source probe

on:
  pull_request:
    paths:
      - '.github/workflows/kanger-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-waiters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Domain waiter references
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -E 'getWaiters|waiters' \
            kanger/src \
            kanger-udf/src \
            kanger-data-dumb/src \
            kanger-console/src \
            || true
