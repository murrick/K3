name: TEMP KANGER transaction closure batch

on:
  push:
    branches:
      - arch/3.7.0.10-command-transaction-model

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: close use rebase and reservation boundaries'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply guarded closure edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              second = text.find(end, first + len(start))
              if second < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              if text.find(start, first + 1) >= 0:
                  raise SystemExit(f'{path}: start marker is not unique')
              p.write_text(text[:first] + replacement + text[second:])

          replace_once(
              'kanger-server/src/org/kanger/ExplicitStorageLifecycleReactor.java',
              '''            if (use) {
                if (!active.isStorageUsed()) {
                    return delegate.run(packet);
                }
                throw new StorageLifecycleException(
                        StorageLifecycleErrorCode.STORAGE_ALREADY_OPEN,
                        "Database " + active.getStorageName()
                                + " is already open; explicit close is required before use");
            }
''',
              '''            if (use) {
                /*
                 * Core User.use owns same-generation rejection and semantic
                 * A->B rebase. Pre-rejecting an already-open generation here
                 * would bypass U-stack snapshot/replay and its compensating
                 * restore path, so the protocol adapter only delegates.
                 */
                return delegate.run(packet);
            }
''')

          replace_once(
              'kanger-server/src/org/kanger/ExplicitStorageLifecycleReactor.java',
              ''' * processor touches a target generation: repeated {@code use}, root
 * {@code commit} as durable checkpoint, and explicit {@code close}. It
''',
              ''' * processor touches lifecycle state: root {@code commit} as durable
 * checkpoint and explicit {@code close}. Storage {@code use} is delegated to
 * Core because Core owns semantic U-stack rebase and compensating restore. It
''')

          replace_between(
              'kanger-server/src/org/kanger/DestructiveStopLossReactor.java',
              '    private JSONObject useStorage(JSONObject parameters, IUser user) throws Exception {\n',
              '    private void probeStorage(IUser sourceUser, String storageName) throws Exception {\n',
              '''    private JSONObject useStorage(JSONObject parameters, IUser user) throws Exception {
        String displayName = parameters.optString("use", "");
        String storageName = canonicalStorageName(displayName);
        IMind mind = user.getCurrentMind();
        String previousStorage = mind.isStorageUsed() ? mind.getStorageName() : null;

        if (previousStorage != null && previousStorage.equals(storageName)) {
            return storageInfo(mind);
        }

        /*
         * An open-generation A->B switch belongs entirely to Core. This
         * stop-loss boundary may probe B before mutation, but it must not
         * replay getSourceCode() or perform an independent restore afterward:
         * User.use transports every explicit U-level as semantic delta and
         * compensates back to A if target replay fails after mutation starts.
         */
        if (previousStorage != null) {
            try {
                probeStorage(user, storageName);
                IMind rebased = mind.useStorage(storageName);
                user.setCurrentMind(rebased);
                if (!rebased.isStorageUsed()) {
                    throw new IOException("Error opening database " + displayName);
                }
                return storageInfo(rebased);
            } catch (Exception switchFailure) {
                return error("storage_switch_failed", switchFailure.toString());
            }
        }

        /*
         * Historical no-storage workspace attachment remains a separate
         * compatibility case: a transient level-0 source has to become an
         * overlay above the newly attached persistent base. Unlike A->B, there
         * is no pre-existing persistent U0 for Core to rebase.
         */
        JSONObject blocked = requireRootTransaction(user, "use");
        if (blocked != null) {
            return blocked;
        }

        String previousSource = mind.getSourceCode();
        probeStorage(user, storageName);
        try {
            mind = mind.useStorage(storageName);
            user.setCurrentMind(mind);
            if (!mind.isStorageUsed()) {
                throw new IOException("Error opening database " + displayName);
            }

            if (!previousSource.isEmpty()) {
                IMind overlay = null;
                try {
                    overlay = new Mind(mind);
                    if (overlay.compile(previousSource)) {
                        if (!overlay.isEmptyLevel()) {
                            mind = overlay;
                            overlay = null;
                        } else {
                            mind.release(overlay);
                            overlay = null;
                        }
                    } else {
                        mind.release(overlay);
                        overlay = null;
                        throw new IOException("Current workspace conflicts with database "
                                + displayName);
                    }
                } catch (Exception overlayFailure) {
                    if (overlay != null) {
                        try {
                            mind.release(overlay);
                        } catch (Exception releaseFailure) {
                            overlayFailure.addSuppressed(releaseFailure);
                        }
                    }
                    throw overlayFailure;
                }
            }
            user.setCurrentMind(mind);
            return storageInfo(mind);
        } catch (Exception switchFailure) {
            try {
                restoreStorage(user, null, previousSource);
            } catch (Exception restoreFailure) {
                switchFailure.addSuppressed(restoreFailure);
            }
            return error("storage_switch_failed", switchFailure.toString());
        }
    }

''')

          replace_between(
              'kanger/src/org/kanger/User.java',
              '    private void requireExplicitStackOwnership(Mind top) {\n',
              '    private Mind openClosedStorage(Mind mind, String name) throws Exception {\n',
              '''    private void requireExplicitStackOwnership(Mind top) {
        Mind current = top;
        int reservations = current.pendingTransactionCount();
        if (reservations != 0) {
            throw new IllegalStateException(
                    "Cannot rebase storage: published U" + top.getTransactionLevel()
                            + " owns " + reservations
                            + " hidden child reservation(s); expected exactly zero");
        }

        int level = top.getTransactionLevel();
        while (current.getNext() != null) {
            Mind parent = (Mind) current.getNext();
            reservations = parent.pendingTransactionCount();
            if (reservations != 1) {
                throw new IllegalStateException(
                        "Cannot rebase storage: U" + (level - 1)
                                + " owns " + reservations
                                + " child reservation(s); expected exactly one for U"
                                + level);
            }
            current = parent;
            --level;
        }
    }

''')

          replace_once(
              'kanger/src/org/kanger/Mind.java',
              '''    boolean hasPendingTransactions() {
        synchronized (locker) {
            return transactionCounter > 0;
        }
    }
''',
              '''    int pendingTransactionCount() {
        synchronized (locker) {
            return transactionCounter;
        }
    }

    boolean hasPendingTransactions() {
        return pendingTransactionCount() > 0;
    }
''')

          replace_between(
              'kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java',
              '    @Test\n    void useWhileOpenRejectsBeforeTargetOpenOrValidation() throws Exception {\n',
              '    @Test\n    void closeRejectsActiveLevelsAndPreservesTransientRules() throws Exception {\n',
              '''    @Test
    void crossStorageUseDelegatesToCoreAndPreservesNestedExplicitLevels()
            throws Exception {
        Fixture fixture = fixture("cross-storage-rebase");
        try {
            use(fixture, "server.rebase.a");
            mutate(fixture, "a_base");
            close(fixture);

            use(fixture, "server.rebase.b");
            mutate(fixture, "b_base");
            close(fixture);

            use(fixture, "server.rebase.a");
            assertEquals(1, transaction(fixture, "create")
                    .optInt("transaction", -1));
            mutate(fixture, "u1_fact");
            assertEquals(2, transaction(fixture, "create")
                    .optInt("transaction", -1));
            mutate(fixture, "u2_fact");

            JSONObject switched = use(fixture, "server.rebase.b");
            assertEquals("OK", switched.optString("result"), switched.toString());
            assertEquals(2, switched.optInt("transaction", -1),
                    "server boundary collapsed the explicit U-stack");
            assertEquals("yes", ask(fixture, "b_base").optString("response"));
            assertEquals("yes", ask(fixture, "u1_fact").optString("response"));
            assertEquals("yes", ask(fixture, "u2_fact").optString("response"));
            assertNotEquals("yes", ask(fixture, "a_base").optString("response"));

            JSONObject rollbackTwo = transaction(fixture, "rollback");
            assertEquals("OK", rollbackTwo.optString("result"), rollbackTwo.toString());
            assertEquals(1, rollbackTwo.optInt("transaction", -1));
            assertEquals("yes", ask(fixture, "u1_fact").optString("response"));
            assertNotEquals("yes", ask(fixture, "u2_fact").optString("response"));

            JSONObject rollbackOne = transaction(fixture, "rollback");
            assertEquals("OK", rollbackOne.optString("result"), rollbackOne.toString());
            assertEquals(0, rollbackOne.optInt("transaction", -1));
            assertEquals("yes", ask(fixture, "b_base").optString("response"));
            assertNotEquals("yes", ask(fixture, "u1_fact").optString("response"));
        } finally {
            fixture.close();
        }
    }

''')
          PY

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          grep -q 'expected exactly one' kanger/src/org/kanger/User.java
          grep -q 'An open-generation A->B switch belongs entirely to Core' kanger-server/src/org/kanger/DestructiveStopLossReactor.java

      - name: Run focused transaction closure gates
        shell: bash
        run: |
          mvn -B -ntp -f kanger-server/pom.xml \
            -Dtest=CommandBoundaryTransactionModelTest,StorageRebaseSemanticDeltaTest,StorageRebaseFailureAtomicityTest,TransactionReservationInvariantTest,UserTransactionStackSnapshotTest,ExplicitStorageLifecycleTest \
            test

      - name: Commit closure batch
        shell: bash
        run: |
          git config user.name 'KANGER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            kanger/src/org/kanger/Mind.java \
            kanger/src/org/kanger/User.java \
            kanger-server/src/org/kanger/ExplicitStorageLifecycleReactor.java \
            kanger-server/src/org/kanger/DestructiveStopLossReactor.java \
            kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java
          if git diff --cached --quiet; then
            echo 'No closure changes to commit'
            exit 0
          fi
          git commit -m 'feat: close use rebase and reservation boundaries'
          git push origin HEAD:arch/3.7.0.10-command-transaction-model
