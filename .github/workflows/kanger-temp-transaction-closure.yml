name: TEMP KANGER transaction closure batch

on:
  push:
    branches:
      - arch/3.7.0.10-command-transaction-model

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: close use rebase and reservation boundaries'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply guarded closure edits
        run: python3 .github/scripts/kanger-temp-transaction-closure.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat
          grep -q 'expected exactly one' kanger/src/org/kanger/User.java
          grep -q 'An open-generation A->B switch belongs entirely to Core' kanger-server/src/org/kanger/DestructiveStopLossReactor.java

      - name: Run focused transaction closure gates
        run: |
          mvn -B -ntp -f kanger-server/pom.xml \
            -Dtest=CommandBoundaryTransactionModelTest,StorageRebaseSemanticDeltaTest,StorageRebaseFailureAtomicityTest,TransactionReservationInvariantTest,UserTransactionStackSnapshotTest,ExplicitStorageLifecycleTest \
            test

      - name: Commit closure batch
        run: |
          git config user.name 'KANGER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            kanger/src/org/kanger/Mind.java \
            kanger/src/org/kanger/User.java \
            kanger-server/src/org/kanger/ExplicitStorageLifecycleReactor.java \
            kanger-server/src/org/kanger/DestructiveStopLossReactor.java \
            kanger-server/test/org/kanger/ExplicitStorageLifecycleTest.java
          if git diff --cached --quiet; then
            echo 'No closure changes to commit'
            exit 0
          fi
          git commit -m 'feat: close use rebase and reservation boundaries'
          git push origin HEAD:arch/3.7.0.10-command-transaction-model
