name: KANGER III baseline

on:
  push:
    branches:
      - "debug/3.3.4-diagnostics"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-diagnostics:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/debug/3.3.4-diagnostics') || (github.event_name == 'pull_request' && github.head_ref == 'debug/3.3.4-diagnostics')
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: debug/3.3.4-diagnostics

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Apply and verify diagnostics
        shell: bash
        run: |
          if grep -q 'resetDiagnosticCounters' kanger-data-dumb/src/org/kanger/storage/Base.java; then
            echo 'Diagnostics already applied'
          else
            python3 scripts/apply_diagnostics.py
          fi
          mvn -B clean verify
          java \
            -Dkanger.diagnostics=true \
            -Dkanger.diagnostics.timeout.ms=5000 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDiagnosticRunner

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kanger-data-dumb/src/org/kanger/storage/Base.java \
            kanger-console/src/org/kanger/test/KangerTest.java \
            kanger-console/src/org/kanger/Console.java
          git commit -m "D1-D3: instrument storage and fix test context binding"
          git push origin HEAD:debug/3.3.4-diagnostics
