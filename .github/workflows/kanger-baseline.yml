name: KANGER III baseline

on:
  push:
    branches:
      - "stabilization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-regression:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-java-8
            os: ubuntu-latest
            java: "8"
          - id: ubuntu-java-21
            os: ubuntu-latest
            java: "21"
          - id: macos-java-21
            os: macos-latest
            java: "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run all KANGER test corpora
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee "kanger-test-${{ matrix.id }}.log"

      - name: Verify historical and stabilization corpora
        shell: bash
        run: |
          grep -Eq 'Success:[[:space:]]+101' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Stabilization Success:[[:space:]]+7' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Stabilization Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C1 Success:[[:space:]]+5' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C1 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C4 Success:[[:space:]]+3' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C4 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C3 Success:[[:space:]]+6' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C3 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"

      - name: Capture P0 performance baseline
        if: matrix.id == 'ubuntu-java-21'
        shell: bash
        run: |
          set -o pipefail
          java \
            -Dkanger.perf.sizes=100,500 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerPerformanceRunner \
            2>&1 | tee kanger-perf-ubuntu-java-21.log
          grep -E '^(mode,|memory,|storage,)' \
            kanger-perf-ubuntu-java-21.log \
            > kanger-perf-ubuntu-java-21.csv

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanger-baseline-${{ matrix.id }}
          path: |
            kanger-test-${{ matrix.id }}.log
            kanger-perf-${{ matrix.id }}.log
            kanger-perf-${{ matrix.id }}.csv
            target/*.jar
          if-no-files-found: warn
