name: KANGER III diagnostics

on:
  push:
    branches:
      - "debug/3.3.4-diagnostics"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build and run all KANGER test corpora
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee kanger-diagnostics-tests.log

      - name: Verify historical and stabilization corpora
        shell: bash
        run: |
          grep -Eq 'Success:[[:space:]]+101' kanger-diagnostics-tests.log
          grep -Eq 'Fails:[[:space:]]+0' kanger-diagnostics-tests.log
          grep -Eq 'Stabilization Success:[[:space:]]+7' kanger-diagnostics-tests.log
          grep -Eq 'Stabilization Fails:[[:space:]]+0' kanger-diagnostics-tests.log
          grep -Eq 'C1 Success:[[:space:]]+5' kanger-diagnostics-tests.log
          grep -Eq 'C1 Fails:[[:space:]]+0' kanger-diagnostics-tests.log
          grep -Eq 'C4 Success:[[:space:]]+3' kanger-diagnostics-tests.log
          grep -Eq 'C4 Fails:[[:space:]]+0' kanger-diagnostics-tests.log
          grep -Eq 'C3 Success:[[:space:]]+6' kanger-diagnostics-tests.log
          grep -Eq 'C3 Fails:[[:space:]]+0' kanger-diagnostics-tests.log

      - name: Run D1-D3 database diagnostics
        shell: bash
        run: |
          set -o pipefail
          java \
            -Dkanger.diagnostics=true \
            -Dkanger.diagnostics.timeout.ms=5000 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDiagnosticRunner \
            2>&1 | tee kanger-diagnostics-db.log
          grep -F 'D2 set_03_01 with storage: PASS' kanger-diagnostics-db.log
          grep -F 'explicit closeStorage: true' kanger-diagnostics-db.log
          grep -F 'normal JVM shutdown hook: true' kanger-diagnostics-db.log
