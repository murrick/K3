name: KANGER III diagnostics cleanup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'debug/3.3.4-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: debug/3.3.4-diagnostics

      - name: Remove tracked Maven output
        shell: bash
        run: |
          git rm -r target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove accidental Maven build output"
          git push origin HEAD:debug/3.3.4-diagnostics
