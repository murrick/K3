name: KANGER III diagnostics finalize

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'debug/3.3.4-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: debug/3.3.4-diagnostics

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Remove temporary tracing and verify
        shell: bash
        run: |
          python3 scripts/finalize_diagnostics.py
          git rm \
            scripts/apply_cvar_context_fix.py \
            scripts/apply_cvar_ownership_diagnostics.py \
            scripts/apply_cvar_unlink_fix.py \
            scripts/apply_diagnostic_cache_invalidation.py \
            scripts/apply_diagnostics.py \
            scripts/apply_linker_diagnostic_progress.py \
            scripts/apply_tvalue_identity_diagnostics.py \
            scripts/run_apply_diagnostics.py \
            scripts/finalize_diagnostics.py
          mvn -B clean verify
          java \
            -Dkanger.diagnostics=true \
            -Dkanger.diagnostics.timeout.ms=5000 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDiagnosticRunner

      - name: Commit clean diagnostic checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "D1-D3: finalize storage diagnostic checkpoint"
          git push origin HEAD:debug/3.3.4-diagnostics
