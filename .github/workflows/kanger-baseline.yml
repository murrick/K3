name: KANGER III 3.3.5 integration

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kanger-3.3.5-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/3.3.6-linker-agenda'
    runs-on: ubuntu-latest
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.3.6-linker-agenda
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Merge diagnostic baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop/3.3.4

          if git merge-base --is-ancestor origin/develop/3.3.4 HEAD; then
            echo "develop/3.3.4 is already integrated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -X ours origin/develop/3.3.4 \
            -m "Integrate 3.3.4 diagnostic baseline into P4"

          grep -q 'mind.linkCVar(parent, t)' \
            kanger/src/org/kanger/factory/DictionaryFactory.java
          grep -q 'public void linkCVar(ITerm parent, ITerm child)' \
            kanger/src/org/kanger/Mind.java
          grep -q 'D2 set_03_01 with storage: PASS' \
            kanger-console/src/org/kanger/KangerDiagnosticRunner.java
          grep -q '^target/$' .gitignore || printf '\ntarget/\n' >> .gitignore

          mvn -B clean verify
          java \
            -Dkanger.diagnostics=true \
            -Dkanger.diagnostics.timeout.ms=5000 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDiagnosticRunner

          if ! git diff --quiet; then
            git add .gitignore
            git commit --amend --no-edit
          fi

          git push origin HEAD:perf/3.3.6-linker-agenda
