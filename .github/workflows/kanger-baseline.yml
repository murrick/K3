name: KANGER III baseline

on:
  push:
    branches:
      - "perf/3.3.6-linker-agenda"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-p4-resolved-candidates:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/3.3.6-linker-agenda'
    runs-on: ubuntu-latest
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.3.6-linker-agenda

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Apply and test resolved candidate lookup
        run: |
          if grep -q 'findByResolvedDomain' kanger/src/org/kanger/Linker.java; then
            echo 'P4 resolved candidates already applied'
            exit 0
          fi
          python3 scripts/apply_p4_resolved_candidates.py || true
          python3 scripts/apply_p4_resolved_linker.py
          mvn -B clean verify

      - name: Commit product changes when needed
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/factory/RuleCandidateIndex.java \
                  kanger/src/org/kanger/factory/RuleFactory.java \
                  kanger/src/org/kanger/Linker.java
          git commit -m "P4: resolve candidate facts from current substitutions"
          git push origin HEAD:perf/3.3.6-linker-agenda
