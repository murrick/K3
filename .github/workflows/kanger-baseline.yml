name: KANGER III P4 origin metrics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-origin-metrics:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/3.3.6-linker-agenda'
    runs-on: ubuntu-latest
    steps:
      - name: Check out P4 branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.3.6-linker-agenda

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply and verify origin metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_p4_origin_metrics.py
          mvn -B clean verify
          java \
            -Dkanger.linker.profile.sizes=500 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerLinkerProfileRunner \
            2>&1 | tee kanger-p4-origin-profile.log
          grep -F '500,query-all-variables' kanger-p4-origin-profile.log

      - name: Commit product instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kanger/src/org/kanger/Linker.java \
            kanger/src/org/kanger/LinkerStatistics.java \
            kanger/src/org/kanger/KangerLinkerProfileRunner.java
          git rm scripts/apply_p4_origin_metrics.py
          git commit -m "P4c: classify unifications by pass and candidate origin"
          git push origin HEAD:perf/3.3.6-linker-agenda
