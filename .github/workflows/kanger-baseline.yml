name: KANGER III diagnostics normalize

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'debug/3.3.4-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: debug/3.3.4-diagnostics

      - name: Restore baseline formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          linker_path = Path('kanger/src/org/kanger/Linker.java')
          linker = linker_path.read_text(encoding='utf-8')
          linker = linker.replace(
              '            rotator(leftList, causes, logging);\n            rotator(ruleList, causes, logging);\n\n\n        } while',
              '            rotator(leftList, causes, logging);\n            rotator(ruleList, causes, logging);\n\n        } while',
              1)
          linker_path.write_text(linker, encoding='utf-8')

          mind_path = Path('kanger/src/org/kanger/Mind.java')
          mind = mind_path.read_text(encoding='utf-8')
          baseline = '''    public void unlinkCVar(ITerm term) {
              if (term == null) {
                  return;
              }

              Set<ITerm> linked = new HashSet<>();
              linked.add(term);

              ITerm child = cvarChilds.get(term);
              if (child != null) {
                  linked.add(child);
              }
              ITerm parent = cvarParents.get(term);
              if (parent != null) {
                  linked.add(parent);
              }
              for (Map.Entry<ITerm, ITerm> entry : cvarChilds.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }
              for (Map.Entry<ITerm, ITerm> entry : cvarParents.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }

              cvarChilds.entrySet().removeIf(entry -> linked.contains(entry.getKey()) || linked.contains(entry.getValue()));
              cvarParents.entrySet().removeIf(entry -> linked.contains(entry.getKey()) || linked.contains(entry.getValue()));
          }

'''
          pattern = r'    public void unlinkCVar\(ITerm term\) \{.*?\n    \}\n\n(?=    private void clearCVarLinks\(\))'
          mind, count = re.subn(pattern, baseline, mind, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Mind unlinkCVar structural anchor not found')
          mind_path.write_text(mind, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Linker.java kanger/src/org/kanger/Mind.java
          git commit -m "Normalize diagnostic diff"
          git push origin HEAD:debug/3.3.4-diagnostics
