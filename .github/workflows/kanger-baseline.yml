name: KANGER III baseline

on:
  push:
    branches:
      - "stabilization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-p1f:
    name: apply-p1f
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/3.3.3-indexed-linker'
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.3.3-indexed-linker

      - name: Apply and compile semantic-safe P1f patch
        run: |
          python3 scripts/apply_p1f_semantic_fix.py
          mvn -B -DskipTests compile

      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet -- \
            kanger/src/org/kanger/units/Rule.java \
            kanger/src/org/kanger/factory/RuleFactory.java; then
            echo "P1f patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kanger/src/org/kanger/units/Rule.java \
            kanger/src/org/kanger/factory/RuleFactory.java
          git commit -m "P1f: trust active rule-term index in pack"
          git push origin HEAD:perf/3.3.3-indexed-linker

  build-and-regression:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-java-8
            os: ubuntu-latest
            java: "8"
          - id: ubuntu-java-21
            os: ubuntu-latest
            java: "21"
          - id: macos-java-21
            os: macos-latest
            java: "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run all KANGER test corpora
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee "kanger-test-${{ matrix.id }}.log"

      - name: Verify historical and stabilization corpora
        shell: bash
        run: |
          grep -Eq 'Success:[[:space:]]+101' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Stabilization Success:[[:space:]]+7' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'Stabilization Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C1 Success:[[:space:]]+5' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C1 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C4 Success:[[:space:]]+3' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C4 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C3 Success:[[:space:]]+6' "kanger-test-${{ matrix.id }}.log"
          grep -Eq 'C3 Fails:[[:space:]]+0' "kanger-test-${{ matrix.id }}.log"

      - name: Capture P0 performance baseline
        if: matrix.id == 'ubuntu-java-21'
        shell: bash
        run: |
          set -o pipefail
          java \
            -Dkanger.perf.sizes=100,500 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerPerformanceRunner \
            2>&1 | tee kanger-perf-ubuntu-java-21.log
          grep -E '^(mode,|memory,|storage,)' \
            kanger-perf-ubuntu-java-21.log \
            > kanger-perf-ubuntu-java-21.csv

      - name: Capture P1 execution profile
        if: matrix.id == 'ubuntu-java-21'
        shell: bash
        run: |
          set -o pipefail
          java \
            -XX:StartFlightRecording=filename=kanger-perf-ubuntu-java-21.jfr,settings=profile,dumponexit=true \
            -Dkanger.perf.sizes=500 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerPerformanceRunner \
            > kanger-perf-profile-run.log 2>&1

          jfr print \
            --events jdk.ExecutionSample \
            --stack-depth 32 \
            kanger-perf-ubuntu-java-21.jfr \
            > kanger-perf-execution-samples.txt

          python3 scripts/summarize_jfr.py
          cat kanger-perf-hotspots.txt

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanger-baseline-${{ matrix.id }}
          path: |
            kanger-test-${{ matrix.id }}.log
            kanger-perf-${{ matrix.id }}.log
            kanger-perf-${{ matrix.id }}.csv
            kanger-perf-profile-run.log
            kanger-perf-execution-samples.txt
            kanger-perf-hotspots.txt
            kanger-perf-${{ matrix.id }}.jfr
            target/*.jar
          if-no-files-found: warn
