name: KANGER III diagnostics normalize

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'debug/3.3.4-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: debug/3.3.4-diagnostics

      - name: Restore baseline formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          linker_path = Path('kanger/src/org/kanger/Linker.java')
          linker = linker_path.read_text(encoding='utf-8')
          old = '            rotator(leftList, causes, logging);\n            rotator(ruleList, causes, logging);\n\n\n        } while'
          new = '            rotator(leftList, causes, logging);\n            rotator(ruleList, causes, logging);\n\n        } while'
          if old not in linker:
              raise RuntimeError('Linker whitespace anchor not found')
          linker_path.write_text(linker.replace(old, new, 1), encoding='utf-8')

          mind_path = Path('kanger/src/org/kanger/Mind.java')
          mind = mind_path.read_text(encoding='utf-8')
          current = '''    public void unlinkCVar(ITerm term) {
              if (term == null) {
                  return;
              }
              Set<ITerm> linked = new HashSet<>();
              linked.add(term);
              ITerm child = cvarChilds.get(term);
              if (child != null) linked.add(child);
              ITerm parent = cvarParents.get(term);
              if (parent != null) linked.add(parent);
              for (Map.Entry<ITerm, ITerm> entry : cvarChilds.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }
              for (Map.Entry<ITerm, ITerm> entry : cvarParents.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }
              cvarChilds.entrySet().removeIf(e -> linked.contains(e.getKey()) || linked.contains(e.getValue()));
              cvarParents.entrySet().removeIf(e -> linked.contains(e.getKey()) || linked.contains(e.getValue()));
          }
          '''
          baseline = '''    public void unlinkCVar(ITerm term) {
              if (term == null) {
                  return;
              }

              Set<ITerm> linked = new HashSet<>();
              linked.add(term);

              ITerm child = cvarChilds.get(term);
              if (child != null) {
                  linked.add(child);
              }
              ITerm parent = cvarParents.get(term);
              if (parent != null) {
                  linked.add(parent);
              }
              for (Map.Entry<ITerm, ITerm> entry : cvarChilds.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }
              for (Map.Entry<ITerm, ITerm> entry : cvarParents.entrySet()) {
                  if (entry.getKey().equals(term) || entry.getValue().equals(term)) {
                      linked.add(entry.getKey());
                      linked.add(entry.getValue());
                  }
              }

              cvarChilds.entrySet().removeIf(entry -> linked.contains(entry.getKey()) || linked.contains(entry.getValue()));
              cvarParents.entrySet().removeIf(entry -> linked.contains(entry.getKey()) || linked.contains(entry.getValue()));
          }
          '''
          if current not in mind:
              raise RuntimeError('Mind unlinkCVar formatting anchor not found')
          mind_path.write_text(mind.replace(current, baseline, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Linker.java kanger/src/org/kanger/Mind.java
          git commit -m "Normalize diagnostic diff"
          git push origin HEAD:debug/3.3.4-diagnostics
