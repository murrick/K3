name: KANGER III 3.4.4 DUMB reliability qualification

on:
  push:
    branches:
      - "arch/3.4.4-dumb-reliability-qualification"
      - "develop/3.4.4*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: kanger-3.4.4-dumb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify-dumb:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-java-8
            os: ubuntu-latest
            java: "8"
          - id: ubuntu-java-21
            os: ubuntu-latest
            java: "21"
          - id: macos-java-21
            os: macos-latest
            java: "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run existing regression gates
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee "kanger-3.4.4-${{ matrix.id }}.log"

      - name: Run observational DUMB qualification
        shell: bash
        run: |
          set -o pipefail
          output="target/dumb-qualification-${{ matrix.id }}"
          java \
            -Dkanger.dumb.qualification.output="$output" \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbQualificationRunner \
            2>&1 | tee "dumb-qualification-${{ matrix.id }}.log"

          test -s "$output/dumb-qualification.csv"
          test -s "$output/dumb-qualification.md"
          grep -F 'PASS: 2' "dumb-qualification-${{ matrix.id }}.log"
          grep -F 'GAP_SILENT_HYBRID: 3' "dumb-qualification-${{ matrix.id }}.log"
          if grep -F 'GAP_HANG:' "dumb-qualification-${{ matrix.id }}.log"; then
            echo 'Unexpected qualification hang'
            exit 1
          fi

      - name: Upload qualification protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumb-qualification-${{ matrix.id }}
          path: |
            kanger-3.4.4-${{ matrix.id }}.log
            dumb-qualification-${{ matrix.id }}.log
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.csv
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.md
          if-no-files-found: warn
