name: KANGER III 3.4.4 DUMB reliability qualification

on:
  push:
    branches:
      - "arch/3.4.4*"
      - "develop/3.4.4*"
      - "fix/3.4.4*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: kanger-3.4.4-dumb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-unit-state:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/3.4.4.2.2-rule-context-rendering' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: fix/3.4.4.2.2-rule-context-rendering
          fetch-depth: 0

      - name: Serialize Mind unit-state reads and writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kanger/src/org/kanger/Mind.java')
          text = path.read_text(encoding='utf-8')
          start_marker = '    public boolean isUnitDeleted(IUnit unit) {'
          end_marker = '    @Override\n    public IMind getTop() {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    public boolean isUnitDeleted(IUnit unit) {
              UnitType unitType = unit.getUnitType();
              long unitId = unit.getId();
              for (IMind level = this; level != null; level = level.getNext()) {
                  Mind current = (Mind) level;
                  synchronized (current.locker) {
                      Set<Long> restoredIds = current.restored.get(unitType);
                      if (restoredIds != null && restoredIds.contains(unitId)) {
                          return false;
                      }
                      Set<Long> deletedIds = current.deleted.get(unitType);
                      if (deletedIds != null && deletedIds.contains(unitId)) {
                          return true;
                      }
                  }
              }
              return false;
          }

          public void setUnitDeleted(IUnit unit, boolean on) {
              synchronized (locker) {
                  UnitType unitType = unit.getUnitType();
                  long unitId = unit.getId();
                  if (on) {
                      if (!isUnitDeleted(unit)) {
                          Set<Long> restoredIds = restored.get(unitType);
                          if (restoredIds != null) {
                              restoredIds.remove(unitId);
                          }
                          if (!isUnitDeleted(unit)) {
                              Set<Long> deletedIds = deleted.get(unitType);
                              if (deletedIds == null) {
                                  deletedIds = new HashSet<>();
                                  deleted.put(unitType, deletedIds);
                              }
                              deletedIds.add(unitId);
                          }
                      }
                  } else if (isUnitDeleted(unit)) {
                      Set<Long> deletedIds = deleted.get(unitType);
                      if (deletedIds != null) {
                          deletedIds.remove(unitId);
                      }
                      if (unit.getMindId() != id || isUnitDeleted(unit)) {
                          Set<Long> restoredIds = restored.get(unitType);
                          if (restoredIds == null) {
                              restoredIds = new HashSet<>();
                              restored.put(unitType, restoredIds);
                          }
                          restoredIds.add(unitId);
                      }
                  }
              }
          }

          '''
          current = text[start:end]
          if 'synchronized (current.locker)' in current:
              print('Mind unit-state synchronization is already applied')
          else:
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          if git diff --quiet -- kanger/src/org/kanger/Mind.java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Mind.java
          git commit -m "[unit-state-lock] Serialize Mind deletion-state snapshots"
          git push origin HEAD:fix/3.4.4.2.2-rule-context-rendering

  qualify-dumb:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-java-8
            os: ubuntu-latest
            java: "8"
          - id: ubuntu-java-21
            os: ubuntu-latest
            java: "21"
          - id: macos-java-21
            os: macos-latest
            java: "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run existing regression gates
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee "kanger-3.4.4-${{ matrix.id }}.log"

      - name: Stress RuleCandidateIndex concurrency with DUMB
        shell: bash
        run: |
          set -o pipefail
          java \
            -Dkanger.rule.candidate.concurrency.iterations=12 \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerRuleCandidateConcurrencyRunner \
            2>&1 | tee "rule-candidate-concurrency-${{ matrix.id }}.log"
          grep -F 'RULE_CANDIDATE_CONCURRENCY_OK iterations=12' \
            "rule-candidate-concurrency-${{ matrix.id }}.log"

      - name: Verify contextual solution row rendering
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerRuleRenderingRunner \
            2>&1 | tee "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_PASS memory' "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_PASS persistent' "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_OK' "rule-rendering-${{ matrix.id }}.log"

      - name: Run DUMB integrity lifecycle regressions
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbIntegrityTestRunner \
            2>&1 | tee "dumb-integrity-${{ matrix.id }}.log"
          grep -F 'INTEGRITY_REGRESSION_OK' "dumb-integrity-${{ matrix.id }}.log"

      - name: Run DUMB Q2 recovery gate
        shell: bash
        run: |
          set -o pipefail
          output="target/dumb-q2-recovery-${{ matrix.id }}"
          java \
            -Dkanger.dumb.q2.output="$output" \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbQ2RecoveryRunner \
            2>&1 | tee "dumb-q2-recovery-${{ matrix.id }}.log"
          test -s "$output/q2-recovery.md"
          grep -F 'Q2_TOTAL: 27' "dumb-q2-recovery-${{ matrix.id }}.log"
          grep -F 'Q2_PASS: 27' "dumb-q2-recovery-${{ matrix.id }}.log"
          grep -F 'Q2_FAIL: 0' "dumb-q2-recovery-${{ matrix.id }}.log"

      - name: Run strict DUMB Q1-Q3 qualification
        shell: bash
        run: |
          set -o pipefail
          output="target/dumb-qualification-${{ matrix.id }}"
          java \
            -Dkanger.dumb.qualification.strict=true \
            -Dkanger.dumb.qualification.output="$output" \
            -cp "target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbQualificationRunner \
            2>&1 | tee "dumb-qualification-${{ matrix.id }}.log"

          test -s "$output/dumb-qualification.csv"
          test -s "$output/dumb-qualification.md"
          grep -F 'PASS: 5' "dumb-qualification-${{ matrix.id }}.log"
          grep -F 'DETECTED_EXCEPTION: 154' "dumb-qualification-${{ matrix.id }}.log"
          grep -F 'PASS_OR_IRRELEVANT: 45' "dumb-qualification-${{ matrix.id }}.log"
          if grep -F 'GAP_' "dumb-qualification-${{ matrix.id }}.log"; then
            echo 'Qualification gap remains'
            exit 1
          fi

      - name: Upload qualification protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumb-qualification-${{ matrix.id }}
          path: |
            kanger-3.4.4-${{ matrix.id }}.log
            rule-candidate-concurrency-${{ matrix.id }}.log
            rule-rendering-${{ matrix.id }}.log
            dumb-integrity-${{ matrix.id }}.log
            dumb-q2-recovery-${{ matrix.id }}.log
            dumb-qualification-${{ matrix.id }}.log
            target/dumb-q2-recovery-${{ matrix.id }}/q2-recovery.md
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.csv
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.md
          if-no-files-found: warn
