name: KANGER III 3.4.4 DUMB reliability qualification

on:
  push:
    branches:
      - "arch/3.4.4*"
      - "develop/3.4.4*"
      - "fix/3.4.4*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: kanger-3.4.4-dumb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify-dumb:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-java-8
            os: ubuntu-latest
            java: "8"
          - id: ubuntu-java-21
            os: ubuntu-latest
            java: "21"
          - id: macos-java-21
            os: macos-latest
            java: "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run existing regression gates
        shell: bash
        run: |
          set -o pipefail
          mvn -B -V clean verify 2>&1 | tee "kanger-3.4.4-${{ matrix.id }}.log"

      - name: Verify production JAR excludes qualification runners
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$jar_file"
          if jar tf "$jar_file" | grep -E '(^|/)[^/]*Runner\.class$'; then
            echo "Qualification runner leaked into production JAR: $jar_file"
            exit 1
          fi

      - name: Verify Mind lifecycle safety
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerMindSafetyRunner \
            2>&1 | tee "mind-safety-${{ matrix.id }}.log"
          grep -F 'MIND_SAFETY_PASS concurrent-children' "mind-safety-${{ matrix.id }}.log"
          grep -F 'MIND_SAFETY_PASS transient-clear' "mind-safety-${{ matrix.id }}.log"
          grep -F 'MIND_SAFETY_PASS delete-warning' "mind-safety-${{ matrix.id }}.log"
          grep -F 'MIND_SAFETY_PASS abstractive-policy' "mind-safety-${{ matrix.id }}.log"
          grep -F 'MIND_SAFETY_OK' "mind-safety-${{ matrix.id }}.log"

      - name: Verify factory safety
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerFactorySafetyRunner \
            2>&1 | tee "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS runtime-ownership' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS anchor-reset' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS orphan-cleanup' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS comment-overlay' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS library-overlay' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_PASS concurrent-metadata' "factory-safety-${{ matrix.id }}.log"
          grep -F 'FACTORY_SAFETY_OK' "factory-safety-${{ matrix.id }}.log"

      - name: Stress RuleCandidateIndex concurrency with DUMB
        shell: bash
        run: |
          set -o pipefail
          java \
            -Dkanger.rule.candidate.concurrency.iterations=12 \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerRuleCandidateConcurrencyRunner \
            2>&1 | tee "rule-candidate-concurrency-${{ matrix.id }}.log"
          grep -F 'RULE_CANDIDATE_CONCURRENCY_OK iterations=12' \
            "rule-candidate-concurrency-${{ matrix.id }}.log"

      - name: Verify contextual solution row rendering
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerRuleRenderingRunner \
            2>&1 | tee "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_PASS memory' "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_PASS persistent' "rule-rendering-${{ matrix.id }}.log"
          grep -F 'RULE_RENDERING_OK' "rule-rendering-${{ matrix.id }}.log"

      - name: Run DUMB integrity lifecycle regressions
        shell: bash
        run: |
          set -o pipefail
          java \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbIntegrityTestRunner \
            2>&1 | tee "dumb-integrity-${{ matrix.id }}.log"
          grep -F 'INTEGRITY_REGRESSION_OK' "dumb-integrity-${{ matrix.id }}.log"

      - name: Run DUMB Q2 recovery gate
        shell: bash
        run: |
          set -o pipefail
          output="target/dumb-q2-recovery-${{ matrix.id }}"
          java \
            -Dkanger.dumb.q2.output="$output" \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbQ2RecoveryRunner \
            2>&1 | tee "dumb-q2-recovery-${{ matrix.id }}.log"
          test -s "$output/q2-recovery.md"
          grep -F 'Q2_TOTAL: 27' "dumb-q2-recovery-${{ matrix.id }}.log"
          grep -F 'Q2_PASS: 27' "dumb-q2-recovery-${{ matrix.id }}.log"
          grep -F 'Q2_FAIL: 0' "dumb-q2-recovery-${{ matrix.id }}.log"

      - name: Run strict DUMB Q1-Q3 qualification
        shell: bash
        run: |
          set -o pipefail
          output="target/dumb-qualification-${{ matrix.id }}"
          java \
            -Dkanger.dumb.qualification.strict=true \
            -Dkanger.dumb.qualification.output="$output" \
            -cp "target/test-classes:target/classes:lib/*:kanger-server/lib/*" \
            org.kanger.KangerDumbQualificationRunner \
            2>&1 | tee "dumb-qualification-${{ matrix.id }}.log"

          test -s "$output/dumb-qualification.csv"
          test -s "$output/dumb-qualification.md"
          grep -F 'PASS: 5' "dumb-qualification-${{ matrix.id }}.log"
          grep -F 'DETECTED_EXCEPTION: 154' "dumb-qualification-${{ matrix.id }}.log"
          grep -F 'PASS_OR_IRRELEVANT: 45' "dumb-qualification-${{ matrix.id }}.log"
          if grep -F 'GAP_' "dumb-qualification-${{ matrix.id }}.log"; then
            echo 'Qualification gap remains'
            exit 1
          fi

      - name: Upload qualification protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumb-qualification-${{ matrix.id }}
          path: |
            kanger-3.4.4-${{ matrix.id }}.log
            mind-safety-${{ matrix.id }}.log
            factory-safety-${{ matrix.id }}.log
            rule-candidate-concurrency-${{ matrix.id }}.log
            rule-rendering-${{ matrix.id }}.log
            dumb-integrity-${{ matrix.id }}.log
            dumb-q2-recovery-${{ matrix.id }}.log
            dumb-qualification-${{ matrix.id }}.log
            target/dumb-q2-recovery-${{ matrix.id }}/q2-recovery.md
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.csv
            target/dumb-qualification-${{ matrix.id }}/dumb-qualification.md
          if-no-files-found: warn
