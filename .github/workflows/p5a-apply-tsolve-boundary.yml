name: P5a apply TSolve telemetry boundary

on:
  push:
    branches:
      - "arch/3.4.1-p5a-semantic-telemetry"
    paths:
      - ".github/workflows/p5a-apply-tsolve-boundary.yml"

permissions:
  contents: write

jobs:
  apply-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out architecture branch
        uses: actions/checkout@v4
        with:
          ref: arch/3.4.1-p5a-semantic-telemetry

      - name: Move TSolve telemetry to canonical insertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tsolve_path = Path("kanger/src/org/kanger/units/TSolve.java")
          tsolve = tsolve_path.read_text(encoding="utf-8")
          import_line = "import org.kanger.SemanticEffectTelemetry;\n"
          if tsolve.count(import_line) != 1:
              raise SystemExit("Unexpected TSolve telemetry import shape")
          tsolve = tsolve.replace(import_line, "", 1)
          hook = "        SemanticEffectTelemetry.recordTSolve(solve);\n"
          if tsolve.count(hook) != 3:
              raise SystemExit("Unexpected TSolve constructor hook count")
          tsolve = tsolve.replace(hook, "", 3)
          tsolve_path.write_text(tsolve, encoding="utf-8")

          mind_path = Path("kanger/src/org/kanger/Mind.java")
          mind = mind_path.read_text(encoding="utf-8")
          old = "\n".join([
              "    public TSolve addTSolve(List<TValue> list) throws Exception {",
              "        TSolve tmp = findTSolve(list);",
              "        if (tmp != null) {",
              "            return tmp;",
              "        } else {",
              "            tmp = new TSolve(list, this);",
              "            TVariableSet ts = new TVariableSet(tmp, this);",
              "            if (!getRuleSolves().containsKey(ts)) {",
              "                getRuleSolves().put(ts, new ArrayList<>());",
              "            }",
              "            getRuleSolves().get(ts).add(tmp);",
              "            return tmp;",
              "        }",
              "    }",
          ])
          new = "\n".join([
              "    public TSolve addTSolve(List<TValue> list) throws Exception {",
              "        TSolve tmp = findTSolve(list);",
              "        if (tmp != null) {",
              "            SemanticEffectTelemetry.recordTSolveCandidate(false);",
              "            return tmp;",
              "        } else {",
              "            tmp = new TSolve(list, this);",
              "            TVariableSet ts = new TVariableSet(tmp, this);",
              "            if (!getRuleSolves().containsKey(ts)) {",
              "                getRuleSolves().put(ts, new ArrayList<>());",
              "            }",
              "            getRuleSolves().get(ts).add(tmp);",
              "            SemanticEffectTelemetry.recordTSolve(list);",
              "            SemanticEffectTelemetry.recordTSolveCandidate(true);",
              "            return tmp;",
              "        }",
              "    }",
          ])
          if mind.count(old) != 1:
              raise SystemExit("Unexpected Mind.addTSolve shape")
          mind = mind.replace(old, new, 1)
          mind_path.write_text(mind, encoding="utf-8")
          PY
          git diff --check
          git diff -- kanger/src/org/kanger/units/TSolve.java kanger/src/org/kanger/Mind.java

      - name: Commit canonical TSolve boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/units/TSolve.java kanger/src/org/kanger/Mind.java
          git commit -m "P5a: observe unique TSolve insertion"
          git push origin HEAD:arch/3.4.1-p5a-semantic-telemetry
