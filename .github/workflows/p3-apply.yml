name: Apply P3 positional index

on:
  push:
    branches:
      - "perf/3.3.5-positional-index"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run P3 patch once'
    runs-on: ubuntu-latest
    steps:
      - name: Check out P3 branch
        uses: actions/checkout@v4
        with:
          ref: perf/3.3.5-positional-index

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Apply positional index patch
        run: python3 scripts/apply_p3_positional_index.py

      - name: Compile patched sources
        run: mvn -B -DskipTests package

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/factory/RuleFactory.java \
                  kanger/src/org/kanger/Linker.java \
                  kanger/src/org/kanger/Analyzer.java
          git commit -m "P3: use positional Rule candidate index"
          git push origin HEAD:perf/3.3.5-positional-index
