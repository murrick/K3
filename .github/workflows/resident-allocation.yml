name: Resident allocation qualification
on:
  push:
    branches: ['experiment/3.8.0-resident-allocation']
  pull_request:
    branches: ['develop/3.8.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21', '26']
        prior: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -pl kanger-qualification -am install -DskipTests
      - name: Qualify reference and combined paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resident-allocation"
          for mode in 00 10 01 11; do
            name=false; snapshot=false
            [[ ${mode:0:1} == 1 ]] && name=true
            [[ ${mode:1:1} == 1 ]] && snapshot=true
            export JAVA_TOOL_OPTIONS="-Xmx512m -Dkanger.experiment.compactFindSnapshots=$snapshot -Dkanger.experiment.directPredicateName=$name -Dkanger.experiment.residentBaseComparison=${{ matrix.prior }} -Dkanger.experiment.singleTValueLookup=${{ matrix.prior }} -Dkanger.experiment.preserveTValueIndex=${{ matrix.prior }} -Dkanger.experiment.versionedSolveSync=${{ matrix.prior }} -Dkanger.experiment.resolvedCauseWeights=${{ matrix.prior }} -Dkanger.experiment.compactCauseWeights=${{ matrix.prior }} -Dkanger.experiment.candidateMembershipFilter=${{ matrix.prior }}"
            for runner in LatentSubstitutionCorpusRunner CompactFindSnapshotsRunner DirectPredicateNameRunner ResidentBaseComparisonRunner SingleTValueLookupRunner TValueIndexReopenRunner; do
              mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.$runner -Dexec.classpathScope=test exec:java > "$RUNNER_TEMP/resident-allocation/$mode-$runner.log" 2>&1
            done
            grep -q '^RESIDENT_BASE_COMPARISON_OK checks=48 custom_reads=3$' "$RUNNER_TEMP/resident-allocation/$mode-ResidentBaseComparisonRunner.log"
            grep -q '^SINGLE_LOOKUP_BOUNDARIES_OK checks=15$' "$RUNNER_TEMP/resident-allocation/$mode-SingleTValueLookupRunner.log"
            grep -q '^TVALUE_INDEX_REOPEN_PASS$' "$RUNNER_TEMP/resident-allocation/$mode-TValueIndexReopenRunner.log"
            grep -q '^LATENT_CORPUS_PASS$' "$RUNNER_TEMP/resident-allocation/$mode-LatentSubstitutionCorpusRunner.log"
            grep -q '^COMPACT_FIND_SNAPSHOTS_OK checks=23$' "$RUNNER_TEMP/resident-allocation/$mode-CompactFindSnapshotsRunner.log"
            grep -q '^DIRECT_PREDICATE_NAME_BOUNDARIES_OK checks=24$' "$RUNNER_TEMP/resident-allocation/$mode-DirectPredicateNameRunner.log"
            mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dtest=KangerCrossContextPredicateProjectionTest surefire:test > "$RUNNER_TEMP/resident-allocation/$mode-projection.log" 2>&1
            mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.LatentSolveSyncTransactionRunner -Dexec.classpathScope=test "-Dexec.args=$RUNNER_TEMP/resident-allocation/$mode.state $RUNNER_TEMP/resident-allocation/$mode.work" exec:java > "$RUNNER_TEMP/resident-allocation/$mode-transactions.log" 2>&1
            grep -q '^LATENT_SOLVE_TRANSACTIONS_PASS operations=20$' "$RUNNER_TEMP/resident-allocation/$mode-transactions.log"
          done
          for mode in 10 01 11; do cmp "$RUNNER_TEMP/resident-allocation/00.state" "$RUNNER_TEMP/resident-allocation/$mode.state"; done
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dkanger.rule.candidate.concurrency.iterations=3"
          mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.KangerRuleCandidateConcurrencyRunner -Dexec.classpathScope=test exec:java > "$RUNNER_TEMP/resident-allocation/concurrency.log" 2>&1
          grep -q '^RULE_CANDIDATE_CONCURRENCY_OK iterations=3$' "$RUNNER_TEMP/resident-allocation/concurrency.log"
      - name: Print failure logs
        if: failure()
        run: tail -100 "$RUNNER_TEMP/resident-allocation/"*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-allocation-java-${{ matrix.java }}-prior-${{ matrix.prior }}
          path: ${{ runner.temp }}/resident-allocation/
