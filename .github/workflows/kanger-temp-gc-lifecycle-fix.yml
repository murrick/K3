name: TEMP KANGER GC lifecycle correction

on:
  push:
    branches:
      - audit/3.7.0.9-gc-lifecycle

permissions:
  contents: write

jobs:
  apply-exact-core-fix:
    if: github.event.head_commit.message != 'fix core technical Mind settlement on compile failures'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply exact exception-safe technical Mind settlement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('kanger/src/org/kanger/Mind.java')
          text = path.read_text(encoding='utf-8')

          compile_start = '    public boolean compile(String src, Object[] ext, boolean logging) throws Exception {'
          compile_line_start = '    public Object compileLine(String line, boolean query, Queue<ITerm> externals) throws Exception {'
          source_name_start = '    @Override\n    public String getSourceFileName()'

          def one_index(haystack, marker, label):
              first = haystack.find(marker)
              if first < 0:
                  raise SystemExit(f'{label}: marker not found')
              second = haystack.find(marker, first + 1)
              if second >= 0:
                  raise SystemExit(f'{label}: marker is not unique')
              return first

          c0 = one_index(text, compile_start, 'compile start')
          c1 = one_index(text, compile_line_start, 'compileLine start')
          c2 = one_index(text, source_name_start, 'source-name boundary')
          if not (c0 < c1 < c2):
              raise SystemExit('method boundaries are not ordered')

          old_compile = text[c0:c1]
          old_compile_line = text[c1:c2]

          expected_compile = [
              'Mind m = new Mind(this);',
              'Object r = m.compileLine(',
              'release(m);',
              'commit(m);',
          ]
          expected_compile_line = [
              'Mind x = new Mind(this);',
              'Leaf p = Parser.parse(',
              'r = x.compiler.compileLine(',
              'release(x);',
              'commit(x);',
          ]
          for marker in expected_compile:
              if old_compile.count(marker) != 1:
                  raise SystemExit(f'compile guard failed for {marker!r}: {old_compile.count(marker)}')
          for marker in expected_compile_line:
              if old_compile_line.count(marker) != 1:
                  raise SystemExit(f'compileLine guard failed for {marker!r}: {old_compile_line.count(marker)}')
          if 'finalizationStarted' in old_compile or 'finalizationStarted' in old_compile_line:
              raise SystemExit('lifecycle correction already present')

          new_compile = textwrap.dedent('''
              public boolean compile(String src, Object[] ext, boolean logging) throws Exception {
                  this.logging = logging;

                  getQueryValues().clear();
                  getLog().clear();
                  getSolutions().clear();
                  getValues().clear();
                  getHypothesis().clear();

                  Token t = null;
                  Mind m = new Mind(this);
                  boolean finalizationStarted = false;
                  try {
                      m.setQueryPass(QueryPass.ACCEPT);
                      int previousPos = 0;
                      Queue<ITerm> externals = convertExternals(ext);

                      while ((t = Tools.extractLine(src, t)) != null) {
                          String comment = src.substring(previousPos, t.getPos()).trim();
                          if (previousPos == 0) {
                              String[] cc = Parser.extractComments(comment);
                              if (cc.length > 1 && !cc[0].isEmpty()) {
                                  m.getComments().add(CommentFactory.HEADER_ID, cc[0].trim());
                                  comment = comment.substring(cc[0].length()).trim();
                              }
                          }
                          previousPos = t.getPos() + t.getLen();

                          Object r = m.compileLine(t.getToken(src), false, externals);
                          if (!comment.isEmpty() && r instanceof Rule) {
                              m.getComments().add(((Rule) r).getId(), comment);
                          }
                      }

                      if (t != null && src.length() > t.getPos() + t.getLen()) {
                          String comment = src.substring(t.getPos() + t.getLen()).trim();
                          if (!comment.isEmpty()) {
                              m.getComments().add(CommentFactory.FOOTER_ID, comment);
                          }
                      }

                      m.link(null, logging);
                      Boolean ar = m.analyze(null, logging);

                      if (ar) {
                          if (logging) {
                              m.getLog().add(LogMode.ANALYZER, "ERROR: Collisions in Program");
                          }
                          finalizationStarted = true;
                          release(m);
                          return false;
                      } else {
                          if (logging) {
                              m.getLog().add(LogMode.ANALYZER, "SUCCESS: No Collisions in Program");
                          }
                          finalizationStarted = true;
                          commit(m);
                          return true;
                      }
                  } catch (Throwable failure) {
                      if (!finalizationStarted) {
                          try {
                              release(m);
                          } catch (Throwable cleanupFailure) {
                              if (cleanupFailure != failure) {
                                  failure.addSuppressed(cleanupFailure);
                              }
                          }
                      }
                      rethrow(failure);
                      throw new AssertionError("unreachable");
                  }
              }
          ''').lstrip('\n')
          new_compile = textwrap.indent(new_compile, '    ')

          new_compile_line = textwrap.dedent('''
              public Object compileLine(String line, boolean query, Queue<ITerm> externals) throws Exception {
                  String orig = line.trim();
                  compliedLine = orig;
                  Object r = null;
                  Boolean suc = null;

                  switch (line.charAt(0)) {
                      case Enums.FOO:
                          r = Parser.implement(line.substring(1), this, null);
                          if (r != null) {
                              library.add((Operation) r);
                          }
                          break;
                      case Enums.INS:
                      case Enums.ANT:
                          suc = true;
                          break;
                      case Enums.DEL:
                      case Enums.SUC:
                          suc = false;
                          break;
                  }
                  if (suc != null) {
                      Mind x = new Mind(this);
                      boolean finalizationStarted = false;
                      try {
                          Leaf p = Parser.parse(line.substring(1));

                          r = x.compiler.compileLine(p, suc, orig, query, externals);
                          x.setCompliedLine(compliedLine);
                          if (r instanceof Rule && ((Rule) r).isSecond()) {
                              finalizationStarted = true;
                              release(x);
                              log.add(LogMode.ANALYZER, "WARNING: Rule is duplicated: " + r);
                              r = null;
                          } else if (r instanceof Rule) {
                              finalizationStarted = true;
                              commit(x);
                              log.add(LogMode.ANALYZER, "Compiled: " + ((Rule) r).getOrigin());
                              log.add(LogMode.ANALYZER, (Rule) r);
                              for (IRule rx : rules) {
                                  if (rx.getId() > ((Rule) r).getId() /*&& rx.isGenerated()*/) {
                                      log.add(LogMode.ANALYZER, "Extracted: " + rx.getOrigin());
                                  }
                              }
                          } else {
                              finalizationStarted = true;
                              release(x);
                          }
                      } catch (Throwable failure) {
                          if (!finalizationStarted) {
                              try {
                                  release(x);
                              } catch (Throwable cleanupFailure) {
                                  if (cleanupFailure != failure) {
                                      failure.addSuppressed(cleanupFailure);
                                  }
                              }
                          }
                          rethrow(failure);
                          throw new AssertionError("unreachable");
                      }
                  }
                  return r;
              }
          ''').lstrip('\n')
          new_compile_line = textwrap.indent(new_compile_line, '    ')

          text = text[:c0] + new_compile + '\n' + new_compile_line + '\n' + text[c2:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "kanger/src/org/kanger/Mind.java"
          git diff -- kanger/src/org/kanger/Mind.java

      - name: Run focused GC lifecycle gate on Java 21
        shell: bash
        run: |
          mvn -B -ntp -f kanger-server/pom.xml \
            -Dtest=GcTransactionQuiescenceTest test

      - name: Commit qualified core correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Mind.java
          git commit -m "fix core technical Mind settlement on compile failures"
          git push origin HEAD:audit/3.7.0.9-gc-lifecycle
