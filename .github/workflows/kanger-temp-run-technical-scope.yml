name: TEMP run Core technical transaction refactor

on:
  push:
    branches:
      - arch/3.7.0.9-technical-transaction-scope

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: run technical transaction refactor applicator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract and apply guarded refactor script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/kanger-temp-technical-transaction-scope.yml').read_text(encoding='utf-8').splitlines()
          start_marker = "          python3 - <<'PY'"
          end_marker = '          PY'
          start = source.index(start_marker) + 1
          end = source.index(end_marker, start)
          body = []
          for line in source[start:end]:
              if not line.startswith('          '):
                  raise SystemExit('unexpected applicator indentation: ' + repr(line))
              body.append(line[10:])
          Path('/tmp/apply-technical-scope.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-technical-scope.py

      - name: Validate ownership diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "kanger/src/org/kanger/Mind.java"
          if grep -n 'Mind [mx] = new Mind(this);' kanger/src/org/kanger/Mind.java; then
            echo 'unmigrated operation-local child remains in Mind.java' >&2
            exit 1
          fi
          git diff --stat

      - name: Run focused ownership gate
        shell: bash
        run: |
          mvn -B -ntp -f kanger-server/pom.xml -Dtest=GcTransactionQuiescenceTest test

      - name: Commit scope migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanger/src/org/kanger/Mind.java
          git commit -m "refactor core operation-local transaction ownership"
          git push origin HEAD:arch/3.7.0.9-technical-transaction-scope
