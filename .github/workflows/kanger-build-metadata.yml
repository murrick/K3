name: KANGER build metadata

on:
  pull_request:
    paths:
      - 'build.xml'
      - 'kanger/src/org/kanger/Version.java'
      - '.github/workflows/kanger-build-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-stamp:
    name: Branch-stamped console banner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ant

      - name: Stamp branch metadata
        shell: bash
        run: |
          set -euo pipefail
          ant init

          expected_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test -n "$expected_branch"

          grep -Fq "public static final String BRANCH = \"${expected_branch}\";" \
            kanger/src/org/kanger/Version.java
          grep -Fq 'public static final String VERSION_S = BRANCH;' \
            kanger/src/org/kanger/Version.java
          grep -Fq 'Stabilized and audited in collaboration with ChatGPT.' \
            kanger/src/org/kanger/Version.java
          test ! -e .build.number

      - name: Compile stamped source tree
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests compile
