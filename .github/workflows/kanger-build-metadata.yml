name: KANGER build metadata

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'kanger/src/org/kanger/Version.java'
      - '.github/workflows/kanger-build-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-stamp:
    name: Branch-stamped console banner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Package branch-stamped JAR with Maven
        shell: bash
        run: |
          set -euo pipefail

          expected_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          expected_product_version='3.7.0'
          test -n "$expected_branch"

          mvn --batch-mode --no-transfer-progress -DskipTests clean package

          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$jar_file"

          unzip -p "$jar_file" org/kanger/build.properties > target/packaged-build.properties
          grep -Fxq "branch=${expected_branch}" target/packaged-build.properties
          grep -Eq '^date=[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}:[0-9]{2}:[0-9]{2}$' \
            target/packaged-build.properties

          java -jar "$jar_file" --help > target/maven-banner.txt
          grep -Fq "KANGER III, Version ${expected_product_version}" target/maven-banner.txt
          grep -Fq 'Stabilized and audited in collaboration with ChatGPT.' \
            target/maven-banner.txt

          git diff --exit-code -- pom.xml kanger/src/org/kanger/Version.java

      - name: Verify explicit artifact override
        shell: bash
        run: |
          set -euo pipefail

          artifact_branch='develop/3.5.0.6'
          expected_product_version='3.7.0'
          mvn --batch-mode --no-transfer-progress \
            -DskipTests \
            -Dkanger.build.branch.override="$artifact_branch" \
            clean package

          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          unzip -p "$jar_file" org/kanger/build.properties > target/artifact-build.properties
          grep -Fxq "branch=${artifact_branch}" target/artifact-build.properties
          java -jar "$jar_file" --help > target/artifact-banner.txt
          grep -Fq "KANGER III, Version ${expected_product_version}" target/artifact-banner.txt
