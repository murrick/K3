name: Single TValue lookup qualification
on:
  push:
    branches: ['perf/3.8.0-single-tvalue-lookup', 'develop/3.8.0']
  pull_request:
    branches: ['develop/3.8.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -pl kanger-qualification -am install -DskipTests
      - name: Qualify reference and single lookup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/single-lookup"
          for mode in false true; do
            export JAVA_TOOL_OPTIONS="-Xmx512m -Dkanger.experiment.singleTValueLookup=$mode -Dkanger.experiment.preserveTValueIndex=true -Dkanger.experiment.versionedSolveSync=true -Dkanger.experiment.resolvedCauseWeights=true -Dkanger.experiment.compactCauseWeights=true -Dkanger.experiment.candidateMembershipFilter=true"
            for runner in LatentSubstitutionCorpusRunner SingleTValueLookupRunner; do
              mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.$runner -Dexec.classpathScope=test exec:java > "$RUNNER_TEMP/single-lookup/$mode-$runner.log" 2>&1
            done
            grep -q '^LATENT_CORPUS_PASS$' "$RUNNER_TEMP/single-lookup/$mode-LatentSubstitutionCorpusRunner.log"
            grep -q '^SINGLE_LOOKUP_BOUNDARIES_OK checks=15$' "$RUNNER_TEMP/single-lookup/$mode-SingleTValueLookupRunner.log"
            mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.LatentSolveSyncTransactionRunner -Dexec.classpathScope=test "-Dexec.args=$RUNNER_TEMP/single-lookup/$mode.state $RUNNER_TEMP/single-lookup/$mode.work" exec:java > "$RUNNER_TEMP/single-lookup/$mode-transactions.log" 2>&1
            grep -q '^LATENT_SOLVE_TRANSACTIONS_PASS operations=20$' "$RUNNER_TEMP/single-lookup/$mode-transactions.log"
          done
          cmp "$RUNNER_TEMP/single-lookup/false.state" "$RUNNER_TEMP/single-lookup/true.state"
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dkanger.rule.candidate.concurrency.iterations=3"
          mvn --batch-mode --no-transfer-progress -f kanger-qualification/pom.xml -Dexec.mainClass=org.kanger.KangerRuleCandidateConcurrencyRunner -Dexec.classpathScope=test exec:java > "$RUNNER_TEMP/single-lookup/concurrency.log" 2>&1
          grep -q '^RULE_CANDIDATE_CONCURRENCY_OK iterations=3$' "$RUNNER_TEMP/single-lookup/concurrency.log"
      - name: Print failure logs
        if: failure()
        run: tail -100 "$RUNNER_TEMP/single-lookup/"*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-lookup-java-${{ matrix.java }}
          path: ${{ runner.temp }}/single-lookup/
