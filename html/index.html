<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KANGER III</title>
    <script src="config.js"></script>
    <style>
        :root { color-scheme: light; font-family: Helvetica, Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f3f4f6; color: #202124; }
        .shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { width: min(440px, 100%); background: #fff; border: 1px solid #d8dce2; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.08); padding: 28px; }
        h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
        .version { color: #6a717c; font-size: 13px; margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #4b525c; }
        input { width: 100%; border: 1px solid #b8bec7; border-radius: 5px; padding: 10px 11px; font-size: 15px; }
        input:focus { outline: 2px solid #6d8f6d; outline-offset: 1px; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
        button { border: 1px solid #777f89; border-radius: 5px; background: #fff; padding: 9px 14px; cursor: pointer; font-size: 14px; }
        button.primary { background: #405b40; color: #fff; border-color: #405b40; }
        button.danger { color: #8d2d2d; border-color: #b77; }
        button:disabled { opacity: .55; cursor: default; }
        .notice { min-height: 22px; margin: 14px 0 2px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
        .notice.error { color: #9b2f2f; }
        .notice.success { color: #286b35; }
        .policy { margin: 12px 0 18px; padding: 10px 12px; background: #f7f8fa; border-left: 3px solid #7b858f; font-size: 13px; line-height: 1.45; }
        .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.35; }
        .check input { width: auto; margin-top: 2px; }
        .hidden { display: none !important; }
        #console-view { position: fixed; inset: 0; background: #fff; }
        #console-frame { width: 100%; height: 100%; border: 0; display: block; }
        .pending-email { font-weight: 600; }
    </style>
</head>
<body>
<div id="auth-shell" class="shell">
    <main class="card" aria-live="polite">
        <h1>KANGER III</h1>
        <div id="version" class="version">Connecting to server…</div>
        <div id="policy" class="policy">Loading authentication policy…</div>

        <section id="login-view">
            <form id="login-form">
                <div class="field">
                    <label for="login">Login</label>
                    <input id="login" name="login" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="actions">
                    <button id="open-register" type="button" class="hidden">Register</button>
                    <button type="submit" class="primary">Sign in</button>
                </div>
            </form>
        </section>

        <section id="register-view" class="hidden">
            <form id="register-form">
                <div class="field"><label for="register-login">Login</label><input id="register-login" autocomplete="username" required></div>
                <div class="field"><label for="register-email">E-mail</label><input id="register-email" type="email" autocomplete="email" required></div>
                <div class="field"><label for="register-name">Name</label><input id="register-name" autocomplete="name"></div>
                <div class="field"><label for="register-country">Country</label><input id="register-country" autocomplete="country-name"></div>
                <div class="field"><label for="register-city">City</label><input id="register-city" autocomplete="address-level2"></div>
                <div class="field"><label for="register-password">Password</label><input id="register-password" type="password" autocomplete="new-password" required></div>
                <div class="field"><label for="register-password-repeat">Repeat password</label><input id="register-password-repeat" type="password" autocomplete="new-password" required></div>
                <label class="check"><input id="privacy" type="checkbox" required><span>I consent to the processing of personal data for account registration.</span></label>
                <div class="actions">
                    <button id="cancel-register" type="button">Back</button>
                    <button type="submit" class="primary">Create registration</button>
                </div>
            </form>
        </section>

        <section id="pending-view" class="hidden">
            <p>E-mail confirmation is required for <span id="pending-email" class="pending-email"></span>.</p>
            <p>The confirmation link activates the account but does not sign you in. Return here and use the ordinary login form afterwards.</p>
            <div class="field"><label for="pending-new-email">New unconfirmed e-mail</label><input id="pending-new-email" type="email"></div>
            <div class="actions">
                <button id="pending-back" type="button">Back to login</button>
                <button id="pending-resend" type="button">Resend</button>
                <button id="pending-change" type="button">Change e-mail</button>
                <button id="pending-cancel" type="button" class="danger">Cancel registration</button>
            </div>
        </section>

        <div id="notice" class="notice"></div>
    </main>
</div>
<div id="console-view" class="hidden"><iframe id="console-frame" title="KANGER owner console"></iframe></div>

<script>
(function () {
    'use strict';

    var API_HOST = String(window.KANGER_API_HOST || '').replace(/\/$/, '');
    var state = {
        capabilities: null,
        pendingActionToken: sessionStorage.getItem('kanger.pendingActionToken') || '',
        consoleTemplate: null,
        tokenMonitor: null
    };

    var views = {
        login: document.getElementById('login-view'),
        register: document.getElementById('register-view'),
        pending: document.getElementById('pending-view')
    };
    var notice = document.getElementById('notice');
    var policy = document.getElementById('policy');
    var version = document.getElementById('version');
    var registerButton = document.getElementById('open-register');

    function setCookie(name, value) {
        var secure = location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value)
                + '; Path=/; SameSite=Lax' + secure;
    }

    function getCookie(name) {
        var prefix = encodeURIComponent(name) + '=';
        var parts = document.cookie.split(';');
        for (var i = 0; i < parts.length; i++) {
            var item = parts[i].trim();
            if (item.indexOf(prefix) === 0) {
                return decodeURIComponent(item.substring(prefix.length));
            }
        }
        return '';
    }

    function clearApplicationSession() {
        setCookie('token', '');
        setCookie('login', '');
    }

    function setPendingToken(token) {
        state.pendingActionToken = token || '';
        if (state.pendingActionToken) {
            sessionStorage.setItem('kanger.pendingActionToken', state.pendingActionToken);
        } else {
            sessionStorage.removeItem('kanger.pendingActionToken');
        }
    }

    function showView(name) {
        Object.keys(views).forEach(function (key) {
            views[key].classList.toggle('hidden', key !== name);
        });
    }

    function message(text, type) {
        notice.textContent = text || '';
        notice.className = 'notice' + (type ? ' ' + type : '');
    }

    function describeError(data, fallback) {
        if (data && data.description) {
            return String(data.description);
        }
        return fallback;
    }

    async function post(context, parameters) {
        if (!API_HOST) {
            throw new Error('KANGER API host is not configured');
        }
        var response = await fetch(API_HOST + '/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            cache: 'no-store',
            credentials: 'omit',
            body: JSON.stringify({context: context, parameters: parameters || {}})
        });
        var text = await response.text();
        var data;
        try {
            data = text ? JSON.parse(text) : {};
        } catch (error) {
            throw new Error('Server returned an invalid JSON response');
        }
        if (!response.ok) {
            throw new Error(describeError(data, 'HTTP ' + response.status));
        }
        return data;
    }

    function applyCapabilities(data) {
        var auth = data && data.auth;
        if (!auth || typeof auth.public_registration !== 'boolean'
                || !auth.registration_policy) {
            state.capabilities = null;
            registerButton.classList.add('hidden');
            policy.textContent = 'The server did not publish a valid authentication capability snapshot. Public registration is unavailable.';
            throw new Error('Authentication capabilities are unavailable');
        }
        state.capabilities = auth;
        registerButton.classList.toggle('hidden', !auth.public_registration);
        if (auth.registration_policy === 'TRUSTED') {
            policy.textContent = 'Trusted deployment: accounts are provisioned by the server operator. Public registration is disabled.';
        } else if (auth.registration_policy === 'EMAIL_VERIFIED') {
            policy.textContent = 'E-mail verified deployment: registration creates a pending request. Confirmation activates the account; sign-in remains a separate step.';
        } else {
            registerButton.classList.add('hidden');
            policy.textContent = 'Unknown authentication policy. Public registration is unavailable.';
            throw new Error('Unknown authentication policy');
        }
    }

    async function loadCapabilities() {
        var data = await post('version', {});
        version.textContent = data.version || data.server_version || 'KANGER Server';
        applyCapabilities(data);
    }

    async function validateStoredSession() {
        var token = getCookie('token');
        if (!token) {
            return false;
        }
        var data = await post('command', {token: token, ping: ''});
        if (data.result !== 'OK') {
            clearApplicationSession();
            return false;
        }
        return true;
    }

    function updatePendingFromResponse(data) {
        if (data && data.pending_action_token) {
            setPendingToken(String(data.pending_action_token));
        }
        document.getElementById('pending-email').textContent = data && data.email_hint
                ? String(data.email_hint) : 'the registered address';
    }

    async function login(event) {
        event.preventDefault();
        message('Signing in…');
        var loginValue = document.getElementById('login').value.trim();
        var password = document.getElementById('password').value;
        try {
            var data = await post('login', {login: loginValue, password: password});
            document.getElementById('password').value = '';
            if (data.result === 'OK' && data.token) {
                setPendingToken('');
                setCookie('token', String(data.token));
                setCookie('login', loginValue);
                message('');
                await launchConsole();
                return;
            }
            if (data.code === 'EMAIL_CONFIRMATION_REQUIRED'
                    && data.pending_action_token) {
                updatePendingFromResponse(data);
                showView('pending');
                message('Confirm the e-mail address, or use one of the scoped pending-registration actions.');
                return;
            }
            message(describeError(data, 'Authentication failed'), 'error');
        } catch (error) {
            document.getElementById('password').value = '';
            message(error.message, 'error');
        }
    }

    async function register(event) {
        event.preventDefault();
        if (!state.capabilities || !state.capabilities.public_registration) {
            message('Public registration is disabled by server policy.', 'error');
            return;
        }
        var password = document.getElementById('register-password').value;
        var repeated = document.getElementById('register-password-repeat').value;
        if (password !== repeated) {
            message('Password confirmation does not match.', 'error');
            return;
        }
        if (!document.getElementById('privacy').checked) {
            message('Privacy consent is required.', 'error');
            return;
        }
        message('Creating pending registration…');
        var parameters = {
            register: document.getElementById('register-login').value.trim(),
            password: password,
            email: document.getElementById('register-email').value.trim(),
            name: document.getElementById('register-name').value.trim(),
            country: document.getElementById('register-country').value.trim(),
            city: document.getElementById('register-city').value.trim(),
            privacy: true,
            token: ''
        };
        try {
            var data = await post('login', parameters);
            document.getElementById('register-password').value = '';
            document.getElementById('register-password-repeat').value = '';
            if (data.result === 'OK' && data.state === 'PENDING_CONFIRMATION') {
                document.getElementById('login').value = parameters.register;
                showView('login');
                message('Registration is pending for ' + (data.email_hint || 'the supplied e-mail')
                        + '. Follow the confirmation link, then sign in here.', 'success');
                return;
            }
            var suffix = data && data.state === 'PENDING_CONFIRMATION'
                    ? ' The pending registration remains available; sign in with the same credentials to manage it.' : '';
            message(describeError(data, 'Registration failed') + suffix, 'error');
        } catch (error) {
            document.getElementById('register-password').value = '';
            document.getElementById('register-password-repeat').value = '';
            message(error.message, 'error');
        }
    }

    async function pendingAction(parameters, successText) {
        if (!state.pendingActionToken) {
            showView('login');
            message('Sign in with the pending registration credentials to obtain a scoped action token.', 'error');
            return;
        }
        parameters.pending_action_token = state.pendingActionToken;
        try {
            var data = await post('login', parameters);
            updatePendingFromResponse(data);
            if (data.result === 'OK') {
                message(successText, 'success');
            } else {
                message(describeError(data, 'Pending registration action failed'), 'error');
            }
        } catch (error) {
            message(error.message, 'error');
        }
    }

    async function cancelPending() {
        if (!state.pendingActionToken) {
            showView('login');
            message('No scoped pending-registration token is available.', 'error');
            return;
        }
        try {
            var data = await post('login', {
                pending_action_token: state.pendingActionToken,
                cancel_pending: ''
            });
            if (data.result === 'OK') {
                setPendingToken('');
                showView('login');
                message('Pending registration cancelled.', 'success');
            } else {
                message(describeError(data, 'Pending registration could not be cancelled'), 'error');
            }
        } catch (error) {
            message(error.message, 'error');
        }
    }

    async function launchConsole() {
        document.getElementById('auth-shell').classList.add('hidden');
        document.getElementById('console-view').classList.remove('hidden');
        try {
            if (!state.consoleTemplate) {
                var response = await fetch('console.html', {cache: 'no-store'});
                if (!response.ok) {
                    throw new Error('Owner console payload is unavailable');
                }
                state.consoleTemplate = await response.text();
            }
            var marker = 'window.apihost = "http://localhost:1964";';
            if (state.consoleTemplate.indexOf(marker) < 0) {
                throw new Error('Owner console API marker is unavailable');
            }
            var consoleDocument = state.consoleTemplate.replace(
                    marker, 'window.apihost = ' + JSON.stringify(API_HOST) + ';');
            consoleDocument = consoleDocument.replace('<head>', '<head><base href="./">');
            document.getElementById('console-frame').srcdoc = consoleDocument;
            if (state.tokenMonitor) {
                clearInterval(state.tokenMonitor);
            }
            state.tokenMonitor = setInterval(function () {
                if (!getCookie('token')) {
                    clearInterval(state.tokenMonitor);
                    state.tokenMonitor = null;
                    document.getElementById('console-frame').srcdoc = '';
                    document.getElementById('console-view').classList.add('hidden');
                    document.getElementById('auth-shell').classList.remove('hidden');
                    showView('login');
                    message('Session closed. Sign in again.');
                }
            }, 500);
        } catch (error) {
            document.getElementById('console-view').classList.add('hidden');
            document.getElementById('auth-shell').classList.remove('hidden');
            clearApplicationSession();
            message(error.message, 'error');
        }
    }

    document.getElementById('login-form').addEventListener('submit', login);
    document.getElementById('register-form').addEventListener('submit', register);
    registerButton.addEventListener('click', function () { showView('register'); message(''); });
    document.getElementById('cancel-register').addEventListener('click', function () { showView('login'); message(''); });
    document.getElementById('pending-back').addEventListener('click', function () { showView('login'); message(''); });
    document.getElementById('pending-resend').addEventListener('click', function () {
        pendingAction({resend: ''}, 'A new confirmation e-mail was queued.');
    });
    document.getElementById('pending-change').addEventListener('click', function () {
        var email = document.getElementById('pending-new-email').value.trim();
        if (!email) {
            message('Enter the new unconfirmed e-mail address.', 'error');
            return;
        }
        pendingAction({change_pending_email: '', email: email}, 'The pending e-mail address was changed and a new confirmation was queued.');
    });
    document.getElementById('pending-cancel').addEventListener('click', cancelPending);

    (async function initialize() {
        try {
            await loadCapabilities();
            var query = new URLSearchParams(location.search);
            if (query.get('confirmation') === 'success'
                    || query.get('confirmed') === 'true') {
                message('E-mail confirmed. Sign in to create a session.', 'success');
                history.replaceState(null, '', location.pathname);
            }
            if (await validateStoredSession()) {
                await launchConsole();
            } else {
                showView('login');
                document.getElementById('login').focus();
            }
        } catch (error) {
            showView('login');
            message(error.message, 'error');
        }
    }());
}());
</script>
</body>
</html>
